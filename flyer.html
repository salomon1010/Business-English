  :root{

    --acc:#6366f1; --acc2:#22d3ee; --gold:#fbbf24; --green:#34d399;
    --grad:linear-gradient(120deg,#6366f1,#22d3ee);
  }
  :root[data-theme="light"]{--bg:#f6f8fc;--bg2:#eef2fa;--card:#fff;--card2:#f3f6fc;
    --line:rgba(15,23,42,.09);--line2:rgba(15,23,42,.16);
    --txt:#0f172a;--mut:#475569;--mut2:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.55;overflow-x:hidden}
  html[dir="rtl"] body{direction:rtl}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  a{text-decoration:none}
  em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  .hero{position:relative;padding:64px 0 48px;background:
    radial-gradient(1200px 500px at 80% -10%,rgba(99,102,241,.22),transparent 60%),
    radial-gradient(900px 400px at 0% 10%,rgba(34,211,238,.14),transparent 55%),var(--bg)}
  .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:24px}
  .brand-logo{width:48px;height:48px;border-radius:14px;background:#0b1220;
    box-shadow:0 0 0 3px rgba(34,211,238,.3),0 12px 34px rgba(34,211,238,.4)}
  .brand-name{font-size:23px;font-weight:800;letter-spacing:-.3px;line-height:1}
  .brand-name b{color:var(--txt)}
  .kicker{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--acc2);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;margin-bottom:20px}
  h1{font-size:clamp(30px,6vw,54px);line-height:1.08;letter-spacing:-1px;font-weight:800;max-width:17ch}
  .sub{font-size:clamp(15px,2.3vw,18.5px);color:var(--mut);margin:20px 0 26px;max-width:60ch}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .cta{display:inline-flex;align-items:center;gap:9px;background:var(--grad);color:#08111f;font-weight:800;
    font-size:16px;padding:15px 26px;border-radius:14px;box-shadow:0 14px 40px rgba(34,211,238,.28);transition:.16s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 20px 50px rgba(34,211,238,.4)}
  .cta-ghost{display:inline-flex;align-items:center;gap:8px;color:var(--txt);font-weight:700;font-size:15px;
    padding:15px 22px;border-radius:14px;border:1px solid var(--line2);transition:.16s}
  .cta-ghost:hover{border-color:var(--acc);transform:translateY(-2px)}
  .cta svg,.cta-ghost svg{width:19px;height:19px}
  .free-line{font-size:13px;color:var(--mut2);margin-top:18px;max-width:58ch}
  .hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:34px;align-items:center}
  @media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:30px}}
  .hero-shot{display:flex;justify-content:center}
  .phone{position:relative;width:min(272px,72vw);border-radius:36px;padding:9px;
    background:linear-gradient(150deg,rgba(99,102,241,.55),rgba(34,211,238,.42));
    box-shadow:0 34px 80px rgba(34,211,238,.28)}
  .phone::after{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:80px;height:5px;border-radius:5px;background:rgba(0,0,0,.35);z-index:2}
  .phone img{width:100%;display:block;border-radius:28px;border:1px solid var(--line2)}
  .shots{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:34px}
  .shotc{flex:0 1 320px;border-radius:16px;padding:8px;background:linear-gradient(150deg,rgba(99,102,241,.38),rgba(34,211,238,.3));box-shadow:0 18px 44px rgba(34,211,238,.18)}
  .shotc img{width:100%;height:210px;object-fit:cover;object-position:top;display:block;border-radius:11px;border:1px solid var(--line2)}
  .maker{text-align:center;padding:34px 0 6px}
  .maker .badge2{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:999px;padding:9px 18px;font-size:13.5px;color:var(--mut)}
  .maker .badge2 b{color:var(--txt)}

  .band{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0}
  .band-in{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center}
  .stat .n{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-1px}
  .stat .n span{font-size:.45em;font-weight:700;color:var(--mut)}
  .stat .l{font-size:12.5px;color:var(--mut);margin-top:3px}
  @media(max-width:560px){.band-in{grid-template-columns:repeat(2,1fr);gap:22px 12px}}

  .sect{padding:58px 0}
  .sect h2{font-size:clamp(24px,4vw,36px);font-weight:800;letter-spacing:-.6px;text-align:center;max-width:22ch;margin:0 auto}
  .lead{text-align:center;color:var(--mut);max-width:60ch;margin:14px auto 0;font-size:15.5px}

  .bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:38px}
  .b{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:22px 20px;transition:.16s;text-align:center}
  .b:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 18px 44px rgba(99,102,241,.16)}
  .b.hi{background:linear-gradient(150deg,rgba(99,102,241,.14),rgba(34,211,238,.08));border-color:rgba(34,211,238,.4)}
  .b .ic{width:46px;height:46px;border-radius:13px;background:var(--card2);display:grid;place-items:center;color:var(--acc2);margin:0 auto 14px}
  .b .ic svg{width:24px;height:24px}
  .b .badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    color:#08111f;background:var(--gold);border-radius:6px;padding:2px 7px;margin-inline-start:8px;vertical-align:middle}
  .b h3{font-size:17px;font-weight:800;margin-bottom:6px}
  .b p{font-size:13.5px;color:var(--mut);line-height:1.6}

  .how{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
  .step{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:24px 20px;text-align:center}
  .step .num{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#08111f;font-weight:800;
    display:grid;place-items:center;margin:0 auto 12px;font-size:18px}
  .step p{font-size:14.5px;font-weight:600}
  @media(max-width:640px){.steps{grid-template-columns:1fr}}

  .final{padding:70px 0;text-align:center;background:
    radial-gradient(800px 400px at 50% 120%,rgba(99,102,241,.22),transparent 60%),var(--bg)}
  .final h2{font-size:clamp(26px,5vw,42px);font-weight:800;letter-spacing:-.8px;max-width:20ch;margin:0 auto 26px}
  .foot{text-align:center;color:var(--mut2);font-size:12.5px;padding:26px 0 40px}
  .foot a{color:var(--acc2)}
</style>

var RTL={ar:1,ur:1,fa:1,he:1};
function pickLang(){
  var q=new URLSearchParams(location.search).get("lang");
  var c=(q||navigator.language||"en").toLowerCase().split("-")[0];
  return FL[c]?c:"en";
}
function render(){
  var code=pickLang(), d=FL[code];
  document.documentElement.lang=code;
  document.documentElement.dir=RTL[code]?"rtl":"ltr";
  document.querySelectorAll("[data-k]").forEach(function(el){
    var k=el.getAttribute("data-k");
    var v=d[k]!=null?d[k]:FL.en[k];   // fall back to English for any untranslated key
    if(v!=null)el.textContent=v;
  });
  var g=document.getElementById("bgrid");g.innerHTML="";
  (d.ben||[]).forEach(function(b,i){
    var card=document.createElement("div");
    card.className="b"+(i===0?" hi":"");
    card.innerHTML='<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[i]+'</svg></div>'+
      '<h3>'+b[0]+(b[2]?'<span class="badge">'+b[2]+'</span>':'')+'</h3><p>'+b[1]+'</p>';
    g.appendChild(card);
  });
}
render();
