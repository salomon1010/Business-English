# Cloudflare Worker config for BE Mastery daily reminders (Lomonec LLC).
#
# This is a SECOND Worker, separate from be-polish. Keep it that way: the
# reminder cron runs every minute and must never be able to take the Executive
# Polish endpoint down with it.
#
# Deploy from this folder:
#     npx wrangler kv namespace create SUBS      # once — copy the id below
#     npx wrangler secret put VAPID_PRIVATE_JWK  # once — paste genkeys.js output
#     npx wrangler deploy
#
# VAPID_PRIVATE_JWK is a secret and lives only in Cloudflare. The public key is
# a plain var: it is meant to be public, the browser needs it to subscribe.

name = "be-push"
main = "push-worker.js"
compatibility_date = "2026-07-31"
# A Worker's fetch to another Worker on this account's workers.dev subdomain
# is refused (Cloudflare 1042) without this flag: /programme (learning nudges)
# and /presence (online alerts) on the partner Worker never answered. Found on
# staging 2026-09-27 — every account came back "unverified" — and fixed there
# by this flag alone. Top-level, so [env.staging] inherits it.
compatibility_flags = ["global_fetch_strictly_public"]

# Every minute. The Worker reads only the current minute's bucket, so this is
# ~1,440 invocations a day regardless of how many people have reminders on —
# comfortably inside the free tier's 100k/day.
[triggers]
crons = ["* * * * *", "*/10 * * * *"]   # reminders every minute; online alerts + learning nudges every ten (PARTNER_API)

[[kv_namespaces]]
binding = "SUBS"
id = "3a92211829224fc7a8824d500e31d61d"

[vars]
# Filled in from genkeys.js output — the base64url raw P-256 public key.
VAPID_PUBLIC_KEY = "BNYYDUjL-BivM99fGRtRYZ4mGW3MLovUtkEgNiopzUfPFsnXwt7sZQcvym109TbADLW3abdEsizVqFR7CrTG42c"
# Online alerts: the partner Worker's /presence (counts only), read behind
# PUSH_SECRET (below) since 26 Sep 2026. Empty, or no PUSH_SECRET = alerts off.
PARTNER_API = "https://be-partner.nore-ngou.workers.dev"
# Invitation wake-ups (2026-09-26): the partner Worker calls POST /wake with a
# shared secret — `npx wrangler secret put PUSH_SECRET` here AND on be-partner
# (same value). Without it /wake answers 503 and invitations ring in-app only.

# ---------------------------------------------------------------- staging --
# be-push-staging (2026-09-26): its own Worker, store and VAPID pair, so the
# staging site (staging.lomonec.com → beEnv().push) can test learning nudges
# without touching production's be-push. Deploy: npx wrangler deploy --env staging
# Secret: VAPID_PRIVATE_JWK (--env staging), the staging pair's private half —
# a different pair from production's. Staging ONLY: NUDGE_FLUSH (a
# deliver-now route for device tests) and shortened nudge gaps; production
# above sets none of them, so its defaults (20 h, 48 h, 4 a week) hold.
[env.staging]
name = "be-push-staging"

[env.staging.triggers]
crons = ["* * * * *", "*/10 * * * *"]

[[env.staging.kv_namespaces]]
binding = "SUBS"
id = "f048c81414eb4cb7ac9366c85259370c"

[env.staging.vars]
VAPID_PUBLIC_KEY = "BLub2nDIQKEMKU9Z4hTca59aLaN2VxztkAZy-SZ1hwCcfRTz-ijV8mYEghz1QEW2mc12ENFv4d8Wsq6jndqc7Ok"
PARTNER_API = "https://be-partner-staging.nore-ngou.workers.dev"   # its /programme decides General English
NUDGE_FLUSH = "1"
NUDGE_GAP_MS = "300000"        # 5 min between nudges (production: 20 h)
NUDGE_KIND_GAP_MS = "900000"   # 15 min per kind (production: 48 h)
NUDGE_WEEK_MAX = "30"          # production: 4
