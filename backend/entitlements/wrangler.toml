# be-entitlements — the server-side source of truth for a learner's plan.
# NOT DEPLOYED. The production D1 database EXISTS and is migrated (0001-0004,
# 2 Oct 2026); the Worker itself has never been deployed and no production
# secret is set, so every store route would answer 501 until the owner sets
# them. The client is still inert: ENT_API is empty and billing_enabled is OFF.
# Remaining owner steps before `npx wrangler deploy --env ""`:
#   npx wrangler secret put ADMIN_TOKEN           (>= 32 random chars; owner only)
#   openssl rand -base64 32 | npx wrangler secret put PLAY_TOKEN_KEY   (seals stored Play tokens)
#   npx wrangler secret put APP_ACCOUNT_SECRET    (>= 32 chars; NOT the staging value)
#   npx wrangler secret put GOOGLE_SA_JSON        (the Play service-account key)
# and the two RTDN vars below, which need a production Pub/Sub push
# subscription and a production custom domain that do not exist yet.
# Keep [observability] traces OFF: Google API URLs carry the purchase token.
name = "be-entitlements"
main = "entitlements-worker.js"
compatibility_date = "2026-09-01"
# the production custom domain (RTDN must reach it; the app uses it too). workers.dev stays on.
routes = [{ pattern = "entitlements.lomonec.com", custom_domain = true }]
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "be-mastery"
# capacitor://localhost is the App Store shell's own origin: without it the
# iOS app cannot reach this Worker at all, so Premium would be web-only.
ALLOWED_ORIGINS = "https://app.lomonec.com,capacitor://localhost,https://localhost"   # https://localhost = the Android shell
# Apple (StoreKit 2 JWS). Production AND Sandbox: Sandbox is what App Review
# itself buys with, so a Production-only list fails review.
APPLE_BUNDLE_ID = "com.lomonec.bemastery,com.lomonec.bemastery.welding"
APPLE_ENVIRONMENTS = "Production,Sandbox"
# SHA-256 of Apple Root CA - G3 (public). Pinned so a JWS chain must end in
# Apple's own root. Same value as staging, by design: it is Apple's root.
APPLE_ROOT_SHA256 = "63343abfb89a6a03ebb57e9b3f5fa7be7c4f5c756f3017b3a8c488c3653e9179"
# Google Play. PLAY_PACKAGE is the production listing.
#
# THE TWO-APP SPLIT (12 Oct 2026, docs/APP_SPLIT.md § Premium). PLAY_PACKAGE,
# APPLE_BUNDLE_ID and APP_PROGRAMMES are INDEX-ALIGNED allow-lists: position i
# is the same app on Play, on the App Store and in the database. A purchase is
# filed against the app that sold it and grants Premium in THAT app only.
#
# MIGRATION 0005 IS REQUIRED BY THIS CODE, not by the Welding app (verified
# 12 Oct 2026). An earlier version of this note tied it to switching Welding on,
# which reads as "one programme needs nothing". It does: the Worker writes
# purchase_links.app_id and reads entitlements by (uid, app_id) on EVERY path,
# and production D1 (ead9ecb9…) still has neither column — its tables are
#   purchase_links  provider,ext_id,uid,plan,product,source,status,starts_at,
#                   expires_at,will_renew,secret_ref,updated_at
#   entitlements    uid,plan,product,status,starts_at,expires_at,source,
#                   external_ref,updated_at,will_renew
# so deploying this file's Worker before the migration makes every purchase
# write fail, on one programme as much as two. Apply it first:
#   npx wrangler d1 migrations apply be-entitlements --remote --env ""
# The currently DEPLOYED Worker is the pre-split code, which is why production
# works today, and why it keeps working until someone deploys from this tree.
#
# To switch the Welding app on, set all three together:
#   PLAY_PACKAGE    = "com.bemastery.app,com.lomonec.bemastery.welding"
#   APPLE_BUNDLE_ID = "com.lomonec.bemastery,com.lomonec.bemastery.welding"
#   APP_PROGRAMMES  = "general-english,welding"
# Extending a store list without extending APP_PROGRAMMES refuses the new app's
# purchases (500 app_unmapped) and leaves the existing app's working — the safe
# direction, not a guess.
PLAY_PACKAGE = "com.bemastery.app,com.lomonec.bemastery.welding"
# One programme today, so every purchase is the General English app's and the
# service behaves exactly as it did before the split.
APP_PROGRAMMES = "general-english,welding"
# RTDN (10 Oct 2026): the topic Play Console names (be-mastery-play-rtdn) has a SECOND push
# subscription, be-mastery-play-rtdn-push-prod, to THIS Worker's custom domain (Pub/Sub pushes
# to workers.dev never reach a Worker — see the staging note). Audience blank → aud = endpoint.
RTDN_AUDIENCE = "https://entitlements.lomonec.com/v1/billing/google_play"
RTDN_SA_EMAIL = "firebase-adminsdk-fbsvc@be-mastery.iam.gserviceaccount.com"

# Observability OFF, explicitly: Workers traces record outbound fetch URLs,
# and the Google Play API URL carries the purchase token (Phase 10/11 review).
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "be-entitlements"
database_id = "ead9ecb9-7f95-45f7-a751-9d09c62febc4"   # be-entitlements, created 2026-10-02
migrations_dir = "migrations"

# local development: wrangler dev --env dev (X-Dev-User instead of Firebase)
[env.dev]
[env.dev.vars]
FIREBASE_PROJECT_ID = "be-mastery"
DEV_AUTH = "1"
[[env.dev.d1_databases]]
binding = "DB"
database_name = "be-entitlements"
database_id = "local-dev"
migrations_dir = "migrations"

# Staging (Phase 12A) — what the Play internal-test build talks to through
# staging.lomonec.com (index.html beEnv() → entitlements). Its own Worker and
# its own D1: nothing is shared with production. NOT DEPLOYED. Owner-run:
#   npx wrangler d1 create be-entitlements-staging          -> paste the id below
#   npx wrangler d1 migrations apply be-entitlements-staging --remote --env staging
#   npx wrangler secret put GOOGLE_SA_JSON --env staging      (the Play service-account key)
#   openssl rand -base64 32 | npx wrangler secret put PLAY_TOKEN_KEY --env staging   (NOT the production key)
#   npx wrangler secret put APP_ACCOUNT_SECRET --env staging  (>= 32 chars; NOT the production value)
#   npx wrangler deploy --env staging
# DEV_AUTH is never set here: staging uses real Firebase sign-in.
[env.staging]
name = "be-entitlements-staging"
# RTDN custom domain (2026-09-25): Google Pub/Sub pushes to the workers.dev
# hostname were answered 404 by Cloudflare's edge before the Worker ran (9,264
# pushes, 0 invocations), so RTDN uses a custom domain in the lomonec.com zone.
# workers.dev stays enabled for everything else.
routes = [{ pattern = "entitlements-staging.lomonec.com", custom_domain = true }]
workers_dev = true
[env.staging.vars]
# Staging signs in to the validation project (29 Sep 2026), like be-partner-staging:
# the staging web snapshot and `npm run sync:staging` both use be-mastery-test, so a
# staging Worker verifying be-mastery rejected every staging token. RTDN_SA_EMAIL
# below is unrelated (Google Play's Pub/Sub sender) and stays.
FIREBASE_PROJECT_ID = "be-mastery-test"
ALLOWED_ORIGINS = "https://staging.lomonec.com,capacitor://localhost,https://localhost"   # capacitor://localhost = a staging TestFlight build; https://localhost = a staging Android build
# THE TWO-APP SPLIT: staging is where the Welding app's purchases are tested
# first. The three lists stay index-aligned (see the production block above).
PLAY_PACKAGE = "com.bemastery.app"
APP_PROGRAMMES = "general-english"
# Licence testing happens HERE, not in production (owner, 12 Oct 2026). A Play
# licence tester's purchase carries testPurchase, and src/billing.js refuses it
# unless this is exactly "1" — strict by default, the same rule Apple's side
# already had through APPLE_ENVIRONMENTS. Production deliberately does not set
# it, so a free test purchase can never become a production entitlement.
# Tests: backend/entitlements/test/billing.mjs § "A test purchase is not revenue".
PLAY_ALLOW_TEST_PURCHASES = "1"
# RTDN (Pub/Sub authenticated push). The route is POST /v1/billing/google_play on
# THIS Worker, reached through the custom domain above; the push endpoint must be
# exactly this URL. With the push
# subscription's Audience left blank, Pub/Sub uses the push endpoint URL as the
# token's aud (Pub/Sub OidcToken.audience docs), so RTDN_AUDIENCE = that URL.
# RTDN_SA_EMAIL = the push subscription's service account (the token's email).
RTDN_AUDIENCE = "https://entitlements-staging.lomonec.com/v1/billing/google_play"
RTDN_SA_EMAIL = "firebase-adminsdk-fbsvc@be-mastery.iam.gserviceaccount.com"
APPLE_BUNDLE_ID = "com.lomonec.bemastery"
APPLE_ENVIRONMENTS = "Sandbox"
# SHA-256 of Apple Root CA - G3 (public; downloaded from
# https://www.apple.com/certificateauthority/AppleRootCA-G3.cer and hashed,
# 2026-09-26). Pinned so a JWS chain must end in Apple's own root.
APPLE_ROOT_SHA256 = "63343abfb89a6a03ebb57e9b3f5fa7be7c4f5c756f3017b3a8c488c3653e9179"
[env.staging.observability]
enabled = false
[[env.staging.d1_databases]]
binding = "DB"
database_name = "be-entitlements-staging"
database_id = "09dd4913-4193-4893-bb75-91ba6a906584"   # be-entitlements-staging, created 2026-09-25
migrations_dir = "migrations"
