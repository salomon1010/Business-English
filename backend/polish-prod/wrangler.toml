name = "be-polish"
main = "entry.js"
compatibility_date = "2026-07-31"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "be-mastery"
ENTITLEMENTS_URL = "https://be-entitlements.nore-ngou.workers.dev"
PARTNER_API = "https://be-partner.nore-ngou.workers.dev"
# AI cost control, P1 (owner-approved 10 Oct 2026, docs/AI-COST-CONTROL.md §10):
# REPORT-ONLY — visitors are counted and recorded, never refused. "enforce" is a
# separate approval. LEDGER_SALT is a secret (wrangler secret put LEDGER_SALT).
ANON_AI_POLICY = "report"

# the AI usage ledger: one row per billable request, units + an estimated cost, no content
[[analytics_engine_datasets]]
binding = "AI_LEDGER"
dataset = "be_ai_ledger"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1-rate-limiter"
new_sqlite_classes = ["RateLimiter"]
