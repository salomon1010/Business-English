name = "be-polish"
main = "entry.js"
compatibility_date = "2026-07-31"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "be-mastery"
ENTITLEMENTS_URL = "https://be-entitlements.nore-ngou.workers.dev"
PARTNER_API = "https://be-partner.nore-ngou.workers.dev"
# AI cost control (docs/AI-COST-CONTROL.md §10–12). P1 report-only 10 Oct 2026;
# P2 ENFORCE the same afternoon (owner: "update everything, deploy"). A caller with no
# verified account gets, per IP per UTC day, 40 transcriptions / 40 chats / 15 polish /
# 150 voice clips / 3 AI verdicts, inside one $10/day pool for every visitor together;
# past that, 429 {scope:"anon"} and the app shows its sign-in note. Signed-in learners,
# Shadow's reading helpers, pasted-video transcription and the games are not held by it.
# Rollback without code: ANON_AI_POLICY = "report" (or "off") and redeploy.
# LEDGER_SALT is a secret (wrangler secret put LEDGER_SALT).
ANON_AI_POLICY = "enforce"

# the AI usage ledger: one row per billable request, units + an estimated cost, no content
[[analytics_engine_datasets]]
binding = "AI_LEDGER"
dataset = "be_ai_ledger"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1-rate-limiter"
new_sqlite_classes = ["RateLimiter"]
