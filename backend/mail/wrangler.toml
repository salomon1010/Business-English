# Cloudflare Worker config for BE Mastery transactional email (Lomonec LLC).
#
# FOURTH production Worker, separate from be-polish / be-push / be-events.
# It sends the branded password-reset email. Firebase's own template cannot
# be styled (Firebase blocks body edits to fight spam), so this Worker asks
# Firebase for the reset LINK and sends the message itself through Brevo,
# where lomonec.com is already authenticated (DKIM + DMARC).
#
# Deploy from this folder — see README.md for the one-time setup:
#     npx wrangler secret put FB_SA_JSON < key.json   # once — the Firebase service-account JSON
#     npx wrangler secret put BREVO_API_KEY           # once — Brevo → SMTP & API → API keys
#     npx wrangler deploy
#
# Both secrets live only in Cloudflare. Never commit them: this repo is public.

name = "be-mail"
main = "mail-worker.js"
compatibility_date = "2026-07-31"

[vars]
FB_PROJECT_ID = "be-mastery"
IOS_BUNDLE_ID = "com.lomonec.bemastery"   # the App Store bundle id, for the native Apple revocation header
# The browser API key (same one index.html carries, public by design): the only
# thing accounts:revokeToken needs besides the learner's own ID token. Apple's
# private key lives in the FIREBASE CONSOLE, never here — see README.md.
FB_API_KEY    = "AIzaSyDbCoGDB3kwjHfPfsEtTxGOqb1Xq8wv3wY"
FROM_EMAIL    = "noreply@lomonec.com"
FROM_NAME     = "BE Mastery"
REPLY_TO      = "contact@lomonec.com"
APP_URL       = "https://app.lomonec.com/"
