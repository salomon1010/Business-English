# be-coach — the Smart Coach's server (Smart Practice Planner, 10 Oct 2026).
# PRODUCTION since 10 Oct 2026 (launch Phase B, first version 9c8da359): top level = be-coach,
# bound to production be-entitlements, be-partner and be-polish's RateLimiter. The app reaches it
# only once smart_coach_enabled is on. Staging = [env.staging].
#
# Deploy staging from this folder:
#     npx wrangler deploy --env staging
# Tests:  node test/run.mjs
#
# The top level below exists only because wrangler needs one; it names no
# entitlement service, so even if it were deployed by mistake it would refuse
# every request. No cron trigger (the account is at the Free plan's 5).
name = "be-coach"
main = "coach-worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
# PRODUCTION (10 Oct 2026, launch Phase B): the production entitlement and partner Workers.
ENTITLEMENTS_URL = "https://be-entitlements.nore-ngou.workers.dev"
PARTNER_API = "https://be-partner.nore-ngou.workers.dev"

[[durable_objects.bindings]]
name = "COACH"
class_name = "CoachStore"

# game rounds are confirmed against production be-polish's RateLimiter (wm-game.js writes them)
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "be-polish"

[[migrations]]
tag = "v1-coach-store"
new_sqlite_classes = ["CoachStore"]

[observability]
enabled = false

# ---- staging: be-coach-staging, used by staging.lomonec.com and the staging iOS bundle
[env.staging]
name = "be-coach-staging"

[env.staging.vars]
ENTITLEMENTS_URL = "https://be-entitlements-staging.nore-ngou.workers.dev"
PARTNER_API = "https://be-partner-staging.nore-ngou.workers.dev"

# an environment does not inherit durable_objects: staging names its own
[[env.staging.durable_objects.bindings]]
name = "COACH"
class_name = "CoachStore"

# be-polish-staging's RateLimiter: the limits here, and the proof that a game
# round was closed by be-polish (the "<prefix>f:<round id>" counter wm-game.js writes)
[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "be-polish-staging"

[[env.staging.migrations]]
tag = "v1-coach-store"
new_sqlite_classes = ["CoachStore"]
