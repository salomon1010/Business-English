# Cloudflare Worker config for BE Mastery Practice Partner (Lomonec LLC).
#
# A FOURTH Worker, separate from be-polish / be-push / be-events, so that
# partner traffic and its database can never take Executive Polish down.
#
# PRODUCTION = the top-level environment of this file (deployed 2026-09-21).
# Three environments live here (top-level, [env.dev], [env.staging]), so
# wrangler warns when the deploy command names none. Always say which:
#     npx wrangler deploy --env ""              # production (top-level)
#     npx wrangler deploy --env staging         # staging.lomonec.com
# `--env ""` (empty string) IS the documented way to target the top level —
# it is not a typo. A migration goes first when one was added:
#     npx wrangler d1 migrations apply be-partner --remote --env ""
# First-time setup was: d1 create be-partner, r2 bucket create be-partner-audio.
#
# Local development / tests (no Cloudflare account needed, nothing leaves the
# machine — D1 and R2 are emulated on disk under .wrangler/):
#     npx wrangler d1 migrations apply be-partner --local --env dev
#     npx wrangler dev --env dev --port 8787
#
# DEV_AUTH="1" exists ONLY in [env.dev]. It lets the tests pass a user id in an
# X-Dev-User header instead of a Firebase ID token. Never set it in production.

name = "be-partner"
main = "partner-worker.js"
compatibility_date = "2026-07-31"

[vars]
FIREBASE_PROJECT_ID = "be-mastery"
ALLOWED_ORIGINS = "https://app.lomonec.com,https://salomon1010.github.io,capacitor://localhost,https://localhost"   # capacitor://localhost = the App Store build; https://localhost = the Android shell
PARTNER_ENABLED = "1"          # production kill switch: opened 2026-09-20 on the owner's release decision
LIVE_ENABLED = "1"             # live human practice (Level 3): opened 2026-09-24 on the owner's request; TURN secrets are set in production
# TURN for live practice is optional: `wrangler secret put TURN_KEY_ID` and
# `TURN_KEY_TOKEN` (Cloudflare Calls TURN key). Without them the Worker hands
# out STUN only, and phones behind carrier NAT may fail to connect.
MATCH_WEIGHTS = "{}"           # JSON overrides of WEIGHTS_DEFAULT in partner-worker.js
# SAFETY_LIMITS (JSON) may override the daily report/block caps; unset = production defaults.
# There is NO daily practice quota to configure — the practice routes are guarded
# per minute by BURST_PER_MIN (per learner, exact via D1) and IP_PER_MIN (per IP).
PAIR_DAYS = "7"
PARTNER_TIMEOUT_H = "24"
# Invitations ring a closed app through be-push (2026-09-26): PUSH_API is its
# address, and PUSH_SECRET (`npx wrangler secret put PUSH_SECRET`) must equal
# the same secret on be-push. Unset = invitations are only noticed in the app.
PUSH_API = "https://be-push.nore-ngou.workers.dev"
# Round Review needs the AI key as a secret: `npx wrangler secret put OPENAI_KEY`
# (the same provider key Executive Polish uses). Without it POST /pairs/:id/review
# answers 503 review_off. REVIEW_STUB="1" (dev only) builds a deterministic review.

[[d1_databases]]
binding = "DB"
database_name = "be-partner"
database_id = "9ad063a2-b677-483a-af27-5001531f7151"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "be-partner-audio"

[triggers]
crons = ["17 3 * * *"]   # daily: expire week-old pairs, delete audio 14 days after a pair closes

[env.dev]
[env.dev.vars]
FIREBASE_PROJECT_ID = "be-mastery"
ALLOWED_ORIGINS = "http://localhost:8011,http://127.0.0.1:8011,http://localhost:8765,http://127.0.0.1:8765,http://localhost:8773,http://127.0.0.1:8773,http://localhost:8000,http://127.0.0.1:8000"   # 8773 added 1 Oct 2026: live-rounds.mjs and hidden-switch.mjs serve the site there, and its absence here is why they told you to start a SECOND Worker on 8797 with a --var override. Dev env only; additive, so it cannot break anything.
PAIR_DAYS = "7"
PARTNER_TIMEOUT_H = "24"
PARTNER_ENABLED = "1"
LIVE_ENABLED = "1"
MATCH_WEIGHTS = "{}"
IP_PER_MIN = "100000"          # the test suites hammer one IP; production keeps the 300 default
BURST_PER_MIN = "100000"       # same reason, per learner: the suites fire a whole flow in seconds
SAFETY_LIMITS = "{}"           # the suites assert the production report/block defaults
DEV_AUTH = "1"
REVIEW_STUB = "1"              # Round Review without a provider key: deterministic from the transcript

[[env.dev.d1_databases]]
binding = "DB"
database_name = "be-partner"
database_id = "local-dev"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "AUDIO"
bucket_name = "be-partner-audio"

# ---------------------------------------------------------------------------
# STAGING — a separate Worker, database and bucket for real-device testing
# from the feature branch, so nothing has to be merged or switched on in
# production first. Owner-run, never by a build session:
#     npx wrangler d1 create be-partner-staging          # paste id below
#     npx wrangler d1 migrations apply be-partner-staging --remote --env staging
#     npx wrangler r2 bucket create be-partner-staging-audio
#     npx wrangler deploy --env staging
# No DEV_AUTH here: phones sign in with a real Firebase account and the
# Worker verifies the ID token exactly as production will. The app is served
# from the branch through an HTTPS tunnel on a FIXED hostname (getUserMedia
# needs a secure context and the allow-lists need a stable origin) — see
# marketing/product/practice-partner/PILOT.md "Staging".
[env.staging]
name = "be-partner-staging"
[env.staging.vars]
FIREBASE_PROJECT_ID = "be-mastery-test"   # the validation project, as deployed since 27 Sep 2026 (d4aece8c); was a deploy-time --var only
ALLOWED_ORIGINS = "https://staging.lomonec.com,http://localhost:8000,http://127.0.0.1:8000,capacitor://localhost,https://localhost"
PARTNER_ENABLED = "1"
LIVE_ENABLED = "1"
SAFETY_LIMITS = "{\"report\":20,\"block\":50}"   # staging only: a day of device testing on one account
PUSH_API = "https://be-push-staging.nore-ngou.workers.dev"   # staging's own push Worker (29 Sep 2026; was production be-push). Inert until a STAGING-ONLY PUSH_SECRET is set on both staging Workers — never the production one
MATCH_WEIGHTS = "{}"
PAIR_DAYS = "7"
PARTNER_TIMEOUT_H = "24"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "be-partner-staging"
database_id = "4cd14280-0eaf-422b-b986-84ebe29a1204"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "AUDIO"
bucket_name = "be-partner-staging-audio"

[env.staging.triggers]
# NO trigger on staging (owner, 9 Oct 2026): its slot went to staging push reminders
# (Workers Free = 5 cron triggers per account). Staging pairs and audio are not
# expired/cleaned automatically; production keeps "17 3 * * *".
crons = []
