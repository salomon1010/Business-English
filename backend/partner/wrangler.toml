# Cloudflare Worker config for BE Mastery Practice Partner (Lomonec LLC).
#
# A FOURTH Worker, separate from be-polish / be-push / be-events, so that
# partner traffic and its database can never take Executive Polish down.
#
# NOT DEPLOYED YET. First-time production setup (owner, after review):
#     npx wrangler d1 create be-partner            # paste database_id below
#     npx wrangler d1 migrations apply be-partner --remote
#     npx wrangler r2 bucket create be-partner-audio
#     npx wrangler deploy
#
# Local development / tests (no Cloudflare account needed, nothing leaves the
# machine — D1 and R2 are emulated on disk under .wrangler/):
#     npx wrangler d1 migrations apply be-partner --local --env dev
#     npx wrangler dev --env dev --port 8787
#
# DEV_AUTH="1" exists ONLY in [env.dev]. It lets the tests pass a user id in an
# X-Dev-User header instead of a Firebase ID token. Never set it in production.

name = "be-partner"
main = "partner-worker.js"
compatibility_date = "2026-07-31"

[vars]
FIREBASE_PROJECT_ID = "be-mastery"
ALLOWED_ORIGINS = "https://app.lomonec.com,https://salomon1010.github.io"
PAIR_DAYS = "7"
PARTNER_TIMEOUT_H = "24"
TURNS_PER_DAY = "3"

[[d1_databases]]
binding = "DB"
database_name = "be-partner"
database_id = "REPLACE-WITH-wrangler-d1-create-OUTPUT"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "be-partner-audio"

[triggers]
crons = ["17 3 * * *"]   # daily: expire week-old pairs, delete audio 14 days after a pair closes

[env.dev]
[env.dev.vars]
FIREBASE_PROJECT_ID = "be-mastery"
ALLOWED_ORIGINS = "http://localhost:8011,http://127.0.0.1:8011,http://localhost:8765,http://127.0.0.1:8765,http://localhost:8000,http://127.0.0.1:8000"
PAIR_DAYS = "7"
PARTNER_TIMEOUT_H = "24"
TURNS_PER_DAY = "3"
DEV_AUTH = "1"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "be-partner"
database_id = "local-dev"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "AUDIO"
bucket_name = "be-partner-audio"
