window.toggleStep=(key,i)=>{
  const a=S.steps[key]||[];const ix=a.indexOf(i);
  const on=ix<0;                              // becoming done if it wasn't already
  ix>=0?a.splice(ix,1):a.push(i);S.steps[key]=a;save();
  const step=document.getElementById("stp"+i);   // toggle in place — never re-render (keeps the timer running)
  if(step){
    step.classList.toggle("done",on);
    step.setAttribute("aria-checked",on);        // the row is role=checkbox; the class alone tells a screen reader nothing
    const cb=step.querySelector(".cb");if(cb)cb.textContent=on?"✓":"";
  }
};
window.saveNote=key=>{S.notes[key]=document.getElementById("noteBox").value;save();toast(t("sess.notes_saved_toast"))};
window.setScore=(key,n)=>{S.scores[key]=n;save();go("session",cur.arg1,cur.arg2)};
window.toggleDay=(key,w,d)=>{
  S.days[key]=!S.days[key];
  /* Ticking a day off is the clearest "I did the work" signal in the app, and
     carrying the week is what makes drop-out visible: without it you can see
     that people stop, but not where in the 12 weeks they stop. */
  if(S.days[key]){markPracticed();track("session_complete",{week:String(w),day:String(d)});toast(t("sess.day_complete_toast",{w,d}))}
  save();go("session",w,d);
};
/* timer — runs globally; the header pill mirrors it on every page */
function tRender(){
  const m=String(Math.floor(timer.left/60)).padStart(2,"0"),s=String(timer.left%60).padStart(2,"0"),txt=`${m}:${s}`;
  const d=document.getElementById("tDig");if(d)d.textContent=txt;
  const b=document.getElementById("tBtn");if(b)b.textContent=timer.run?t("sess.timer_pause"):t("sess.timer_start");
  const box=document.getElementById("tBox");if(box)box.classList.toggle("running",timer.run);   // colours the digits while the block is live
  const hd=document.getElementById("hdrTimerDig");if(hd)hd.textContent=txt;
  const pill=document.getElementById("hdrTimer");
  if(pill){
    const on=timer.run||(timer.left>0&&timer.left<25*60);   // show while running or paused part-way; hide at full (cancelled) or 0 (done)
    pill.classList.toggle("show",on);
    pill.classList.toggle("running",timer.run);
  }
}
window.tToggle=()=>{
  timer.run=!timer.run;
  if(timer.run&&cur.v==="session"){timer.w=cur.arg1;timer.d=cur.arg2;}   // remember which session this block belongs to
  clearInterval(timer.h);
  if(timer.run)timer.h=setInterval(()=>{
    timer.left--;
    if(timer.left<=0){clearInterval(timer.h);timer.run=false;timer.left=0;tRender();toast(t("sess.timer_up_toast"));return}
    tRender();
  },1000);
  tRender();
};
window.tReset=()=>{clearInterval(timer.h);timer={left:25*60,run:false,h:null};tRender()};
window.tOpen=()=>{const p=currentPos();go("session",timer.w||p.w,timer.d||p.d)};

/* ================= RECORDER ================= */
let rec={mr:null,chunks:[],t0:0,h:null,ctx:null,label:null};
window.recToggle=async(ctx,label)=>{
  const btn=document.getElementById("recBtn"),st=document.getElementById("recState");
  if(rec.mr&&rec.mr.state==="recording"){rec.mr.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec={mr:new MediaRecorder(stream),chunks:[],t0:Date.now(),h:null,ctx,label};
    rec.mr.ondataavailable=e=>rec.chunks.push(e.data);
    rec.mr.onstop=async()=>{
      clearInterval(rec.h);stream.getTracks().forEach(tr=>tr.stop());
      const blob=new Blob(rec.chunks,{type:rec.mr.mimeType||"audio/webm"});
      if(blob.size<1200||(Date.now()-rec.t0)<400){  /* discard accidental/empty taps */
        if(btn)btn.classList.remove("recording");
        if(st)st.textContent=t("rec.too_short_state");
        toast(t("rec.too_short_toast"));return;
      }
      /* Check the write actually landed. IndexedDB is refused outright in iOS
         Private Browsing, in in-app webviews (a link tapped inside WhatsApp) and
         with "Block All Cookies" on — addRec then resolves null. Reporting
         "Saved ✓" over a failed write and rendering an empty list underneath it
         sent a real user hunting a network fault for days. */
      const ok=await addRec(rec.ctx,rec.label,blob);
      if(btn){btn.classList.remove("recording")}
      if(!ok){
        if(st)st.textContent=t("rec.save_failed_state");
        toast(t("rec.save_failed_toast"));
        return;   /* nothing was stored — don't credit the day or redraw the list */
      }
      markPracticed();save();
      if(st)st.textContent=t("rec.saved_state");
      toast(t("rec.saved_toast"));
      renderRecs(rec.ctx);
      document.getElementById("streakN").textContent=streak();
      if(GH.auto&&ghCfg())ghSyncRecs(true);
    };
    rec.mr.start();
    btn.classList.add("recording");st.textContent=t("rec.recording_state");
    rec.h=setInterval(()=>{
      const s=Math.floor((Date.now()-rec.t0)/1000);
      const el=document.getElementById("recTime");
      if(el)el.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    },500);
  }catch(e){toast(t("rec.mic_denied_toast"))}
};
/* ===== WAVEFORM COMPARISON (latest take layered over the previous one) ===== */
let waveAC=null;
async function decodePeaks(blob,N){
  waveAC=waveAC||new (window.AudioContext||window.webkitAudioContext)();
  const buf=await waveAC.decodeAudioData(await blob.arrayBuffer());
  const d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/N)),peaks=[];
  for(let i=0;i<N;i++){let m=0;const s=i*step,e=Math.min(s+step,d.length);
    for(let j=s;j<e;j+=16){const a=Math.abs(d[j]);if(a>m)m=a}
    peaks.push(m)}
  const mx=Math.max(...peaks,0.01);
  return{peaks:peaks.map(p=>p/mx),dur:buf.duration};
}
function countPauses(peaks,dur){
  const bucket=dur/peaks.length,minRun=Math.max(1,Math.round(0.3/bucket));
  let n=0,run=0;
  for(const p of peaks){if(p<0.08){run++}else{if(run>=minRun)n++;run=0}}
  return n;
}
async function waveRender(ctxName){
  const box=document.getElementById("waveBox");if(!box)return;
  try{
    const recs=await getRecs(ctxName);
    if(!recs.length){box.innerHTML="";return}
    const N=560;
    const latest=await decodePeaks(recs[0].blob,N);
    const prev=recs[1]?await decodePeaks(recs[1].blob,N):null;
    const W=640,H=150,mid=H/2;
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;
    cv.style.cssText="width:100%;height:auto;display:block;background:#0a0e1a;border-radius:12px";
    const g=cv.getContext("2d");
    /* time-aligned: both drawn on the scale of the longer take, so pacing differences are visible */
    const maxDur=Math.max(latest.dur,prev?prev.dur:0)||1;
    const draw=(pk,dur,color)=>{
      const usable=W*(dur/maxDur),bw=usable/pk.length;
      g.fillStyle=color;
      for(let i=0;i<pk.length;i++){
        const h=Math.max(1.5,pk[i]*(H/2-8));
        g.fillRect(i*bw,mid-h,Math.max(1,bw*0.75),h*2);
      }
    };
    if(prev)draw(prev.peaks,prev.dur,"rgba(99,102,241,.42)");
    draw(latest.peaks,latest.dur,"rgba(34,211,238,.8)");
    g.fillStyle="rgba(255,255,255,.25)";g.fillRect(0,mid,W,1);
    const pl=countPauses(latest.peaks,latest.dur);
    let insight;
    if(prev){
      const dd=latest.dur-prev.dur,pp=countPauses(prev.peaks,prev.dur);
      insight=t("wave.insight_prev",{cur:latest.dur.toFixed(1),prev:prev.dur.toFixed(1)})
        +(Math.abs(dd)>=0.8?dd<0?t("wave.tighter",{d:(-dd).toFixed(1)}):t("wave.longer",{d:dd.toFixed(1)}):t("wave.consistent"))
        +(pp!==pl?t("wave.pauses_was",{n:pl,prev:pp}):t("wave.pauses_suffix",{n:pl}));
    }else{
      insight=t(pl!==1?"wave.first_many":"wave.first_one",{dur:latest.dur.toFixed(1),n:pl});
    }
    box.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <b style="font-size:13.5px">${t("wave.title")}</b>
      <span style="flex:1"></span>
      ${prev?`<span class="chip" style="border-color:rgba(99,102,241,.5);color:#a5b4fc">${t("wave.previous")}</span>`:""}
      <span class="chip" style="border-color:rgba(34,211,238,.5);color:#67e8f9">${t("wave.latest")}</span>
    </div>`;
    box.appendChild(cv);
    box.insertAdjacentHTML("beforeend",`<p style="font-size:12.5px;color:var(--mut);margin-top:8px">${insight}</p>`);
  }catch(e){box.innerHTML=""}
}
async function renderRecs(ctx){
  const list=document.getElementById("recList");if(!list)return;
  waveRender(ctx);
  const recs=await getRecs(ctx);
  list.innerHTML=recs.length?recs.map(r=>{
    const url=URL.createObjectURL(r.blob);
    const dt=new Date(r.ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    return `<div class="rec-item"><span style="color:var(--mut2);white-space:nowrap">${dt}</span>
      <audio controls src="${url}"></audio>
      <a class="btn btn-g btn-sm" href="${url}" download="${esc(r.label||'recording')}.webm" title="${esc(t("recs.download_title"))}">⬇</a>
      <button class="btn btn-danger btn-sm" onclick="removeRec(${r.id},'${ctx}')">✕</button></div>`;
  /* An empty list has two very different causes. "No recordings yet" over a
     browser that cannot store any is what made a real user think the app was
     broken by their network. getRecs() awaits dbReady, so DB is settled here. */
  }).join(""):`<p class="rec-none">${t(DB?"recs.none":"recs.blocked")}</p>`;
  if(recs.length)list.insertAdjacentHTML("beforeend",`<p style="font-size:11.5px;color:var(--mut2);margin-top:10px">${t("recs.privacy_note")}</p>`);
}

/* The workspace covers the whole viewport, so it has to behave like a dialog and
   not merely look like one: it was reachable-past by Tab, ignored Escape, and
   left the picker scrolling underneath. */
let _shPrevFocus=null;
function shFocusables(w){
  return [...w.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select,summary,[tabindex]:not([tabindex="-1"])')]
    .filter(e=>e.offsetParent!==null);
}
function shWorkKeys(e){
  const w=document.getElementById("shWork");
  if(!w||w.style.display==="none")return;
  if(e.key==="Escape"){e.preventDefault();shCloseWork();return}
  if(e.key!=="Tab")return;
  const f=shFocusables(w);if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  /* focus starts on <body> the first time, which Tab would carry into the page
     behind, so an out-of-dialog target is pulled back to the near edge */
  if(!w.contains(document.activeElement)){e.preventDefault();(e.shiftKey?last:first).focus();return}
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}

let shLooping=true,shCounting=false,shPing={};
function shStartTick(){
  clearInterval(shTick);
  shTick=setInterval(()=>{
    if(!ytPlayer||!ytPlayer.getCurrentTime)return;
    let t=0;try{t=ytPlayer.getCurrentTime()}catch(_){return}
    const now=document.getElementById("shNow");if(now)now.textContent=fmtT(t);
    if(shCounting){
      const c=document.getElementById("shCount");
      const el=Math.max(0,t-shClip.start);
      if(c){
        c.textContent=Math.floor(el)+"s";
        c.className="sh-count "+(el>=30?"over":el>=20?"ready":"go");
      }
      if(el>=20&&!shPing[20]){shPing[20]=1;toast(t("sh.count_20s_toast"))}
      if(el>=30&&!shPing[30]){shPing[30]=1;toast(t("sh.count_30s_toast"))}
    }else if(shClip.end>shClip.start){
      /* playback mode: show position inside the clip, resetting to 0 on every loop */
      const c=document.getElementById("shCount");
      if(c){
        c.style.display="";
        const el=Math.min(Math.max(0,t-shClip.start),shClip.end-shClip.start);
        c.textContent=Math.floor(el)+"s / "+Math.round(shClip.end-shClip.start)+"s";
        c.className="sh-count go";
      }
    }
    if(shClip.end>shClip.start&&t>=shClip.end){
      if(shLooping)ytPlayer.seekTo(shClip.start,true);
      else ytPlayer.pauseVideo();
    }
  },250);
}
function shSegUI(){
  const st=document.getElementById("shStart"),en=document.getElementById("shEnd"),ln=document.getElementById("shLen");
  if(!st)return;
  st.textContent=fmtT(shClip.start);
  en.textContent=shClip.end>shClip.start?fmtT(shClip.end):"–";
  const made=shClip.end>shClip.start;
  if(made){
    const L=Math.round(shClip.end-shClip.start);
    ln.textContent=L+" sec";
    ln.className="sh-len "+(L>=15&&L<=60?"ok":"warn");
    if(L<15)ln.textContent+=t("sh.len_short");
    if(L>60)ln.textContent+=t("sh.len_long");
  }else ln.textContent="";
  /* expand the panel to its two-row layout only once a real clip exists
     (or while a start mark is counting, so the live counter has somewhere to live) */
  const seg=document.getElementById("shSeg");
  if(seg)seg.classList.toggle("has-clip",made||shCounting);

function markStress(text){
  return String(text).split(/(\s+)/).map(tok=>{
    if(/^\s*$/.test(tok))return tok;
    const m=tok.match(/^([^A-Za-z']*)([A-Za-z][A-Za-z']*?)([^A-Za-z']*)$/);
    if(!m||!m[2])return tok;
    const pre=m[1],core=m[2],post=m[3],low=core.toLowerCase();
    let out;
    if(STRESS_FUNC.has(low))out=low;
    else if(STRESS_MAP[low])out=STRESS_MAP[low];
    else out=core.toUpperCase();
    return pre+out+post;
  }).join("");
}

/* ===== BUNDLED CAPTIONS → transcript from the user's own marks (offline) =====
   Curated videos ship captions/<vid>.json = {vid, source, cues:[{t, txt}, ...]}
   built ahead of time by scripts/fetch_captions.js. We slice those cues to the
   user's [start,end] marks and stress-mark the result — no YouTube call, works
   offline. Arbitrary pasted videos have no file → user types / uses ✨. */
const _capCache={};
async function loadCaptions(vid){
  if(vid in _capCache)return _capCache[vid];
  let data=null;
  /* 1. a bundled file — the curated library clips, works offline */
  try{const r=await fetch("captions/"+vid+".json");if(r.ok)data=await r.json();}catch(e){}
  /* 2. otherwise ask the worker for YouTube's own captions.
        MEASURED 2026-07-31: YouTube answers Cloudflare's datacentre IPs with
        HTTP 429 for every video, so this currently never succeeds. Kept because
        it fails in ~0.5s and costs nothing, and would start working if YouTube
        relaxes; pasting is the real path. Do not "fix" it with residential
        proxies — that is paid, fragile and a clearer ToS breach. */
  if(!data&&POLISH_API){
    try{
      const r=await fetch(POLISH_API,{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({captions:vid})});
      const j=await r.json();
      if(r.ok&&j&&j.cues&&j.cues.length)data=j;
    }catch(e){}
  }
  _capCache[vid]=data;return data;
}
/* Exact clip transcript: caption files with a per-word `words:[{t,w}]` track let us
   take precisely the words spoken between the marks — no time-proportional estimate. */
function wordsInRange(words,start,end){
  return words.filter(w=>w.t>=start-0.25&&w.t<end).map(w=>w.w).join(" ").replace(/\s+/g," ").trim();
}
function captionsInRange(cues,start,end){
  if(!cues||!cues.length)return "";
  /* Caption cues are long (often multi-sentence) with only a start time, so a
     whole-line rule either misses the start or drags in text past the end.
     Instead we cut the BOUNDARY cues at the word level: within each cue we
     estimate where the marks fall (time → word position, proportional) and keep
     only the words inside [start,end]. Cues fully inside contribute all words;
     cues touched at an edge contribute just the words within the marks. */
  const span=i=>{const cs=cues[i].t;const ce=(cues[i].d!=null?cs+cues[i].d:(cues[i+1]?cues[i+1].t:cs+5));return[cs,ce]};
  const out=[];
  for(let i=0;i<cues.length;i++){
    const[cs,ce]=span(i);
    if(ce<=start||cs>=end)continue;                    // no overlap with the marks
    const dur=Math.max(ce-cs,0.001);
    const words=String(cues[i].txt||"").trim().split(/\s+/).filter(Boolean);
    if(!words.length)continue;
    const fa=Math.max(0,Math.min(1,(start-cs)/dur));   // fraction of the cue before the start mark
    const fb=Math.max(0,Math.min(1,(end-cs)/dur));     // fraction up to the end mark
    let wa=Math.max(0,Math.min(words.length,Math.round(fa*words.length)));
    let wb=Math.max(0,Math.min(words.length,Math.round(fb*words.length)));
    if(wb<=wa)continue;                                 // boundary sliver rounds to nothing
    out.push(words.slice(wa,wb).join(" "));
  }
  const r=out.join(" ").replace(/\s+/g," ").trim();
  if(r)return r;
  /* safety net: marks fell oddly → return any single overlapping cue's text */
  for(let i=0;i<cues.length;i++){const[cs,ce]=span(i);if(ce>start&&cs<end)return String(cues[i].txt||"").trim()}
  return "";
}

/* Make the onboarding step fit the screen, whatever the phone.
   The CSS clamps get most of the way, but the result step's height also depends
   on how much the user said (more words → more chips), so no fixed rule can
   guarantee a fit. Measure what's actually rendered and scale it down to the
   space available. Floor at 0.72 — below that it would be unreadable, so we let
   it scroll instead (the overlay is scrollable). */
function obFit(){
  const wrap=document.getElementById("obWrap");if(!wrap)return;
  const card=wrap.querySelector(".ob-card");if(!card)return;
  card.style.transform="";card.style.height="";              // measure unscaled
  const cs=getComputedStyle(wrap);
  const avail=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const need=card.scrollHeight;
  if(need<=avail||need===0)return;                            // already fits
  const s=Math.max(0.72,avail/need);
  card.style.transformOrigin="top center";
  card.style.transform="scale("+s+")";
  card.style.height=(need*s)+"px";                            // stop the scaled box reserving old height
}
window.obFit=obFit;
addEventListener("resize",()=>{if(document.getElementById("obWrap"))obFit()});
/* Grow a textarea to fit its content so a long clip transcript is readable
   without scrolling inside a 4-row box. iOS Safari ignores the CSS resize
   handle entirely, so auto-sizing — not dragging — is what actually works on a
   phone. Capped so the box can never swallow the whole screen; past the cap it
   scrolls. If the user has dragged it taller themselves (desktop), respect that. */
function taGrow(el){
  if(!el)return;
  if(el.dataset.userSized)return;                 // manual drag wins
  const max=Math.round(Math.max(220,window.innerHeight*0.6));
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight+2,max)+"px";
  el.style.overflowY=el.scrollHeight>max?"auto":"hidden";
}
window.taGrow=taGrow;
/* remember a manual drag-resize so auto-sizing stops fighting the user */
document.addEventListener("mousedown",e=>{
  const ta=e.target.closest&&e.target.closest("textarea.grow-ta");
  if(!ta)return;
  const r=ta.getBoundingClientRect();
  if(e.clientX>r.right-18&&e.clientY>r.bottom-18)ta.dataset.userSized="1";   // grabbed the corner handle
},true);
/* Turn a SpeechRecognition result list into clean text.

   Engines disagree badly here. Desktop Chrome and iOS replace the interim
   result in place and emit each finished phrase once. Android Chrome instead
   appends every partial as its OWN entry ("I", "I am", "I am eating", …) and
   re-sends earlier finals, so naively concatenating the list produces the
   ladder "I I am I am I am eating…".

   So: keep only the most recent interim, and when one piece merely extends the
   previous one, replace rather than append. Rebuilt from scratch each call, so
   running it repeatedly on a growing list is safe. */
function srText(results){
  const finals=[];let lastInterim="",lastFinalAt=-1;
  for(let i=0;i<results.length;i++){
    const r=results[i];if(!r||!r[0])continue;
    const txt=String(r[0].transcript||"").trim();
    if(!txt)continue;
    if(r.isFinal){finals.push(txt);lastFinalAt=i;lastInterim="";}   // a final supersedes the partials before it
    else lastInterim=txt;                                          // only the latest trailing interim survives
  }
  if(lastFinalAt>-1&&!lastInterim)lastInterim="";
  const join=(acc,piece)=>{
    if(!acc)return piece;
    if(piece.startsWith(acc))return piece;                // cumulative growth → replace
    if(acc.endsWith(piece)||acc.includes(piece))return acc; // already said → skip
    return acc+" "+piece;
  };
  let out="";
  for(const p of finals)out=join(out,p);
  return lastInterim?join(out,lastInterim):out;
}

/* Ask before anything destructive. One in-app dialog for every delete/overwrite,
   instead of the browser's confirm() (which looks foreign and is blocked in some
   installed-app webviews). Returns a promise: `if(!await askConfirm({…}))return`. */
function askConfirm(o){
  return new Promise(res=>{
    document.querySelectorAll(".cf-ov").forEach(e=>e.remove());
    const ov=document.createElement("div");
    ov.className="cf-ov";
    ov.innerHTML=`<div class="cf-card" role="alertdialog" aria-modal="true" aria-labelledby="cfT">
      <div class="cf-ic ${o.danger===false?"":"danger"}">${ic(o.icon||"trash")}</div>
      <h3 id="cfT">${esc(o.title||t("cf.title"))}</h3>
      ${o.body?`<p>${esc(o.body)}</p>`:""}
      <div class="cf-actions">
        <button class="btn btn-g" data-cf="0">${esc(o.cancelLabel||t("cf.cancel"))}</button>
        <button class="btn ${o.danger===false?"btn-p":"btn-danger"}" data-cf="1">${esc(o.confirmLabel||t("cf.confirm"))}</button>
      </div></div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add("show"));
    const done=v=>{document.removeEventListener("keydown",key);ov.classList.remove("show");
      setTimeout(()=>ov.remove(),180);res(v)};
    function key(e){if(e.key==="Escape")done(false)}
    ov.addEventListener("click",e=>{
      const b=e.target.closest("[data-cf]");
      if(b)return done(b.dataset.cf==="1");
      if(e.target===ov)done(false);            // tap outside cancels
    });
    document.addEventListener("keydown",key);
    const cancel=ov.querySelector('[data-cf="0"]');if(cancel)cancel.focus();   // safe default
  });
}

/* ===== DAILY REMINDER =====
   Honest about what a web app can do. A real notification is only guaranteed
   while the app is running — scheduling one for a closed app needs a push
   server (FCM), which this app does not have. So this does two things:
     1. fires a system notification at the chosen time if the app is open, and
     2. shows an in-app nudge on launch when the day's session is still undone,
        which works whatever the browser allows.
   Together that covers the realistic cases without pretending to be more. */
let _remTimer=null;
function remCfg(){return S.reminder||(S.reminder={on:false,time:"19:00"})}
function remTodayDone(){const k=new Date().toISOString().slice(0,10);return (S.dates||[]).includes(k)}
function remMsAway(hhmm){
  const [h,m]=String(hhmm||"19:00").split(":").map(Number);
  const now=new Date(),next=new Date();
  next.setHours(h||19,m||0,0,0);
  if(next<=now)next.setDate(next.getDate()+1);   // already passed today → tomorrow
  return next-now;

function remSchedule(){
  clearTimeout(_remTimer);_remTimer=null;
  const c=remCfg();
  if(!c.on)return;
  _remTimer=setTimeout(()=>{remFire();remSchedule();},remMsAway(c.time));
}
function remFire(){
  if(remTodayDone())return;                       // already practised — say nothing
  const body=t("rem.body",{n:(currentPos().w||1)});
  try{
    if(window.Notification&&Notification.permission==="granted"){
      const n=new Notification(t("rem.title"),{body,icon:"icon-192.png",badge:"icon-192.png",tag:"be-daily"});
      n.onclick=()=>{window.focus();go("home");n.close()};
      return;
    }
  }catch(e){}
  toast(t("rem.title")+" — "+body);               // notifications blocked → still nudge in-app
}
window.remToggle=on=>{

     platforms it resolves only after the user answers, and on others not at
     all, which would leave the switch flipped but the setting unsaved. The

  const c=remCfg();

  remSchedule();

/* ===== WEB PUSH — the half of the reminder that works with the app closed =====
   remSchedule() above is a setTimeout: it cannot fire unless the app is already
   running, which is the one case where a reminder is not needed. This registers
   a real push subscription against backend/push (see that folder's README).

   Everything here fails soft. Push is unavailable on desktop Safari, on iOS
   before 16.4, on any non-installed iOS home screen, and whenever the user
   declines permission. In all of those the old setTimeout plus the launch nudge
   still run, exactly as before — push is added on top, never depended on. */
const PUSH_API="https://be-push.nore-ngou.workers.dev";
const REM_CACHE="be-rem", REM_KEY="./__reminder__";   // must match sw.js

function pushId(){
  // Random per device. Not the Firebase uid: signing out must not orphan a
  // subscription, and two devices should be able to hold different times.
  if(!S.pushId){
    const a=new Uint8Array(16);crypto.getRandomValues(a);
    S.pushId=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");
    save();
  }
  return S.pushId;
}

/* Local "19:00" → the UTC minute bucket the backend fans out from. Recomputed
   on every launch and every time change, which is what keeps DST and travel
   correct without a timezone database on the server. */
function pushSlot(hhmm){
  const [h,m]=String(hhmm||"19:00").split(":").map(Number);
  const d=new Date();d.setHours(h||19,m||0,0,0);
  return String(d.getUTCHours()).padStart(2,"0")+String(d.getUTCMinutes()).padStart(2,"0");
}

function b64ToU8(s){
  const pad="=".repeat((4-s.length%4)%4);
  const raw=atob((s+pad).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

/* The push carries no payload, so sw.js reads the wording from here. Written
   through t(), so it is already in the user's language — and rewritten on every
   sync, which is how a language change reaches a notification that may fire
   days later without the app being opened again. */
async function remCacheText(){
  try{
    const html=document.documentElement;
    const body={
      title:t("rem.title"),
      body:t("rem.body",{n:(currentPos().w||1)}),
      lang:html.getAttribute("lang")||"en",
      dir:html.getAttribute("dir")||"auto",
    };
    const c=await caches.open(REM_CACHE);
    await c.put(REM_KEY,new Response(JSON.stringify(body),{headers:{"Content-Type":"application/json"}}));
  }catch(e){}
}

async function pushSync(){
  const c=remCfg();
  if(!c.on)return pushOff();
  if(!("serviceWorker" in navigator)||!("PushManager" in window))return;
  if(!window.Notification||Notification.permission!=="granted")return;
  try{
    await remCacheText();
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const r=await fetch(PUSH_API+"/key");
      const {key}=await r.json();
      if(!key)return;                      // backend not configured yet
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(key)});
    }
    const j=sub.toJSON();
    await fetch(PUSH_API+"/subscribe",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:pushId(),slot:pushSlot(c.time),endpoint:j.endpoint}),
    });
  }catch(e){}                              // offline, blocked, unsupported — silent
}

async function pushOff(){
  try{
    /* Check for a local subscription BEFORE telling the server to drop one.
       pushSync() runs on every boot and lands here whenever the reminder is
       off, so the old order fired a network request at launch for every user
       who had never enabled push — and it fails outright while the Worker is
       undeployed. Nothing to unsubscribe means nothing to send. */
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(!sub)return;
    await fetch(PUSH_API+"/unsubscribe",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:pushId()}),
    });
    await sub.unsubscribe();
  }catch(e){}
}

/* Tell the backend today is finished so it sends nothing at all. It cannot ask
   the device — and it must not send a push it does not intend to show, because
   userVisibleOnly forces every delivery to raise a notification. */
function pushDone(){
  if(!S.pushId||!(S.reminder&&S.reminder.on))return;
  try{
    fetch(PUSH_API+"/done",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:S.pushId}),keepalive:true,
    }).catch(()=>{});
  }catch(e){}
}
/* On launch: if the reminder time has already passed today and the session is

/* Shadow recording + live transcription: while the recorder captures your
   shadowing, speech recognition transcribes it, so the speaking feedback
   is generated from that exact recording. */
let shFB={rec:null,on:false,txt:"",t0:0};
let fbCtx={vid:null,recCtx:null}; /* which recording context the current feedback belongs to */
function fbRecStart(cfg){
  /* start parallel transcription while the MediaRecorder runs; cfg={vid,targetId,heardId,recCtx} */
  if(!SR)return;
  try{
    shFB=Object.assign({rec:new SR(),on:true,txt:"",t0:Date.now()},cfg);
    const r=shFB.rec;
    r.lang="en-US";r.continuous=true;r.interimResults=true;
    /* Rebuild the current stretch from the whole result list (see srText) rather
       than appending — Android Chrome resends earlier results and emits each
       partial separately, which was duplicating every word in the transcript
       the analysis is built from. */
    r.onresult=e=>{shFB.cur=srText(e.results)};
    r.onerror=()=>{};
    const bank=()=>{shFB.txt=((shFB.txt||"")+" "+(shFB.cur||"")).trim();shFB.cur="";};
    r.onend=()=>{
      /* the engine stops itself on silence — restart while still recording */
      bank();
      if(shFB.on&&rec.mr&&rec.mr.state==="recording"){try{r.start()}catch(e){}}
      else if(!shFB.on)shFBDone();
    };
    r.start();
  }catch(e){}
}
function fbRecStop(){
  shFB.on=false;
  if(shFB.rec){try{shFB.rec.stop()}catch(e){shFB.txt=((shFB.txt||"")+" "+(shFB.cur||"")).trim();shFB.cur="";shFBDone()}}
  else shFBDone();
}

     transcript is still empty the take would come back with no percentage and

     analyse. Without this, recording before fetching a transcript silently

  let target=tEl?tEl.value.trim():"";
  if(!target&&shFB.targetId==="shNote"){

/* Pre-fetch a clip so the first tap can play it synchronously (iOS blocks audio that
   starts after an async fetch, which is why "Hear it first" fell back to the robot voice). */
function fbWarm(w){
  const text=String(w).replace(/\s+/g," ").trim();
  if(!text||!POLISH_API||!navigator.onLine||fbVoicePref()==="browser"||text.length>600)return;
  const voice=fbVoicePref(),key=voice+"|"+text;
  if(_ttsCache.has(key))return;
  fetch(POLISH_API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({tts:text,voice})})
    .then(r=>r.ok?r.blob():null).then(b=>{if(b)_ttsCache.set(key,URL.createObjectURL(b))}).catch(()=>{});
}
window.fbSay=(w,rate)=>{
  const text=String(w).replace(/\s+/g," ").trim();
  if(!text)return;
  try{speechSynthesis.cancel();clearInterval(fbSayKeep)}catch(_){}   // stop any browser speech first
  const useApi=POLISH_API&&navigator.onLine&&fbVoicePref()!=="browser"&&text.length<=600;
  if(useApi){fbSayApi(text,rate).catch(()=>{fbStopAudio();fbSayBrowser(text,rate)});return}
  fbStopAudio();fbSayBrowser(text,rate);
};
function fbSayBrowser(w,rate){
  try{
    speechSynthesis.cancel();clearInterval(fbSayKeep);
    if(!_fbVoice)_fbVoice=fbPickVoice();
    const text=String(w).replace(/\s+/g," ").trim();
    /* break long text into clause-sized chunks so intonation resets and it phrases naturally
       (no lookbehind — matches runs of text ending at a natural pause) */
    const chunks=text.length>80?(text.match(/[^.!?;:—]+[.!?;:—]*/g)||[text]).map(s=>s.trim()).filter(Boolean):[text];
    const r=rate||(text.length>80?0.9:0.95);
    const speakAll=()=>{
      chunks.forEach((c,i)=>{
        const u=new SpeechSynthesisUtterance(c);
        u.lang="en-US";u.rate=r;u.pitch=1.0;
        if(_fbVoice)u.voice=_fbVoice;
        if(i===chunks.length-1)u.onend=u.onerror=()=>clearInterval(fbSayKeep);
        speechSynthesis.speak(u);
      });
      fbSayKeep=setInterval(()=>{if(speechSynthesis.speaking){speechSynthesis.pause();speechSynthesis.resume()}else clearInterval(fbSayKeep)},10000);
      setTimeout(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending)toast(t("fb.tts_no_voice"))},600);
    };
    setTimeout(speakAll,80); /* Chrome drops speak() fired immediately after cancel() */
  }catch(e){toast(t("fb.tts_unavailable"))}
}
window.fbToggle=()=>{
  if(!SR)return toast(t("fb.sr_unavailable"));
  if(fbOn){try{fbRec.stop()}catch(e){}return}
  const target=document.getElementById("shNote").value.trim();
  if(!target)return toast(t("fb.write_transcript_first"));
  fbFinal="";fbOn=true;fbT0=Date.now();
  fbCtx={vid:shClip.vid,recCtx:shClip.vid?("shadow-"+shClip.vid):null};
  document.getElementById("fbBtn").textContent=t("fb.stop_btn");
  document.getElementById("fbStatus").textContent=t("fb.listening_status");
  document.getElementById("fbOut").innerHTML="";
  fbRec=new SR();fbRec.lang="en-US";fbRec.continuous=true;fbRec.interimResults=true;fbRec.maxAlternatives=1;
  fbRec.onresult=e=>{
    /* rebuilt from the whole list (see srText) — appending would repeat every
       word on Android, which then wrecks the pronunciation scoring */
    fbFinal=srText(e.results);

  };

/* A coach names the two or three things worth fixing, not all of them. The rest
   stay one tap away. Ranked worst-first: a word that was not caught at all
   outranks one that was merely misheard, and among misheard words the least
   similar comes first — so the top of the list is the highest-impact work. */
const FB_TOP_FIXES=3;
/* Score trend — a hand-rolled SVG sparkline, no chart library.
   Scales with its container through viewBox alone, so it needs no resize
   listener and no redraw. Fewer than two scored attempts is not a trend, so it
   renders nothing rather than a single floating dot. Every colour is a token,
   and the aria-label reuses the existing "your last scores" key plus the same
   figures the text row already shows — no new i18n keys. */
/* Normalised access to every feature's attempt history. Each feature keeps its
   own storage shape for backwards compatibility; this is the single place that
   knows how to read them, so a new chart never has to care.
   Returns [{score, ts}] oldest-first. */
function perfSeries(kind,key){
  try{
    if(kind==="speaking")  return (S.fbHist||[]).filter(x=>typeof x.score==="number").map(x=>({score:x.score,ts:x.ts}));
    if(kind==="clip")      return ((S.fbV||{})[key]||[]).map(v=>({score:v}));
    if(kind==="grammar")   return (((S.gram||{})[key]||{}).hist||[]).map(x=>({score:x.p,ts:x.t}));
    if(kind==="vocabquiz") return ((S.quizHist||[])).map(x=>({score:x.p,ts:x.t}));
  }catch(e){}
  return [];
}
/* Appends one attempt to a capped series. Capped because these live in
   localStorage and sync to Firestore as one JSON blob. */
function perfPush(arr,rec,cap){arr.push(rec);if(arr.length>(cap||30))arr.splice(0,arr.length-(cap||30));return arr}

/* ---- Progress overview -------------------------------------------------
   A trend section for the Progress screen, built entirely from series that
   already exist. Every block hides itself until it has two attempts to plot,
   so the section grows as the user practises rather than showing empty frames.
   The whole section is absent on a first run. */
function perfHeadline(series){
  if(series.length<2)return null;
  const first=series[0].score,last=series[series.length-1].score;
  const best=Math.max(...series.map(x=>x.score));
  return {n:series.length,best,delta:last-first,last};
}
function perfBlock(titleKey,series,opts){
  const chart=perfPanel(series,opts);
  if(!chart)return "";
  const h=perfHeadline(series);
  const sign=h.delta>0?"+":"";
  return `<div class="perf-block">
    <div class="perf-block-h">
      <b>${esc(t(titleKey))}</b>
      <span class="perf-delta ${h.delta>0?"up":h.delta<0?"down":""}">${sign}${h.delta}<span class="perf-unit">pts</span></span>
    </div>
    <div class="perf-facts">
      <span>${t("perf.attempts",{n:h.n})}</span><span aria-hidden="true">·</span>
      <span>${t("perf.best",{n:h.best})}</span>
    </div>
    ${chart}</div>`;
}
function perfOverviewHTML(){
  const blocks=[
    perfBlock("perf.speaking",perfSeries("speaking")),
    perfBlock("perf.grammar",perfSeries("grammar",perfBestGramCat())),
    perfBlock("perf.vocabquiz",perfSeries("vocabquiz")),
  ].filter(Boolean);
  if(!blocks.length)return "";
  return `<div class="card" style="margin-top:16px">
    <h2 class="pf-card-h">${hIcon("chart",t("perf.overview_title"))}</h2>
    <p style="font-size:12.5px;color:var(--mut);margin:6px 0 14px">${t("perf.overview_sub")}</p>
    ${blocks.join("")}</div>`;
}
/* the grammar category with the most runs — the one the user actually drills */
function perfBestGramCat(){
  const g=S.gram||{};let best=null,n=-1;
  for(const k of Object.keys(g)){const l=((g[k]||{}).hist||[]).length;if(l>n){n=l;best=k}}
  return best;
}

/* The panel every screen uses: heading + chart, or nothing at all when there
   is not yet a trend to show. Keeps the chrome identical everywhere. */
function perfPanel(series,opts){
  const svg=renderPerformanceTrend(series,Object.assign({axis:true},opts||{}));
  return svg?`<div class="sh-trend"><b class="sh-trend-h">${hIcon("chart",t("sh.trend_title"))}</b>${svg}</div>`:"";
}

/* ---- Shared performance-trend component -------------------------------
   ONE renderer for every screen that records repeated scored attempts.
   Callers pass a normalised series (see perfSeries) plus options; nobody draws
   their own chart. fbTrendSVG is retained as an alias for existing callers. */
function renderPerformanceTrend(scored,opts){
  opts=opts||{};
  const pts=scored.slice(-5).filter(x=>typeof x.score==="number");
  if(pts.length<2)return "";
  /* Axis labels are opt-in: Speaking Feedback renders without them, Shadowing
     Studio turns them on. Same component either way — the extra room for the
     label row is the only geometry that changes. */
  const AX=opts.axis?12:0;
  const W=300,H=92+AX,PL=16,PR=16,PT=24,PB=18+AX;
  const vals=pts.map(p=>p.score);
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const span=hi-lo;
  const x=i=>PL+(W-PL-PR)*(i/(pts.length-1));
  /* a flat run has no range to scale against — park it on the mid-line */
  const y=v=>span===0?PT+(H-PT-PB)/2:PT+(H-PT-PB)*(1-(v-lo)/span);
  let d=`M ${x(0).toFixed(1)} ${y(vals[0]).toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const x0=x(i-1),y0=y(vals[i-1]),x1=x(i),y1=y(vals[i]),cx=(x0+x1)/2;
    d+=` C ${cx.toFixed(1)} ${y0.toFixed(1)} ${cx.toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  const dots=pts.map((p,i)=>
    `<circle class="fb-trend-dot" cx="${x(i).toFixed(1)}" cy="${y(p.score).toFixed(1)}" r="3.5"/>`).join("");
  const labels=pts.map((p,i)=>
    `<text class="fb-trend-lbl" x="${x(i).toFixed(1)}" y="${(y(p.score)-11).toFixed(1)}" text-anchor="middle">${p.score}%</text>`).join("");
  /* The x axis is the attempt number, which needs no translation; only the
     final tick is a word, and it reuses an existing key. Numbers keep the row
     legible at 320px and in every language. */
  const axis=opts.axis?pts.map((p,i)=>
    `<text class="fb-trend-ax" x="${x(i).toFixed(1)}" y="${(H-4).toFixed(1)}" text-anchor="middle">${
      i===pts.length-1?esc(t("rp.hist_latest")):(opts.first||1)+i}</text>`).join(""):"";
  return `<div class="fb-trend">
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="${esc(t("fb.last_scores_label"))}: ${vals.join("%, ")}%">
      <path class="fb-trend-line" d="${d}"/>${dots}${labels}${axis}
    </svg></div>`;
}
window.fbTrendSVG=renderPerformanceTrend;   // alias: existing call sites
function fbRanked(problems){
  return problems.slice().sort((a,b)=>{
    const sev=x=>x.op==="sub"?wsim(x.t,x.h):-1;    // -1 = not caught at all
    return sev(a)-sev(b);
  });
}

function fbShowResults(targetText,heardText,fromRec){

async function pcLoad(){

  const files=await v.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  PC.lm=await v.PoseLandmarker.createFromOptions(files,{

    runningMode:"VIDEO",numPoses:1});

window.pcToggle=async()=>{

  const btn=document.getElementById("pcBtn");if(btn)btn.textContent=t("pc.stop_btn");

    await PC.video.play();

    if(st)st.textContent=t("pc.calibrating");

/* Close the posture panel completely and return the card to how it looked
   before. Stopping the coach alone left the panel (and its summary) sitting
   there with no way to get rid of it — fine if you want to read the result,
   annoying if you tried the feature and decided against it. */
window.pcDismiss=()=>{
  if(PC.on)pcStop(false);

  if(w){w.style.display="none";w.classList.remove("show")}
  const st=document.getElementById("pcState");if(st)st.textContent=t("sess.posture_starting");
  const msg=document.getElementById("pcMsg");if(msg)msg.textContent=t("sess.posture_msg");
  const btn=document.getElementById("pcBtn");if(btn)btn.textContent=t("sess.posture_btn");
};
function pcStop(showSummary){
  PC.on=false;clearInterval(PC.h);
  if(PC.stream){PC.stream.getTracks().forEach(tr=>tr.stop());PC.stream=null}
  pcRing(false);
  const btn=document.getElementById("pcBtn");if(btn)btn.textContent=t("sess.posture_btn");
  if(showSummary&&PC.frames>30){
    const up=Math.round(100*(1-PC.slouchF/PC.frames));
    const st=document.getElementById("pcState"),msg=document.getElementById("pcMsg");
    if(st)st.textContent=t("pc.session_result",{up});
    if(msg)msg.textContent=up>=85?t("pc.summary_great"):
      up>=60?t("pc.summary_good"):
      t("pc.summary_poor");
    toast(t("pc.session_toast",{up}));
  }
}
function pcLum(){
  try{
    const c=pcLum.c||(pcLum.c=document.createElement("canvas"));c.width=32;c.height=24;
    const g=c.getContext("2d",{willReadFrequently:true});
    g.drawImage(PC.video,0,0,32,24);
    const d=g.getImageData(0,0,32,24).data;let s=0;
    for(let i=0;i<d.length;i+=4)s+=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
    return s/(d.length/4);
  }catch(e){return 128}
}
function pcTick(){
  if(!PC.on||!PC.video||PC.video.readyState<2)return;
  let res;try{res=PC.lm.detectForVideo(PC.video,performance.now())}catch(e){return}
  /* low-light check every ~2s: the screen itself becomes the ring light */
  if(PC.frames%30===0&&!PC.ringDismissed){
    const dark=pcLum()<45;
    if(dark&&!PC.ring){pcRing(true);toast(t("pc.lowlight_toast"))}
    else if(!dark&&PC.ring)pcRing(false);
  }
  const lms=res&&res.landmarks&&res.landmarks[0];
  const st=document.getElementById("pcState"),msg=document.getElementById("pcMsg"),cv=document.getElementById("pcCv");
  if(!st||!cv)return pcStop(false);
  if(!lms){
    if(++PC.noDet>75){ /* ~5s with nobody detected → graceful fail-safe */
      pcStop(false);
      st.textContent=t("pc.tracking_paused");
      msg.textContent=t("pc.tracking_paused_msg");
      const btn=document.getElementById("pcBtn");if(btn)btn.textContent=t("pc.restart_btn");
    }
    return;
  }
  PC.noDet=0;PC.frames++;
  const L=i=>lms[i];
  const comp=((L(11).y+L(12).y)/2)-((L(7).y+L(8).y)/2); /* ear-to-shoulder compression: bigger = upright */
  const tilt=Math.abs(L(7).y-L(8).y);
  if(PC.baseVal===null){
    PC.base.push(comp);
    if(PC.base.length>=45){PC.base.sort((a,b)=>a-b);PC.baseVal=PC.base[Math.floor(PC.base.length/2)];st.textContent=t("pc.calibrated")}
  }
  let state="good";
  if(PC.baseVal!==null){
    if(comp<PC.baseVal*0.82){state="bad";PC.slouchF++;st.textContent=t("pc.slouching");msg.textContent=t("pc.slouching_msg")}
    else if(tilt>0.045){state="warn";PC.tiltF++;st.textContent=t("pc.head_tilted");msg.textContent=t("pc.head_tilted_msg")}
    else{st.textContent=t("pc.exec_posture");msg.textContent=t("pc.exec_posture_msg")}
  }
  cv.className="pc-cv "+state;
  pcDraw(cv,lms,state);
}
function pcDraw(cv,lms,state){
  const g=cv.getContext("2d");g.clearRect(0,0,cv.width,cv.height);
  const col=state==="bad"?"#f97316":state==="warn"?"#fbbf24":"#34d399";
  const P=i=>({x:(1-lms[i].x)*cv.width,y:lms[i].y*cv.height});
  const line=(a,b)=>{g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()};
  g.strokeStyle=col;g.lineWidth=3;g.lineCap="round";
  const sh1=P(11),sh2=P(12),shMid={x:(sh1.x+sh2.x)/2,y:(sh1.y+sh2.y)/2},nose=P(0);
  line(sh1,sh2);line(shMid,nose);line(sh1,P(13));line(P(13),P(15));line(sh2,P(14));line(P(14),P(16));
  g.fillStyle=col;g.beginPath();g.arc(nose.x,nose.y,6.5,0,7);g.fill();
}

/* Each booster needs a different amount of material before it can run, so the
   green "ready" state is worked out per card with the same thresholds the
   start functions enforce. No words → grey card, and tapping still explains. */
function pvReady(){
  const w=pvBucket();
  const cw=[...new Set(w.map(x=>x.toLowerCase()))].filter(x=>/^[a-z]+$/.test(x)&&x.length>=3&&x.length<=9);
  return {fc:w.length>=1, qz:w.length>=4, cw:cw.length>=2};
}

/* ---- Crosswords (greedy generator) ---- */
let _cw=null;
window.cwStart=()=>{
  let pool=[...new Set(pvBucket().map(w=>w.toLowerCase()))].filter(w=>/^[a-z]+$/.test(w)&&w.length>=3&&w.length<=9);
  pool=pool.sort(()=>Math.random()-.5).slice(0,10);
  if(pool.length<2)return toast(t("prac.cw_need"));
  const layout=cwGen(pool);
  if(!layout||layout.placed.length<2)return toast(t("prac.cw_fail"));
  _cw=layout;cwRender();
};
function cwGen(words){
  words=words.slice().sort((a,b)=>b.length-a.length);
  const grid={},placed=[],K=(r,c)=>r+","+c;
  function canPlace(word,r,c,dir){
    for(let i=0;i<word.length;i++){const rr=dir==="a"?r:r+i,cc=dir==="a"?c+i:c,cur=grid[K(rr,cc)];
      if(cur&&cur!==word[i])return false;
      if(!cur){if(dir==="a"){if(grid[K(rr-1,cc)]||grid[K(rr+1,cc)])return false;}else{if(grid[K(rr,cc-1)]||grid[K(rr,cc+1)])return false;}}}
    if(dir==="a"){if(grid[K(r,c-1)]||grid[K(r,c+word.length)])return false;}else{if(grid[K(r-1,c)]||grid[K(r+word.length,c)])return false;}
    return true;
  }
  function place(word,r,c,dir){for(let i=0;i<word.length;i++){const rr=dir==="a"?r:r+i,cc=dir==="a"?c+i:c;grid[K(rr,cc)]=word[i];}placed.push({word,r,c,dir});}
  place(words[0],0,0,"a");
  for(let wi=1;wi<words.length;wi++){const word=words[wi];let done=false;
    for(const p of placed){for(let i=0;i<p.word.length&&!done;i++)for(let j=0;j<word.length&&!done;j++){
      if(p.word[i]!==word[j])continue;
      let r,c,dir;if(p.dir==="a"){dir="d";r=p.r-j;c=p.c+i;}else{dir="a";r=p.r+i;c=p.c-j;}
      if(canPlace(word,r,c,dir)){place(word,r,c,dir);done=true;}}
      if(done)break;}
  }
  let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9;
  placed.forEach(p=>{for(let i=0;i<p.word.length;i++){const rr=p.dir==="a"?p.r:p.r+i,cc=p.dir==="a"?p.c+i:p.c;minR=Math.min(minR,rr);minC=Math.min(minC,cc);maxR=Math.max(maxR,rr);maxC=Math.max(maxC,cc);}});
  placed.forEach(p=>{p.r-=minR;p.c-=minC;});
  const rows=maxR-minR+1,cols=maxC-minC+1,sol={};
  placed.forEach(p=>{for(let i=0;i<p.word.length;i++){const rr=p.dir==="a"?p.r:p.r+i,cc=p.dir==="a"?p.c+i:p.c;sol[rr+","+cc]=p.word[i];}});
  const starts=[...new Set(placed.map(p=>p.r+","+p.c))].sort((a,b)=>{const A=a.split(",").map(Number),B=b.split(",").map(Number);return A[0]-B[0]||A[1]-B[1];});
  const numOf={};starts.forEach((k,idx)=>numOf[k]=idx+1);placed.forEach(p=>p.num=numOf[p.r+","+p.c]);
  return {placed,sol,rows,cols};
}
async function cwRender(){

/* Estimate a heard word's [start,end] position as a fraction of the recording,
   weighted by word length (+gap) so longer words take proportionally more time —
   far closer than assuming every word takes an equal slice. */
function fbWordFrac(h,idx){
  const w=h.map(x=>String(x).length+1.5);
  const tot=w.reduce((a,b)=>a+b,0)||1;
  let bef=0;for(let k=0;k<idx;k++)bef+=w[k];
  return[+(bef/tot).toFixed(4),+((bef+(w[idx]||1.5))/tot).toFixed(4)];

/* Split a recording into real speech chunks using RMS energy: silences between
   words become segment boundaries. Returns [{start,end}] seconds. Cached per blob. */
const _fbSegCache=new WeakMap();
async function fbSegments(blob){
  if(_fbSegCache.has(blob))return _fbSegCache.get(blob);
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();
  let buf;
  try{buf=await ac.decodeAudioData(await blob.arrayBuffer());}
  catch(e){try{ac.close()}catch(_){}return null;}
  const data=buf.getChannelData(0),sr=buf.sampleRate,dur=buf.duration;
  const fLen=Math.max(1,Math.round(sr*0.02));      // 20ms frames
  const nF=Math.floor(data.length/fLen);
  const rms=new Float32Array(nF);let peak=1e-6;
  for(let i=0;i<nF;i++){let s=0;const off=i*fLen;for(let j=0;j<fLen;j++){const v=data[off+j];s+=v*v;}const r=Math.sqrt(s/fLen);rms[i]=r;if(r>peak)peak=r;}
  const thr=Math.max(0.015,peak*0.14);             // speech vs silence
  const gap=Math.round(0.11/0.02);                 // ≥110ms silence ends a word
  const minLen=Math.round(0.06/0.02);              // ignore <60ms blips
  const segs=[];let inSeg=false,segStart=0,sil=0;
  for(let i=0;i<nF;i++){
    if(rms[i]>thr){if(!inSeg){inSeg=true;segStart=i;}sil=0;}
    else if(inSeg){sil++;if(sil>=gap){const end=i-sil+1;if(end-segStart>=minLen)segs.push({start:segStart*0.02,end:end*0.02});inSeg=false;}}
  }
  if(inSeg){const end=nF-sil;if(end-segStart>=minLen)segs.push({start:segStart*0.02,end:end*0.02});}
  try{ac.close()}catch(_){}
  const out={segs,dur};_fbSegCache.set(blob,out);return out;
}

const _fbWordsCache=new WeakMap();
function fbWords(blob){
  if(_fbWordsCache.has(blob))return _fbWordsCache.get(blob);

      if(!r.ok)return null;

const _fbTxCache=new WeakMap();
function fbTranscribe(blob){

/* pick the Whisper word for a heard-word position, snapping to a text match nearby */
function fbPickWord(words,wordIdx,wordCount,heardWord){
  let wi=words.length===wordCount?wordIdx:Math.round((wordIdx+0.5)/Math.max(1,wordCount)*words.length-0.5);
  wi=Math.max(0,Math.min(words.length-1,wi));
  const hw=(heardWord||"").toLowerCase().replace(/[^a-z']/g,"");
  if(hw)for(let d=0;d<=2;d++){for(const j of [wi-d,wi+d]){if(j>=0&&j<words.length&&(words[j].w||"").replace(/[^a-z']/g,"")===hw){return words[j]}}}
  return words[wi];
}
window.fbYou=async(sf,ef,wordIdx,wordCount,heardWord)=>{
  if(ef==null)ef=sf;

  if(!recs.length)return toast(t("fb.you_no_rec_toast"));
  if(fbAud){fbAud.pause();fbAud=null}
  const blob=recs[0].blob;
  const words=await fbWords(blob);                       // precise word timings (or null offline)
  const seg=words?null:await fbSegments(blob);           // fall back to energy segments only when needed
  const aud=new Audio(URL.createObjectURL(blob));fbAud=aud;
  const playSpan=d=>{
    let start=null,end=null;
    if(words&&words.length){                              // ── precise: exact Whisper word span
      const wobj=fbPickWord(words,wordIdx,wordCount,heardWord);
      start=wobj.start;end=wobj.end;
    }else if(seg&&seg.segs.length&&wordCount>0){          // ── energy-burst estimate
      let si=seg.segs.length===wordCount?wordIdx:Math.round((wordIdx+0.5)/wordCount*seg.segs.length-0.5);
      si=Math.max(0,Math.min(seg.segs.length-1,si));
      start=seg.segs[si].start;end=seg.segs[si].end;
    }else{                                                // ── time-fraction estimate
      const pad=0.18;start=Math.max(0,sf*d-pad);end=Math.min(d,ef*d+pad);
    }
    const s=Math.max(0,start-0.04),e=Math.min(d,end+0.08);
    aud.currentTime=s;aud.play();
    setTimeout(()=>{if(fbAud===aud)aud.pause()},Math.max(320,(e-s)*1000+120));
  };
  aud.onloadedmetadata=()=>{
    if(isFinite(aud.duration)&&aud.duration>0)playSpan(aud.duration);
    else{aud.currentTime=1e10;aud.onseeked=()=>{aud.onseeked=null;playSpan(aud.duration)};}
  };
};
/* ===== AI PRONUNCIATION COACH (an audio model listens & grades each word) ===== */
/* decode the recording → 16 kHz mono → 16-bit WAV → base64 (a format the audio model accepts) */
async function blobToWavB64(blob){
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();let buf;
  try{buf=await ac.decodeAudioData(await blob.arrayBuffer());}catch(e){try{ac.close()}catch(_){}return null;}
  try{ac.close()}catch(_){}
  const sr=16000,dur=Math.min(buf.duration,25);                 // cap at 25s to bound cost
  const frames=Math.max(1,Math.round(dur*sr));
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const off=new OAC(1,frames,sr),src=off.createBufferSource();
  src.buffer=buf;src.connect(off.destination);src.start();
  const pcm=(await off.startRendering()).getChannelData(0);
  const nb=pcm.length*2,ab=new ArrayBuffer(44+nb),dv=new DataView(ab);
  const wr=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  wr(0,"RIFF");dv.setUint32(4,36+nb,true);wr(8,"WAVE");wr(12,"fmt ");
  dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);
  wr(36,"data");dv.setUint32(40,nb,true);
  let o=44;for(let i=0;i<pcm.length;i++){let s=Math.max(-1,Math.min(1,pcm[i]));dv.setInt16(o,s<0?s*0x8000:s*0x7fff,true);o+=2;}
  const bytes=new Uint8Array(ab);let bin="";const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}

/* ===== EXECUTIVE POLISH: casual → executive speech (rule-based) ===== */
const EXEC_FRAMES=[["Open like an executive","The headline is… / At a high level…"],["State the issue","The main blocker is… / The root cause appears to be…"],["Close with action","The next step is… / What I need from you is…"]];
function execPolish(text){
  let out=" "+String(text).trim()+" ";const changes=[];
  for(const f of FILLERS){
    const re=new RegExp("\\b"+f+"\\b[,]* ","gi");
    if(re.test(out)){out=out.replace(re,"");changes.push(`removed filler “${f}”`)}
  }
  const SOFT=[[/\bi think maybe (we|you|they) (should|need to|could)\b/gi,"I recommend $1"],[/\brecommend (we|you|they) need to\b/gi,"recommend $1"],[/\bi think maybe\b,?\s*/gi,""],[/\bi think\b,?\s*/gi,""],[/\bmaybe\b\s*/gi,""],[/\bsorry about that\b[.,]?\s*/gi,""],[/\bto be honest\b,?\s*/gi,""],[/\bkind of\b/gi,""],[/\bsort of\b/gi,""],[/\bjust\b/gi,""],[/\bstuff\b/gi,"work"],[/\bthings\b/gi,"items"],[/\ba lot of\b/gi,"significant"],[/\bvery very\b/gi,"extremely"]];
  for(const[re,rep]of SOFT){if(re.test(out)){out=out.replace(re,rep);changes.push(`“${re.source.replace(/\\b|\(.*?\)/g,"").trim()}” → ${rep?rep.replace(/\$1\s*/,""):"(removed)"}`)}}
  for(const[re,bad,corr]of GRAM_FIX){
    if(re.test(out)){out=out.replace(re,m=>corr==="for X years"?m.replace(/since/i,"for"):corr);changes.push(`${bad} → ${corr}`)}
  }
  for(const[a,b]of Object.entries(SYN_UP)){
    /* don't upgrade verbs into ungrammatical infinitives: "need to" stays "need to" */
    const re=a==="need"?/\bneed\b(?!\s+to)/gi:a==="get"?/\bget\b(?!\s+(to|up|back|it|out))/gi:new RegExp("\\b"+a+"\\b","gi");
    if(re.test(out)){out=out.replace(re,b);changes.push(`${a} → ${b}`)}
  }
  out=out.replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").trim();
  if(out)out=out[0].toUpperCase()+out.slice(1);
  if(out&&!/[.!?]$/.test(out))out+=".";
  return{out,changes};
}

  const show=exQueue.splice(0,2);
  if(!show.length){exRenderOffline(inp,t("ex.ai_err"));markPracticed();save();return}
  show.forEach(v=>exPrev.push(v.text));if(exPrev.length>6)exPrev=exPrev.slice(-6);   // only avoid the last few → keeps request tokens small
  exRenderVersions(show);
  markPracticed();save();
};

/* User-controlled dictation: tap the mic to start, speak as long as you like
   (whole sentences or a paragraph, through pauses), tap again to stop. */
/* exBase  – text already in the box before dictation started
   exDone   – finalised text from earlier recognition sessions (the recogniser is
              restarted whenever the browser stops it on a silence)
   exFinal  – finalised text of the CURRENT session, rebuilt from scratch on every
              result event rather than appended to. Android Chrome reports
              resultIndex 0 with the whole accumulated result list each time, so
              appending duplicates every word ("thank thank thank you you you"). */
let exRec=null,exListening=false,exBase="",exFinal="",exDone="";
function exSetMic(on){
  exListening=on;
  const b=document.getElementById("exMic"),st=document.getElementById("exSt");
  if(b)b.classList.toggle("ex-mic-live",on);
  if(st)st.textContent=on?t("ex.dictate_listening_hold"):"";
}
window.exDictate=()=>{
  if(!SR)return toast(t("ex.dictate_sr_unavailable"));
  if(exListening){exListening=false;if(exRec){try{exRec.stop()}catch(_){}}return}   // second tap → stop
  const inp=document.getElementById("exIn");
  exBase=inp.value.trim();exFinal="";exDone="";               // keep any text already typed
  exRec=new SR();exRec.lang="en-US";exRec.continuous=true;exRec.interimResults=true;
  exRec.onresult=e=>{
    /* Rebuild this session's transcript from the whole list every time — never
       append. srText() also collapses Android's cumulative partials. */
    exFinal=srText(e.results);
    inp.value=((exBase?exBase+" ":"")+(exDone?exDone+" ":"")+exFinal).replace(/\s+/g," ").trimStart();
  };
  exRec.onerror=ev=>{if(ev.error!=="no-speech"&&ev.error!=="aborted"){const st=document.getElementById("exSt");if(st)st.textContent=t("ex.dictate_mic_error")}};
  exRec.onend=()=>{
    /* Browser stopped on a silence but the user hasn't tapped stop → keep going.
       Bank this session's text first: the restarted recogniser begins a fresh
       result list, so exFinal is about to be rebuilt from empty. */
    if(exListening){exDone=(exDone?exDone+" ":"")+exFinal;exFinal="";try{exRec.start();return}catch(_){}}
    exSetMic(false);inp.value=inp.value.trim();
    if(inp.value)window.exGo();                               // finished dictating → produce the professional version straight away
  };
  try{exRec.start();exSetMic(true);}catch(e){exSetMic(false);toast(t("ex.dictate_mic_error"))}
};

/* Tap to record, tap again to stop. Shared by the phrase cards and the
   full-speech box, which only differ by where the clip is filed. */
async function phRecInto(ctx,label,btn,after){
  if(rec.mr&&rec.mr.state==="recording"){rec.mr.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec={mr:new MediaRecorder(stream),chunks:[],t0:Date.now(),h:null,ctx,label};
    rec.mr.ondataavailable=e=>rec.chunks.push(e.data);
    rec.mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const phBlob=new Blob(rec.chunks,{type:rec.mr.mimeType||"audio/webm"});
      if(btn){btn.style.borderColor="";btn.style.color=""}
      if(phBlob.size<1200||(Date.now()-rec.t0)<400){toast(t("ph.too_short_toast"));return}
      const phOk=await addRec(rec.ctx,rec.label,phBlob);   // see the note at the shadow recorder
      if(!phOk){toast(t("rec.save_failed_toast"));return}
      markPracticed();save();
      toast(t("ph.rec_saved_toast"));if(after)after();
      if(GH.auto&&ghCfg())ghSyncRecs(true);
    };
    rec.mr.start();if(btn){btn.style.borderColor="var(--red)";btn.style.color="var(--red)"}
  }catch(e){toast(t("ph.mic_denied_toast"))}
}

/* ===== PROGRESS STUDIO (Preply-style stats, app theme) ===== */
function pgArea(data,stroke,W,H,unit){
  if(data.length<2)return`<div style="height:${H}px;display:grid;place-items:center;color:var(--mut2);font-size:12.5px">${t("prog.chart_no_data")}</div>`;
  const P=14,n=data.length;
  const lo=Math.min(...data)*0.9,hi=Math.max(...data)*1.05||1;
  const X=i=>P+i/(n-1)*(W-2*P),Y=v=>H-P-(v-lo)/(hi-lo||1)*(H-2*P);
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const gid="g"+Math.random().toString(36).slice(2,7);
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">

      <stop offset="0%" stop-color="${stroke}" stop-opacity=".35"/><stop offset="100%" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>
    ${[0.25,0.5,0.75].map(f=>`<line x1="${P}" x2="${W-P}" y1="${(H-2*P)*f+P}" y2="${(H-2*P)*f+P}" stroke="rgba(255,255,255,.06)"/>`).join("")}
    <path d="${line} L${pts[n-1][0]},${H-P} L${pts[0][0]},${H-P} Z" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="4.5" fill="${stroke}" stroke="var(--card)" stroke-width="2"/>
    <text x="${pts[n-1][0]-6}" y="${pts[n-1][1]-9}" text-anchor="end" font-size="12" font-weight="700" fill="var(--txt)" font-family="JetBrains Mono,monospace">${data[n-1]}${unit}</text>
    ${pts.map((p,i)=>`<rect x="${p[0]-((W-2*P)/(n-1))/2}" y="0" width="${(W-2*P)/(n-1)}" height="${H}" fill="transparent"><title>${unit==="%"?"Attempt":"Entry"} ${i+1}: ${data[i]}${unit}</title></rect>`).join("")}
  </svg>`;
}

function pgStory(){
  const now=Date.now(),wk=7*864e5;
  const week=S.fbHist.filter(x=>now-x.ts<wk);
  const days=new Set(S.dates.filter(d=>now-new Date(d).getTime()<wk)).size;
  const words=week.reduce((a,x)=>a+(x.words||0),0);
  const sc=S.fbHist.filter(x=>x.score!=null);
  const recent=sc.slice(-3).map(x=>x.score),earlier=sc.slice(-6,-3).map(x=>x.score);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const rNow=avg(recent),rPrev=avg(earlier);
  const vocNew=Object.values(S.vocab||{}).filter(v=>now-v.ts<wk).length;
  const tb=Object.keys(S.trouble||{}).length;
  const name=S.profile&&S.profile.name?S.profile.name:"You";
  if(!week.length&&!days)return t("story.empty",{name}).replace(/🎯\s*/,`<span class="inl-ic">${ic("target")}</span>`);
  let s=t(days!==1?"story.base_many":"story.base_one",{name,days,words:words.toLocaleString()});
  if(rNow!=null&&rPrev!=null)s+=rNow>rPrev?t("story.climb",{prev:rPrev,now:rNow}):rNow<rPrev?t("story.dip",{prev:rPrev,now:rNow}):t("story.steady",{now:rNow});

  if(vocNew)s+=t(vocNew>1?"story.voc_many":"story.voc_one",{n:vocNew});
  s+=tb?t(tb>1?"story.trouble_many":"story.trouble_one",{n:tb}):t("story.trouble_empty");
  return s;
}

  for(let y=0;y<=10;y+=5){ctx.beginPath();ctx.moveTo(20,140-y*13);ctx.lineTo(475,140-y*13);ctx.stroke()}
  const g=ctx.createLinearGradient(0,0,480,0);g.addColorStop(0,"#6366f1");g.addColorStop(1,"#22d3ee");
  ctx.strokeStyle=g;ctx.lineWidth=2.5;ctx.beginPath();let started=false;

/* ===== Progress calendar: a live heatmap of the days you actually practised ===== */
let calCur=null;
function calLevel(c){return c<=0?0:c>=6?4:c>=4?3:c>=2?2:1}
function bestStreak(){
  const arr=[...new Set(S.dates||[])].sort();if(!arr.length)return 0;
  let best=1,cur=1;
  for(let i=1;i<arr.length;i++){
    const diff=Math.round((new Date(arr[i])-new Date(arr[i-1]))/86400000);
    if(diff===1){cur++;if(cur>best)best=cur}else if(diff>1){cur=1}
  }
  return best;
}
function calActiveSet(){return new Set(S.dates||[])}
/* days practised in the current (Monday-based) week, out of the 6/week goal */
function calWeekProgress(){
  const now=new Date(),today=now.toISOString().slice(0,10);
  const dow=(now.getDay()+6)%7;                       // Mon=0
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  const set=calActiveSet();let n=0;const labels=[];
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=d.toISOString().slice(0,10);const on=set.has(k);if(on)n++;labels.push({on,fut:d>now&&k!==today,isToday:k===today})}
  return{n,goal:6,labels};
}
/* active days ÷ days since program start, as a % */
function calConsistency(){
  const set=calActiveSet();if(!set.size)return 0;
  const start=new Date((S.startDate||[...set].sort()[0])+"T00:00:00");
  const today=new Date();today.setHours(0,0,0,0);
  const totalDays=Math.max(1,Math.round((today-start)/864e5)+1);
  return Math.min(100,Math.round(set.size/totalDays*100));
}
/* weekday the user practises most often */
function calBestDow(){
  const set=calActiveSet();if(!set.size)return null;
  const c=[0,0,0,0,0,0,0];set.forEach(k=>{c[(new Date(k+"T00:00:00").getDay()+6)%7]++});
  let bi=0;for(let i=1;i<7;i++)if(c[i]>c[bi])bi=i;
  if(!c[bi])return null;
  /* 2024-01-01 was a Monday, so +bi lands on the weekday we want */
  return new Date(2024,0,1+bi).toLocaleDateString(calLocale(),{weekday:"long"});
}
/* GitHub-style contribution grid for the last 52 weeks, with month labels on top */
/* Dates follow the language the user chose in the app, not the browser's — a
   German UI was printing "August 2026" and "Sunday, August 2". */
function calLocale(){return (S.profile&&S.profile.lang)||undefined}
function calMonthsAbbr(){return Array.from({length:12},(_,i)=>new Date(2020,i,1).toLocaleDateString(calLocale(),{month:"short"}))}
function calYearHeat(){
  const set=calActiveSet(),log=S.dayLog||{},MO=calMonthsAbbr();
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(today);start.setDate(start.getDate()-363);
  start.setDate(start.getDate()-((start.getDay()+6)%7));   // align to Monday
  let cols="",months="",cur=new Date(start),prevMo=-1;
  while(cur<=today){
    const mo=cur.getMonth();                                // month of this week's Monday
    months+=`<span class="cal-ymo">${mo!==prevMo?MO[mo]:""}</span>`;prevMo=mo;
    let col="";
    for(let r=0;r<7;r++){
      const k=cur.toISOString().slice(0,10),fut=cur>today;
      const lvl=fut?-1:(set.has(k)?calLevel(log[k]||1):0);
      col+=`<span class="cal-ysq" data-lvl="${lvl}" title="${k}"></span>`;
      cur.setDate(cur.getDate()+1);
    }
    cols+=`<div class="cal-ycol">${col}</div>`;
  }
  return `<div class="cal-ymonths">${months}</div><div class="cal-ygrid">${cols}</div>`;

let _devTaps=0,_devT=0;
window.devTap=()=>{
  const now=Date.now();if(now-_devT>3000)_devTaps=0;_devT=now;_devTaps++;   // generous 3s window between taps
  if(_devTaps>=5){_devTaps=0;
    const on=localStorage.be12_dev==="1";
    if(on)localStorage.removeItem("be12_dev");else localStorage.be12_dev="1";
    toast(on?"Developer tools hidden":"Developer tools shown — scroll down to GitHub sync");
    go("data");
  }else if(_devTaps>=2){
    toast((5-_devTaps)+" more tap"+(5-_devTaps===1?"":"s")+" to toggle developer tools");   // visible progress
  }
};
window.expData=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  a.download=`business-english-progress-${new Date().toISOString().slice(0,10)}.json`;a.click();

window.impData=inp=>{
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{
    const d=JSON.parse(r.result);if(!d.days)throw 0;
    const done=Object.keys(S.days||{}).length;
    if(!await askConfirm({title:t("cf.import_title"),body:t("cf.import_body",{n:done}),confirmLabel:t("cf.import_ok")})){inp.value="";return}
    S=d;save();toast(t("acc.import_toast"));go("home");
  }catch(e){toast(t("acc.import_invalid_toast"))}};
  r.readAsText(f);
};
window.resetAll=async()=>{
  /* Signed in, the account is what a device loads on sign-in — so wiping only
     this device would be undone the moment it logs in again. Reset therefore
     clears the account copy too, and says so before it does. */
  const signedIn=!!(FBUser&&FBdb);
  if(!await askConfirm({title:t("cf.reset_title"),
    body:signedIn?t("acc.reset_confirm_account"):t("acc.reset_confirm"),
    confirmLabel:t("cf.reset_ok")}))return;
  localStorage.removeItem(LS_KEY);
  dbReady.then(()=>{if(DB){const tx=DB.transaction("recs","readwrite");tx.objectStore("recs").clear()}});
  S=load();
  if(signedIn){
    /* Write the empty state immediately rather than leaving it to the debounced
       push, which could otherwise race a pull and restore what was just wiped. */
    try{await FBdb.collection("users").doc(FBUser.uid).set({json:JSON.stringify(S),savedAt:Date.now(),
      email:FBUser.email||"",updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    }catch(e){console.warn("[sync] reset of cloud copy failed:",(e&&(e.code||e.message))||e)}
  }
  save();toast(t("acc.reset_toast"));go("home");
};

function rpPickVoices(){
  const vs=(()=>{try{return speechSynthesis.getVoices()||[]}catch(e){return[]}})();
  if(!vs.length)return;
  const FEM=/\b(samantha|ava|allison|susan|zoe|nicky|serena|karen|moira|tessa|fiona|victoria|kate|aria|jenny|michelle|joanna|salli|kendra|kimberly|ivy|amy|emma|catherine|linda|heather|hazel|zira|female|nora|sandy|martha|isha|nicky)\b/i;
  const MAL=/\b(alex|daniel|fred|tom|aaron|arthur|oliver|gordon|lee|rishi|david|mark|guy|davis|matthew|joey|justin|george|james|william|ryan|brandon|reed|rocko|eddy|grandpa|male|male)\b/i;
  const score=(v,want)=>{
    const n=v.name||"";let s=0;
    if(/siri/i.test(n))s+=95; if(/natural/i.test(n))s+=90; if(/neural/i.test(n))s+=85; if(/enhanced|premium/i.test(n))s+=80; if(/google/i.test(n))s+=50;
    if(v.localService===false)s+=20;
    if(v.lang==="en-US")s+=20;else if(/^en[-_]/i.test(v.lang))s+=10;else s-=70;
    if(/compact|eloquence|novelty|whisper|organ|bells|zarvox|bubbles|trinoids/i.test(n))s-=60;

    if(want==="m"){if(isM)s+=45;else if(isF)s-=70}

    if(want==="f"||want==="m"){const yes=want==="f"?FEM:MAL,no=want==="f"?MAL:FEM;const matched=vs.filter(v=>yes.test(v.name||"")&&!no.test(v.name||""));if(matched.length)pool=matched;}

function rpAddBubble(who,text){const tx=document.getElementById("rpTx");if(!tx)return;const d=document.createElement("div");d.className="rp-bubble "+(who==="ai"?"ai":"me");d.textContent=text;tx.appendChild(d);tx.scrollTop=tx.scrollHeight;}
/* How long you may stay quiet before the turn is sent. Every word you speak
   resets it, so the only thing that can end your turn early is you. */
const RP_WINDOW=30;
/* Absolute ceiling on one turn, so a mic left open cannot upload minutes of audio. */
const RP_MAX=100000;
let rpRec=null;
/* Hand the microphone back. Every track must be stopped: while a live track
   exists iOS keeps the audio session in "record" and the character's reply
   plays silently — and the next turn inherits a half-open mic. */
function rpReleaseMic(rec){
  if(!rec)return;
  try{rec.mr&&rec.mr.state!=="inactive"&&rec.mr.stop()}catch(e){}
  try{rec.an&&rec.an.disconnect()}catch(e){}
  try{rec.src&&rec.src.disconnect()}catch(e){}
  try{rec.ctx&&rec.ctx.close()}catch(e){}
  try{rec.stream&&rec.stream.getTracks().forEach(tr=>{try{tr.stop()}catch(_){}})}catch(e){}
  rec.stream=null;
}
function rpMicUI(on){
  const foot=document.getElementById("rpFootIn"),mic=document.getElementById("rpMic");
  if(foot)foot.classList.toggle("listening",!!on);
  if(mic)mic.classList.toggle("on",!!on);
}
function rpStopListen(){
  const rec=rpRec; if(!rec)return;
  rec.stopped=true; rpRec=null;
  clearInterval(rec.tick);
  rpReleaseMic(rec);
  rpMicUI(false);
  rpDraft("");
}
/* The window ran out with nothing said. Rather than going quiet, the character
   puts the question again — that is what a real person would do. */
function rpNudge(){
  if(!rpConv)return;
  rpConv.nudges=(rpConv.nudges||0)+1;
  if(rpConv.nudges>2){rpIdle();return}          /* twice is a prompt, three times is nagging */
  const last=[...(rpConv.history||[])].reverse().find(m=>m.role==="assistant");
  const st=document.getElementById("rpStatus"); if(st)st.textContent=t("rp.nudge");
  if(last)rpVoice(last.content);
  rpResetIdle();
}
function rpDraft(txt){
  const tx=document.getElementById("rpTx");if(!tx)return;
  let d=document.getElementById("rpDraft");
  if(!txt){if(d)d.remove();return}
  if(!d){d=document.createElement("div");d.id="rpDraft";d.className="rp-bubble me draft";tx.appendChild(d)}
  d.textContent=txt; tx.scrollTop=tx.scrollHeight;
}
/* Close the recorder and hand back what it captured. */
function rpTakeBlob(rec){
  return new Promise(res=>{
    const mr=rec.mr;
    if(!mr||mr.state==="inactive"){rpReleaseMic(rec);res(rec.blob||null);return}
    let done=false;
    const finish=()=>{
      if(done)return; done=true;
      rec.blob=rec.chunks.length?new Blob(rec.chunks,{type:mr.mimeType||"audio/webm"}):null;
      rpReleaseMic(rec); res(rec.blob);
    };
    mr.onstop=finish;
    setTimeout(finish,1500);        /* a recorder that never fires onstop must not hang the turn */
    try{mr.stop()}catch(e){finish()}
  });
}
async function rpFinish(auto){
  const rec=rpRec; if(!rec)return;
  rec.stopped=true; rpRec=null; clearInterval(rec.tick);
  rpMicUI(false);
  const st=document.getElementById("rpStatus");
  /* Transcribe whenever you ended the turn yourself — the level check is only
     there to run the countdown, and it should never be what decides that you
     said nothing. A window that expired on its own really was silence. */
  const heard=rec.heard||!auto;
  /* Block a second tap while the clip is on its way to be transcribed. */
  if(rpConv)rpConv.busy=true;
  if(st&&heard)st.textContent=t("rp.transcribing");
  rpDraft(heard?"…":"");
  const blob=await rpTakeBlob(rec);
  let said="";
  if(heard&&blob&&blob.size>1200){
    try{said=(await fbTranscribe(blob))||""}catch(e){}
  }
  rpDraft("");
  if(rpConv)rpConv.busy=false;
  if(!rpConv)return;
  if(!said){
    /* Re-ask only when the window genuinely ran out. If you tapped stop yourself
       and said nothing, you meant to stop — just hand the mic back. */
    if(heard&&blob){if(st)st.textContent=t("rp.no_hear");}
    else if(auto){rpNudge();return}
    else if(st)st.textContent=t("rp.tap_to_speak");
    rpResetIdle();
    return;
  }
  /* Keep the turn and its audio: the post-practice review scores this recording
     word by word. */
  (rpConv.turns=rpConv.turns||[]).push({text:said,blob:blob});
  rpUserTurn(said);
}
/* Tap to start, tap again when you have finished.
   This records you and sends the clip to the Worker to be transcribed, rather
   than using the browser's own recogniser. The recogniser was the source of
   both device faults: Android re-sent phrases it had already finalised, so
   replies came back stacked on themselves, and iOS quietly stopped delivering
   results after a few turns. It also left nothing to grade — the pronunciation
   review needs the audio, and the recogniser will not share the microphone. */
window.rpListen=async()=>{
  if(!rpConv||rpConv.busy)return;
  audioUnlock();
  if(rpRec){rpFinish();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast(t("fb.sr_unavailable"));
  if(!POLISH_API||!navigator.onLine)return toast(t("rp.need_online"));
  rpClearIdle(); rpStopVoice();
  clearInterval(rpSayKeep); rpSetSpeaking(false);
  const st=document.getElementById("rpStatus");
  const rec={mr:null,chunks:[],stream:null,ctx:null,an:null,src:null,blob:null,
             heard:false,left:RP_WINDOW*1000,cap:RP_MAX,stopped:false,tick:null};
  rpRec=rec;
  rpMicUI(true);
  if(st)st.textContent=t("rp.tap_done");
  const paint=()=>{
    const bar=document.querySelector("#rpTimer i");
    if(bar)bar.style.setProperty("--p",(Math.max(0,Math.min(1,rec.left/(RP_WINDOW*1000)))).toFixed(3));
  };
  paint();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){
    rpStopListen();
    if(st)st.textContent=t("rp.tap_to_speak");
    toast(t("rec.mic_denied_toast")); rpResetIdle(); return;
  }
  if(rec.stopped){try{stream.getTracks().forEach(tr=>tr.stop())}catch(_){}return}
  rec.stream=stream;
  try{
    const mr=new MediaRecorder(stream);
    rec.mr=mr;
    mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data)};
    mr.start();
  }catch(e){rpStopListen();toast(t("rec.mic_denied_toast"));rpResetIdle();return}
  /* Listen to the level ourselves: the countdown only runs while you are quiet,
     so the turn ends when you stop talking, not mid-sentence. */
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      const ctx=new AC(); rec.ctx=ctx;
      const src=ctx.createMediaStreamSource(stream); rec.src=src;
      const an=ctx.createAnalyser(); an.fftSize=1024; rec.an=an; src.connect(an);
      rec.buf=new Uint8Array(an.fftSize);
    }
  }catch(e){}
  const level=()=>{
    if(!rec.an||!rec.buf)return 0;
    try{
      rec.an.getByteTimeDomainData(rec.buf);
      let s=0;for(let i=0;i<rec.buf.length;i++){const v=(rec.buf[i]-128)/128;s+=v*v}
      return Math.sqrt(s/rec.buf.length);
    }catch(e){return 0}
  };
  rec.tick=setInterval(()=>{
    if(rec.stopped)return;
    rec.cap-=200;
    if(level()>0.02){rec.heard=true;rec.left=RP_WINDOW*1000}   /* still talking */
    else rec.left-=200;
    paint();
    if(rec.left<=0||rec.cap<=0)rpFinish(true);
  },200);
  /* No AudioContext (older WebView) means no level to watch — treat the whole
     turn as speech and let the countdown or your tap end it. */
  if(!rec.an)rec.heard=true;
};
async function rpUserTurn(text){
  if(!rpConv||!text)return;
  rpConv.busy=true; rpConv.nudges=0; rpAddBubble("me",text); rpConv.history.push({role:"user",content:text});
  const st=document.getElementById("rpStatus"); if(st)st.textContent=t("rp.thinking");
  try{
    const res=await rpAI();
    rpConv.history.push({role:"assistant",content:res.reply});
    rpAddBubble("ai",res.reply); rpVoice(res.reply);
    (res.covered||[]).forEach(n=>{if(n>=1&&n<=rpConv.sc.points.length)rpConv.covered.add(n)});
    rpUpdatePoints();
    if(st)st.textContent=t("rp.tap_to_speak");
    if(rpConv.covered.size>=rpConv.sc.points.length)setTimeout(()=>{if(rpConv)toast(t("rp.all_done"))},500);
  }catch(e){rpAddBubble("ai",t("rp.err")+(e&&e.message?" ("+e.message+")":"")); if(st)st.textContent=t("rp.tap_to_speak");}
  if(rpConv)rpConv.busy=false; rpResetIdle();
}
async function rpAI(){
  /* Runs through the Cloudflare Worker, which holds the API key. It used to
     call the provider straight from the browser with a key each user pasted in
     themselves — unshippable, and the reason this whole feature stayed hidden. */
  const sc=rpConv.sc;
  const sys=`You are ${sc.persona}, a ${sc.role}. Setting: ${sc.scenario}

YOUR ROLE: You speak ONLY as ${sc.persona}. The other person in this conversation is the learner — never write their lines, never answer on their behalf, and never repeat their position back as if it were yours. If they make a request or state a number, you RESPOND to it as ${sc.persona} would.

STYLE: Stay fully in character, warm and natural. The learner is practising spoken English at roughly an intermediate level, so keep every reply to one or two short sentences, use everyday words, and keep things moving with a question or prompt. Never say you are an AI.

THEIR GOALS (things the LEARNER is trying to say during this conversation):
${sc.points.map((p,i)=>`${i+1}) ${p}`).join("\n")}
Steer the conversation so they get a natural chance at each one.

Reply with JSON only:
{"reply":"<what ${sc.persona} says next>","covered":[<1-based numbers of the goals the LEARNER has already accomplished in their OWN messages so far; judge generously — if they attempted it, count it>]}`;
  if(!POLISH_API)throw new Error("offline");
  const r=await fetch(POLISH_API,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({chat:{system:sys,messages:rpConv.history}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error)throw new Error(j.error==="rate_limited"?t("rp.err_busy"):(j.detail||j.error||("HTTP "+r.status)));

}
function rpUpdatePoints(){if(!rpConv)return;rpConv.sc.points.forEach((p,i)=>{const el=document.getElementById("rpp"+i);if(el)el.classList.toggle("done",rpConv.covered.has(i+1))});const pr=document.getElementById("rpProg");if(pr)pr.textContent=rpConv.covered.size+"/"+rpConv.sc.points.length;}
