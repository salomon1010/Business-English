<script>
/* ===== ANALYTICS =====
   Product analytics, provider-agnostic. Nothing is loaded and no request is made
   while ID is "" — track() is a silent no-op, so every call site is safe to leave
   in place.

   >>> TO SWITCH ON: paste the Cloudflare Web Analytics token into ID below. <<<
   Get it at Cloudflare dashboard → Analytics & Logs → Web Analytics → add
   app.lomonec.com → copy the token out of the snippet it shows you. Nothing else
   to change. It is cookie-less and collects no personal data, so no consent
   banner is needed; adding a line to privacy.html naming Cloudflare is good
   practice but not legally required.

   SPLIT IN TWO, 2026-08-02. Cloudflare Web Analytics counts page views,
   referrers and Core Web Vitals, and has NO custom-event API — so it keeps the
   page-view job and the track() calls (share / invite / rate / practice_day …)
   go to our OWN Worker instead: backend/events, writing to Cloudflare Analytics
   Engine. No third-party vendor, no cookies, no fee. See EVENTS_API below.

   The hosted alternatives remain wired if that is ever preferred, but note they
   REPLACE track(), so events would then go to them and not to our Worker:
     PROVIDER="plausible"; ID="app.lomonec.com"      // cookie-less, events, paid
     PROVIDER="ga4";       ID="G-XXXXXXXXXX"         // free, events, BUT sets
     cookies — turning it on means updating privacy.html and adding an EU consent
     notice first. Do not enable GA4 without that.

   Only counts of anonymous events are ever sent. No recordings, no transcripts,
   no phrase text, no profile fields — keep it that way when adding events. */
(function(){
  var PROVIDER="cfweb", ID="b0f913bb28934a39a031535e62b883f9";   // Cloudflare Web Analytics beacon token (public by design)
  window.track=function(){};                       // no-op until a provider is configured

  /* ---- Custom events: our own Worker, independent of PROVIDER above ----
     Cloudflare's beacon covers page views and referrers but has no event API,
     so events go to backend/events (Analytics Engine) instead. The two are
     deliberately separate: page views keep working whatever happens here, and
     nothing about events depends on a third-party analytics vendor.

     sendBeacon, not fetch: it survives the page being closed, which is exactly
     when "install" and "share" fire. It also cannot set a JSON content type
     without a CORS preflight it is not permitted to make — hence text/plain,
     parsed server-side. Don't change that without reading the Worker comment. */
  var EVENTS_API="https://be-events.nore-ngou.workers.dev/e";
  if(EVENTS_API)window.track=function(name,props){
    try{
      var body=JSON.stringify({name:name,props:props||null});
      if(navigator.sendBeacon)navigator.sendBeacon(EVENTS_API,new Blob([body],{type:"text/plain"}));
      else fetch(EVENTS_API,{method:"POST",body:body,keepalive:true}).catch(function(){});
    }catch(e){}                                    // analytics must never break the app
  };

  if(!PROVIDER||!ID)return;
  var s=document.createElement("script");
  if(PROVIDER==="cfweb"){
    /* Cloudflare's beacon reports page views by itself. track() is NOT wired to
       it — see the events block above. */
    s.type="module";   // Cloudflare now ships beacon.min.js as a module; modules defer by default
    s.src="https://static.cloudflareinsights.com/beacon.min.js";
    s.setAttribute("data-cf-beacon",JSON.stringify({token:ID}));
  }else if(PROVIDER==="plausible"){
    s.defer=true; s.setAttribute("data-domain",ID);
    s.src="https://plausible.io/js/script.js";
    window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)};
    window.track=function(name,props){try{window.plausible(name,props?{props:props}:undefined)}catch(e){}};
  }else if(PROVIDER==="ga4"){
    s.async=true; s.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(ID);
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){window.dataLayer.push(arguments)};
    window.gtag("js",new Date()); window.gtag("config",ID);
    window.track=function(name,props){try{window.gtag("event",name,props||{})}catch(e){}};
  }else return;
  document.head.appendChild(s);
})();
</script>

<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1526; --card:#141b30; --card2:#1a2340;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#e8ecf8; --mut:#98a1b7; --mut2:#5c6580;
  --acc:#6366f1; --acc2:#22d3ee; --gold:#fbbf24; --green:#34d399; --red:#f87171; --pink:#f472b6;
  --grad:linear-gradient(135deg,#6366f1,#22d3ee);
  --r:16px;
  --nav-bg:rgba(10,14,26,.82); --bnav-bg:rgba(15,21,38,.97); --scroll:#2a3352;
  --hover:rgba(255,255,255,.05);
  --wash1:rgba(99,102,241,.18); --wash2:rgba(34,211,238,.08);
  /* Design-system tokens (rolled out screen-by-screen). Elevation is tinted to
     the surface, never a coloured glow; role aliases let markup name intent. */
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 20px rgba(0,0,0,.35); --sh-3:0 16px 44px rgba(0,0,0,.45);
  --r-md:14px; --r-lg:16px;
  --accent:var(--acc); --focus:var(--acc2); --on-accent:#fff;
  /* A brand fill that carries text. --grad's cyan end is too light for white
     (~1.8:1), so anything with a label on it uses this instead. */
  --accent-fill:color-mix(in srgb,var(--acc) 90%,#000);
  /* The mirror of --accent-fill: accent used AS text on a dark surface. Raw
     --acc (#6366f1) on the bottom-nav bar measures 4.08:1, under AA. This is
     lightened instead of darkened, because here the accent is the foreground. */
  --accent-text:#818cf8;
}
:root[data-theme="light"]{
  --bg:#f5f7fc; --bg2:#ffffff; --card:#ffffff; --card2:#eef2fb;
  --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.16);
  --txt:#0f172a; --mut:#586179; --mut2:#98a1b8;
  --acc:#4f46e5; --acc2:#0a5568; --gold:#8f4308; --green:#046a4e; --red:#c01c1c; --pink:#a8156a;
  --grad:linear-gradient(135deg,#6366f1,#22d3ee);
  --nav-bg:rgba(255,255,255,.85); --bnav-bg:rgba(255,255,255,.97); --scroll:#c3cce0;
  --hover:rgba(15,23,42,.05);
  --wash1:rgba(99,102,241,.10); --wash2:rgba(34,211,238,.06);
  --sh-1:0 1px 2px rgba(15,23,42,.06); --sh-2:0 6px 20px rgba(15,23,42,.08); --sh-3:0 16px 40px rgba(15,23,42,.12);
  /* On a light surface the accent is already the darker of the two, so accent
     text needs no lightening — it is --acc itself. */
  --accent-text:var(--acc);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Outfit',sans-serif;min-height:100vh}
/* The background wash is sized to the VIEWPORT, not the document. Painted on
   <body> it stretched with the page, so a long list (Business idioms) blew the
   ellipses up and washed the whole screen lighter. A fixed layer behind the
   content keeps every page the same shade. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,var(--wash1),transparent),
  radial-gradient(ellipse 60% 40% at 90% 110%,var(--wash2),transparent)}
a{color:var(--acc2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
/* min-height keeps every text control at the 44px floor. Without it they were
   38-40px wherever the mobile font-size bump did not apply. */
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:14px;width:100%;min-height:44px}
input[type=checkbox],input[type=radio]{min-height:0;width:auto}
/* Auto-sizing textarea (clip transcript). Grows with its content up to 60vh,
   then scrolls; still draggable on platforms that support the resize handle. */
textarea.grow-ta{resize:vertical;min-height:96px;max-height:60vh;line-height:1.55;overflow-y:hidden}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* NAV */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:var(--nav-bg);border-bottom:1px solid var(--line);padding:0 20px}
.nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:6px;height:62px;overflow-x:auto}
.brand{font-weight:800;font-size:17px;white-space:nowrap;margin-right:14px;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:12px;padding:2px 6px 2px 2px;transition:.15s}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}
.brand-name{white-space:nowrap}
.brand-home{font-size:11.5px;font-weight:700;color:var(--acc2);letter-spacing:.3px}
.brand:hover .brand-home{color:var(--acc)}
.brand:hover{background:var(--hover)}
.brand.on .logo{box-shadow:0 0 0 2px var(--acc),0 0 14px rgba(99,102,241,.5)}
.brand .logo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:23px}
.brand span.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tab{position:relative;border:none;background:transparent;color:var(--mut);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap;transition:.2s;display:inline-flex;align-items:center;gap:6px}
/* NAV BADGE — green count of work waiting in that tab. Sits on the icon,
   the convention people already know from Messages/Mail. */
.nav-badge{position:absolute;min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--green);color:#04231a;font-size:10.5px;font-weight:800;line-height:1;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;pointer-events:none;
  animation:badge-pop .28s cubic-bezier(.2,.9,.3,1.4)}
/* --green flips lightness between themes (light mint in dark, deep green in
   light), so a fixed near-black label reads 2.52:1 on the light build. Same
   trap as .pcal-wd.on — the label colour has to follow the theme. */
:root[data-theme="light"] .nav-badge{color:#fff}
.tab .nav-badge{top:2px;right:6px}
.bnav-item .nav-badge{top:3px;left:50%;margin-left:4px;box-shadow:0 0 0 2px var(--bnav-bg)}
@keyframes badge-pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.tab-ic{display:inline-flex;line-height:0}
.tab-ic svg{width:17px;height:17px}
.tab:hover{color:var(--txt);background:var(--hover)}
.tab.on{color:var(--on-accent);background:var(--accent-fill);font-weight:600}
.streak-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--gold);padding:6px 13px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
/* Global practice countdown — lives in the header, visible on every page while running */
.hdr-timer{margin-left:auto;display:none;align-items:center;gap:7px;background:linear-gradient(150deg,rgba(99,102,241,.18),rgba(34,211,238,.14));border:1px solid rgba(99,102,241,.5);color:var(--txt);padding:5px 6px 5px 11px;border-radius:99px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 0 0 0 rgba(99,102,241,.35);transition:box-shadow .2s,transform .15s}
.hdr-timer.show{display:flex}
.hdr-timer:hover{transform:translateY(-1px)}
.hdr-timer .ht-ic{display:inline-flex;line-height:0;color:var(--acc)}
.hdr-timer .ht-ic svg{width:15px;height:15px}
.hdr-timer .ht-dig{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:1px;min-width:46px;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-timer .ht-x{width:20px;height:20px;border-radius:50%;background:rgba(148,163,184,.2);color:var(--txt);font-size:15px;line-height:1;display:grid;place-items:center;transition:.15s}
.hdr-timer .ht-x:hover{background:var(--red);color:#fff;transform:scale(1.1)}
.hdr-timer.running{animation:htGlow 2.4s ease-in-out infinite}
.hdr-timer.running .ht-ic{animation:htPulse 1.6s ease-in-out infinite}
@keyframes htGlow{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.28)}50%{box-shadow:0 0 16px 2px rgba(34,211,238,.4)}}
@keyframes htPulse{0%,100%{opacity:1}50%{opacity:.4}}
.theme-seg{display:flex;gap:8px}
/* SETTINGS — every field label is a real <label for>, so a screen reader
   announces the control it belongs to. They used to be plain <p> text. */
.set-avatar{width:64px;height:64px;border-radius:20px;background:var(--accent-fill);display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--on-accent);flex:none}
.set-lbl{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px;cursor:pointer}
.set-h{font-size:13.5px;font-weight:800;margin:18px 0 6px}
.set-card-h{font-size:16px;font-weight:800}
.set-card-sub{font-size:12.5px;color:var(--mut);line-height:1.5}
.set-hint{font-size:11.5px;color:var(--mut);margin:6px 0 0;line-height:1.5}
.set-act{min-height:44px}
.set-save{margin-top:18px}
.set-plan{margin:0 0 16px}
/* the reminder switch was an 18px checkbox in an 18px row */
.rem-row{min-height:44px}
.rem-box input[type=time]{min-height:44px}
#v-setup a{min-height:44px;display:inline-flex;align-items:center}
/* min-height belongs on the component, not on "#v-setup .theme-opt": rSetup
   renders this same markup into #v-data when Settings is reached from Profile,
   where a #v-setup-scoped rule does not match and the control stayed at 42px. */
.theme-opt{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px;min-height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.theme-opt:hover{border-color:var(--acc)}
.theme-opt svg{width:17px;height:17px}
.theme-opt.on{background:var(--accent-fill);border-color:transparent;color:var(--on-accent)}
.streak-pill .pill-ic{display:inline-flex;line-height:0}
.streak-pill .pill-ic svg{width:16px;height:16px}

main{max-width:1180px;margin:0 auto;padding:30px 20px 90px}
.view{display:none;animation:fade .35s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* GENERIC */
.eyebrow{font-size:clamp(10.5px,2.9vw,12px);letter-spacing:clamp(1.4px,.5vw,2.5px);text-transform:uppercase;color:var(--acc2);font-weight:700;margin-bottom:8px}
/* PAGE EYEBROW — the "where am I" label. Sticks under the top bar while the
   page scrolls, so the section name is always on screen. Spans the full width
   (negative margins undo main's padding) and blurs the content behind it. */
.pg-eyebrow{position:sticky;top:62px;z-index:40;
  margin:-30px -20px 8px;padding:11px 20px 10px;
  background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);line-height:1.35}
@media(max-width:820px){
  .pg-eyebrow{font-size:11px;letter-spacing:1.8px;padding:10px 20px 9px}
}
/* App Setup, parked on the sticky Profile eyebrow so it never scrolls away.
   Absolute rather than flex so the row keeps its exact height. */
/* .seg-fit — a short tab row that must ALWAYS stay on a single line at every
   width. The tabs split the width evenly; inside a tab the label itself never
   breaks — only the trailing number/count is allowed to drop to a second line
   when the tab gets too narrow. */
.seg-fit{flex-wrap:nowrap;overflow-x:visible}
.seg-fit .seg-tab{flex:1 1 0;min-width:0;flex-wrap:wrap;justify-content:center;
  text-align:center;row-gap:1px;line-height:1.25}
.seg-fit .seg-tab .seg-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg-fit .seg-tab b{white-space:nowrap}
/* sub-page variant: the back link travels with the title, so you can leave
   the page from anywhere down its length */
.pg-sub{display:flex;align-items:center;gap:12px}
.pg-sub .back{margin:0;flex:none;font-size:13px;letter-spacing:0;text-transform:none}
/* Help & Guide closes with the same control as every other in-app document, so
   "close" looks identical wherever the user meets it. Sits in the sticky
   eyebrow, so it cannot scroll away. */
.man-x{flex:none;width:44px;height:44px;min-height:44px;margin-left:-10px;padding:0;
  display:grid;place-items:center;border:none;background:none;color:var(--acc2);cursor:pointer;border-radius:50%}
.man-x:hover{background:var(--hover)}
.man-x:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.man-x svg{width:22px;height:22px}
.pg-sub>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Fluid display type: scales smoothly with the screen instead of jumping at
   breakpoints. Lower floor than before so it doesn't dominate a small phone. */
h1.big{font-size:clamp(23px,5.4vw,40px);font-weight:800;line-height:1.15;margin-bottom:10px;letter-spacing:-.4px}
/* was gradient-clipped text — 1.69:1 in light. One accent, and it passes. */
h1.big em{font-style:italic;color:var(--accent)}
.sub{color:var(--mut);font-size:clamp(13.5px,3.6vw,15.5px);max-width:720px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}}
/* The 44px floor and the focus ring live on the BASE, not on per-screen
   descendant rules. They used to be scoped (#v-shadow .btn, #fbOut .btn,
   #v-setup a …), which meant every surface the audit never rendered — modals,
   the practice viewers, the language sheet, and the same Settings markup when
   it renders into #v-data instead of #v-setup — kept a ~42px control with no
   visible focus. One rule here covers all of them. */
.btn{border:none;border-radius:12px;padding:11px 20px;font-weight:600;font-size:14.5px;transition:.2s;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.btn>svg{width:18px;height:18px;flex:none}
.btn-p{background:var(--accent-fill);color:var(--on-accent)}.btn-p:hover{filter:brightness(1.15);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn-p:hover{transform:none}}
.btn-g{background:var(--card2);color:var(--txt);border:1px solid var(--line2)}.btn-g:hover{border-color:var(--acc)}
/* Actions that belong together share one line instead of wrapping into a
   ragged stack. The children shrink rather than overflow, and long labels wrap
   inside their own button, so the ROW never breaks. Replaces three separate
   inline "display:flex;flex-wrap:wrap" rows that all wrapped at 390px. */
.btn-row{display:flex;gap:8px;flex-wrap:nowrap;align-items:stretch}
.btn-row>*{flex:1 1 0;min-width:0;justify-content:center;text-align:center;
  white-space:normal;line-height:1.25;font-size:clamp(12.5px,3.4vw,14.5px)}
.btn-row>*>svg,.btn-row>*>.btn-ic{flex:none}
/* Recommended-next-step CTA. Not destructive — --gold is the app's highlight,
   the same token the streak flame uses. --gold inverts lightness between
   themes (#fbbf24 dark, #8f4308 light), so the label colour must follow the
   theme; a fixed label is the trap documented in DESIGN_SYSTEM. */
.btn-gold{background:var(--gold);color:#241a03;font-weight:700}
:root[data-theme="light"] .btn-gold{color:#fff}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.btn-gold:hover{transform:none}}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--mut)}
.chip.p1{color:#a5b4fc;border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.1)}
.chip.p2{color:#67e8f9;border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.chip.p3{color:#fcd34d;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.chip.done{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
/* Light theme: the pastel chip text is unreadable on white — deepen it and firm up the tint */
:root[data-theme="light"] .chip.p1{color:#4338ca;background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.35)}
:root[data-theme="light"] .chip.p2{color:#0e7490;background:rgba(34,211,238,.15);border-color:rgba(14,116,144,.35)}
:root[data-theme="light"] .chip.p3{color:var(--gold);background:rgba(251,191,36,.2);border-color:rgba(180,83,9,.4)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.hr{border:none;border-top:1px solid var(--line);margin:18px 0}

/* DASHBOARD */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-bottom:22px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.ring-wrap{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:800;line-height:1.1}
.ring .pct small{display:block;font-size:11px;color:var(--mut);font-weight:500;text-align:center}
/* Metric tiles are borderless and share one grouped panel (.home-dash), so the
   dashboard reads as a single calm surface of numbers rather than nine boxes. */
.stat{background:transparent;border:none;border-radius:var(--r-md);padding:13px 14px;transition:.16s;
  display:flex;flex-direction:column;justify-content:center;min-height:78px}
.stat[role=button]:hover{background:var(--hover)}
.stat[role=button]:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* A metric still at zero recedes instead of arguing: the panel is for what has
   been earned, and the one next step is stated once below it (.home-step). */
.stat-empty{opacity:.55}
.stat-empty:hover{opacity:1}
.stat .n{font-size:clamp(21px,5.4vw,28px);font-weight:800;display:flex;align-items:center;gap:7px}
.stat .l{font-size:clamp(11.5px,3vw,12.5px);color:var(--mut);margin-top:3px}
.stat-ic{color:var(--acc);flex:none;line-height:0}
.stats-center .stat{text-align:center}
.stats-center .stat .n{justify-content:center}
/* Progress calendar */
.pcal{margin:18px auto;padding:18px 16px;max-width:560px}
.pcal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pcal-title{font-size:16px;font-weight:800}
.pcal-nav{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);cursor:pointer;font-size:19px;line-height:1;display:grid;place-items:center;transition:.12s}
.pcal-nav:hover{border-color:var(--acc);color:var(--acc)}
.pcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pcal-dow{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding-bottom:4px}
/* aspect-ratio:1 gave 40px cells at 390px — below the 44px floor, on the
   most-tapped grid in the app. A min-height keeps them square where there is
   room and square-ish, but reachable, where there is not. */
.pcal-day{position:relative;aspect-ratio:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;display:grid;place-items:center;transition:transform .12s,border-color .12s;padding:0}
.pcal-day.blank{background:transparent;border:none;cursor:default}
.pcal-day[data-lvl="1"]{background:rgba(52,211,153,.22)}
.pcal-day[data-lvl="2"]{background:rgba(52,211,153,.42)}
.pcal-day[data-lvl="3"]{background:rgba(52,211,153,.64)}
.pcal-day[data-lvl="4"]{background:rgba(52,211,153,.88);color:#04231a}
.pcal-day.today{outline:2px solid var(--acc2);outline-offset:1px}
.pcal-day .chk{position:absolute;top:1px;right:4px;font-size:9px;color:#04231a;font-weight:900}
.pcal-day[data-lvl="1"] .chk,.pcal-day[data-lvl="2"] .chk{color:var(--txt)}
.pcal-day:not(.blank):hover{transform:translateY(-2px);border-color:var(--acc)}
.pcal-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:11px;color:var(--mut);margin-top:12px}
.pcal-legend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.pcal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.pcal-stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center}
.pcal-stat b{display:block;font-size:21px;font-weight:800;line-height:1}
.pcal-stat span{font-size:10.5px;color:var(--mut);display:block;margin-top:4px}
.pcal-msg{text-align:center;font-size:13px;color:var(--acc2);margin-top:14px;font-weight:600}
.pcal-eyebrow{font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc2);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.pcal-eyebrow svg{width:16px;height:16px}
.pcal-day.fut{opacity:.38}
.pcal-week{display:flex;align-items:center;gap:16px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.pcal-week-days{display:flex;gap:6px}
.pcal-wd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line2);color:var(--mut)}
.pcal-wd.on{background:var(--green);color:#04231a;border-color:transparent}
:root[data-theme="light"] .pcal-wd.on{color:#fff}
.pcal-wd.today{outline:2px solid var(--acc2);outline-offset:1px}
.pcal-wd.fut{opacity:.4}
.pcal-week-lbl{font-size:12.5px;color:var(--mut);line-height:1.4}
.pcal-week-lbl b{color:var(--txt);font-size:17px}
.pcal-week-lbl small{color:var(--mut)}
.pcal-detail{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px;font-size:13px;transition:background .3s}
.pcal-detail>b{display:block;font-size:13.5px;margin-bottom:7px}
.pcal-detail.flash{background:rgba(34,211,238,.13)}
.cal-d-rows{display:flex;flex-direction:column;gap:6px;color:var(--mut)}
.cal-d-rows span{display:flex;align-items:center;gap:8px}
.cal-d-rows span svg{width:15px;height:15px;flex:none;color:var(--acc2)}
.cal-d-empty{color:var(--mut)}
.pcal-year-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:800;margin:20px 0 8px}
.pcal-year-h span{font-size:11.5px;color:var(--mut);font-weight:600}
.pcal-year{display:flex;flex-direction:column;gap:4px;overflow-x:auto;padding-bottom:6px}
.cal-ymonths{display:flex;gap:3px;height:12px}
.cal-ymo{width:11px;flex:none;font-size:9px;font-weight:600;color:var(--mut);white-space:nowrap;line-height:1;overflow:visible}
.cal-ygrid{display:flex;gap:3px}
.cal-ycol{display:flex;flex-direction:column;gap:3px;flex:none}
.cal-ysq{width:11px;height:11px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.cal-ysq[data-lvl="-1"]{background:transparent;border-color:transparent}
.cal-ysq[data-lvl="1"]{background:rgba(52,211,153,.22);border-color:transparent}
.cal-ysq[data-lvl="2"]{background:rgba(52,211,153,.42);border-color:transparent}
.cal-ysq[data-lvl="3"]{background:rgba(52,211,153,.64);border-color:transparent}
.cal-ysq[data-lvl="4"]{background:rgba(52,211,153,.88);border-color:transparent}
.pcal-legend i[data-lvl="0"]{background:var(--card2)}
.pcal-legend i[data-lvl="1"]{background:rgba(52,211,153,.22)}
.pcal-legend i[data-lvl="2"]{background:rgba(52,211,153,.42)}
.pcal-legend i[data-lvl="3"]{background:rgba(52,211,153,.64)}
.pcal-legend i[data-lvl="4"]{background:rgba(52,211,153,.88)}
/* Shadowing workspace — focused full-screen practice window */
.sh-work{position:fixed;top:0;left:0;right:0;bottom:0;z-index:130;background:var(--bg);display:none;flex-direction:column;animation:fade .2s}
.sh-hint{display:flex;gap:9px;align-items:flex-start;margin-top:10px;padding:10px 14px;background:linear-gradient(150deg,rgba(99,102,241,.11),rgba(34,211,238,.07));border:1px solid rgba(99,102,241,.3);border-radius:11px;font-size:13px;line-height:1.5;color:var(--mut)}
.sh-hint b{color:var(--txt)}
.sh-hint .sh-hint-ic{flex:none;color:var(--acc);display:inline-flex;line-height:0;margin-top:1px}
.sh-hint .sh-hint-ic svg{width:17px;height:17px}
.sh-work-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line2);background:var(--card);flex:none}
.sh-work-title{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:0}
.sh-work-title::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc2);flex:none}
.sh-work-x{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line2);background:var(--card2);color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:.12s}
.sh-work-x:hover{border-color:var(--acc);color:var(--acc)}
.sh-work-x svg{width:20px;height:20px}
.sh-work-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;max-width:1000px;width:100%;margin:0 auto}
.sh-work-x:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* the overlay's entrance fade is ours to suppress, not the browser's */
/* the picker must not scroll underneath the overlay */
body.sh-work-open{overflow:hidden}

/* Every control in the studio is a 44px target. The workspace shipped eight
   under that (34-38px) and the picker forty-five of forty-seven. Scoped to this
   screen: .btn-sm has 98 uses across screens not yet passed. */
#v-shadow .btn-sm,.sh-work .btn-sm,#v-shadow .btn,.sh-work .btn{min-height:44px}
/* the "best channels" row is links, not decoration — .chip is 32px app-wide */
#v-shadow a.chip{min-height:44px}
#v-shadow a.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sh-seg .btn{min-height:44px;padding:8px 11px}
.sh-work-x{width:44px;height:44px}

/* Starter clips: one card shape instead of six inline styles apiece. */
.sh-starter{background:var(--bg2);padding:16px;display:flex;flex-direction:column;gap:8px}
.sh-starter img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-md);background:var(--card2)}
.sh-starter b{font-size:14px;line-height:1.35}
.sh-starter p{font-size:12.5px;color:var(--mut);flex:1;line-height:1.5}
.sh-starter-cap{align-self:flex-start;font-size:11px}
.sh-starter-acts{display:flex;gap:8px}
/* :not() so the icon-only copy button is not stretched by the same rule that
   makes "Shadow this" fill the row */
.sh-starter-acts>.btn:not(.sh-starter-copy){flex:1;justify-content:center}
.sh-starter-copy{flex:0 0 44px;width:44px;padding:0;justify-content:center}
.sh-starter-copy svg{width:19px;height:19px}
/* Error state for a clip that cannot play (removed, private, embedding off). */
.sh-viderr{display:flex;align-items:flex-start;gap:13px;flex-wrap:wrap;margin-top:14px;padding:14px 16px;
  background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 34%,transparent);
  border-radius:var(--r-lg)}
.sh-viderr-ic{flex:none;color:var(--red);line-height:0}
.sh-viderr-ic svg{width:22px;height:22px}
.sh-viderr-t{flex:1 1 220px;min-width:0}
.sh-viderr-t b{display:block;font-size:15px;margin-bottom:3px}
.sh-viderr-t small{font-size:12.5px;color:var(--mut);line-height:1.5;display:block}
.sh-viderr .btn{flex:none}
/* white on YouTube red is 4.0:1 — at 19px/700 the AA threshold is 3:1 */
.sh-yt{background:#f00;color:#fff;font-weight:700;text-decoration:none;font-size:19px}
.sh-more{margin:16px 0 0}
.sh-resume{margin-top:12px}
.sh-resume-t{font-weight:600;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sh-clear{color:var(--red);border-color:rgba(239,68,68,.35)!important;padding:7px 10px}
.sh-clear:hover{background:rgba(239,68,68,.12);border-color:var(--red)!important;color:var(--red)}
.sh-clear svg{width:16px;height:16px;display:block}
.sess-ex summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
.sess-ex summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-md)}
.sess-ex summary::-webkit-details-marker{display:none}
.sess-ex .sess-ex-title{font-weight:700;font-size:15px}
.sess-ex summary::after{content:"▾";margin-left:auto;color:var(--acc);font-size:22px;line-height:1;transition:transform .2s}
.sess-ex[open] summary::after{transform:rotate(180deg)}
.stat-ic svg{width:23px;height:23px}
.head-ic{color:var(--acc);display:inline-flex;vertical-align:-3px;margin-right:8px;line-height:0}
.head-ic svg{width:20px;height:20px}
.rule-ic{color:var(--acc);line-height:0}
.rule-ic svg{width:24px;height:24px}
/* PROFILE tab */
.pf-hero{position:relative;text-align:center;padding:16px 0 4px}
.pf-av{width:88px;height:88px;border-radius:28px;background:var(--accent-fill);display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--on-accent);margin:0 auto 14px;box-shadow:0 14px 40px rgba(99,102,241,.35)}
.pf-name{font-size:26px;font-weight:800;margin-bottom:4px}
.pf-sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.pf-streak{display:inline-flex;align-items:center;gap:7px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);color:var(--gold);border-radius:99px;padding:7px 16px;font-size:14px;font-weight:600}
.pf-streak svg{width:18px;height:18px}
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px auto;max-width:560px}
.pf-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px 16px;color:var(--txt);cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:.15s}
.pf-row:hover{border-color:var(--acc);transform:translateY(-1px)}
.pf-ic{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--acc);flex:none}
.pf-ic svg{width:22px;height:22px}
.pf-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pf-txt b{font-size:15px}
.pf-txt small{color:var(--mut);font-weight:500;font-size:12.5px}
.pf-chev{margin-left:auto;color:var(--mut);font-size:22px;flex:none}
.pf-row{min-height:64px}
.pf-row:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pf-setup{margin:0 auto 16px;max-width:560px}
.pf-card-h{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.pf-act{min-height:44px}
/* --mut2 measures ~2.9:1 on --card — see DESIGN_SYSTEM 1 */
.pf-note{font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.5}
/* The day's session is the one thing Home exists to start, so it is the most
   elevated surface on the screen and the only one carrying a solid accent
   button. The card itself is now plain --card: the wash competed with the
   button for the eye, and only one of the two is actually actionable. */
.today-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-2)}
.today-card h1,.today-card h2{font-size:clamp(20px,5.2vw,25px);font-weight:800;line-height:1.22;letter-spacing:-.3px;margin:6px 0 5px}

/* PRIMARY ACTION — the one solid-accent button per screen. Everything else is
   secondary by construction. No infinite animation: motion here confirms a
   press, it does not decorate. */
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;padding:14px 18px;border:none;border-radius:var(--r-md);
  /* Deepened a notch from --accent so white text clears 4.5:1 in BOTH themes.
     Raw --acc in dark (#6366f1) measures 4.47:1 — a hair under AA. */
  background:var(--accent-fill);color:var(--on-accent);font-family:inherit;
  font-size:clamp(15px,4vw,16.5px);font-weight:700;letter-spacing:-.2px;line-height:1.25;
  cursor:pointer;box-shadow:var(--sh-2);
  transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .12s,filter .12s}
.btn-primary:hover{filter:brightness(1.08);box-shadow:var(--sh-3)}
.btn-primary:active{transform:scale(.985);box-shadow:var(--sh-1)}
.btn-primary:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn-primary{transition:none}.btn-primary:active{transform:none}}

/* JOURNEY */
.wk-card{cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.wk-card:hover{transform:translateY(-3px);border-color:var(--acc)}
.wk-card .num{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:1px}
.wk-card h3{font-size:16.5px;margin:7px 0 9px;line-height:1.35}
.wk-card.locked{opacity:.55}
.dots{display:flex;gap:5px;margin-top:12px}
.dot{width:22px;height:22px;border-radius:7px;background:var(--bg2);border:1px solid var(--line2);display:grid;place-items:center;font-size:10px;color:var(--mut);font-weight:700}
.dot.done{background:var(--accent-fill);border:none;color:var(--on-accent)}

/* WEEK DETAIL / DAYS */
.day-row-go{color:var(--mut);font-size:18px;flex:none}
.sh-range-go{color:var(--mut);flex:none}
.day-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;cursor:pointer;transition:.2s}
.day-row:hover{border-color:var(--acc);transform:translateX(3px)}
.day-row .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--bg2);color:var(--acc)}
.day-row .ic svg{width:22px;height:22px}
.inl-ic{display:inline-flex;vertical-align:-2px;margin-right:5px;color:var(--acc);line-height:0}
.inl-ic svg{width:15px;height:15px}
.btn-ic{display:inline-flex;vertical-align:-3px;margin-right:5px;line-height:0}
.btn-ic svg{width:15px;height:15px}
.ex-field{position:relative;margin-bottom:10px}
.ex-field-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);line-height:0}
.ex-field-ic svg{width:16px;height:16px}
.ex-field input{padding-left:38px}
/* Your own example sentence. A one-line input hid everything past the first
   few words, so this is a textarea that grows with what you type (and can be
   dragged taller on desktop). The pencil sits on the first line, not centred. */
.ex-field textarea{padding-left:38px;width:100%;display:block}
.ex-field-ta .ex-field-ic{top:15px;transform:none}
textarea.ex-ta{min-height:44px;padding-top:11px;padding-bottom:11px}
/* Desktop: two tidy lines — [ mic · bin ] on top, a full-width Polish button beneath */
/* Every control here was 31px — including "Polish it", the feature's primary
   action. The row now uses full-size controls; the button that starts the work
   spans the row, the mic and clear are 48px squares beside it. */
.ex-btns{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-width:210px}
.ex-btns>.btn,.ex-btns>.btn-primary{min-height:48px;border-radius:var(--r-md)}
/* padding:0 matters: .btn carries 11px/20px padding, which leaves only 8px of
   content box inside a 48px icon-only button. The global svg{max-width:100%}
   then clamped the 19px glyph to ~6px and both buttons rendered as empty
   boxes. Icon-only buttons centre their glyph with grid instead of padding. */
.ex-micbtn{flex:0 0 48px;display:grid;place-items:center;padding:0}
.ex-micbtn svg{width:19px;height:19px}
.ex-icobtn{flex:0 0 48px;display:grid;place-items:center;padding:0}
.ex-icobtn svg{width:18px;height:18px}
.ex-polishbtn{flex:1 1 140px;min-height:48px;font-size:15px}
.ex-polishbtn .btn-ic{margin:0}
.ex-polishbtn svg{width:17px;height:17px}
/* Dictation mic — cycling light ring so it reads as "start here" */
/* The last spinning conic gradient in the app. A dictation button does not need
   perpetual motion to be found; the live state is what actually carries meaning,
   so that keeps its red fill and the idle state is an ordinary control. */
.ex-micbtn{color:var(--txt)}
.ex-micbtn.ex-mic-live{background:var(--red);border-color:transparent;color:#fff}
.ex-micbtn.ex-mic-live svg{color:#fff}
/* Phone: keep all three on ONE line — Polish · mic · bin (40/40/20) */
@media(max-width:520px){.ex-btns{flex-wrap:nowrap;min-width:100%}.ex-polishbtn{flex:2 1 0;order:-1;padding:7px 8px}.ex-micbtn{flex:2 1 0}.ex-icobtn{flex:1 1 0}}
.ex-mic-live{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important;animation:exPulse 1.1s infinite}
@keyframes exPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
/* "listening" is live state, so the pulse is motivated — but the red fill
   already carries the meaning without it. */
.day-row.done .ic{background:rgba(52,211,153,.14)}
.day-row .t{flex:1;min-width:0}
.day-row .t b{display:block;font-size:15px}
.day-row .t span{font-size:13px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Was an 18px-tall text link — the smallest target in the app. Same look, a
   real 44px hit area, pulled left so the label still aligns with the content. */
.back{background:none;border:none;color:var(--acc2);font-size:14px;font-weight:600;
  margin:0 0 6px -10px;padding:0 10px;min-height:44px;cursor:pointer;
  display:inline-flex;gap:6px;align-items:center;border-radius:var(--r-md)}
.back:hover{background:var(--hover)}
.back:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.sess-return{display:flex;width:fit-content;margin:0 0 18px;padding:7px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--card);cursor:pointer}

/* SESSION */
.sess-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
/* Template steps are rows inside one card, not cards inside a card — a bordered
   box nested in a bordered box is banned by the design system, and six of them
   read as six separate objects rather than one plan. */
.step{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);
  align-items:flex-start;cursor:pointer;transition:background .15s;min-height:44px}
.step:last-child{border-bottom:none}
.step:hover{background:var(--hover)}
.step:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:var(--r-md)}
.step.done .tm,.step.done p{opacity:.6;text-decoration:line-through}
.step .cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--mut2);flex:none;display:grid;place-items:center;font-size:13px;color:#fff;margin-top:1px;transition:.15s}
.step.done .cb{background:var(--green);border-color:var(--green);opacity:1}
.step .tm{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--acc2);font-weight:600}
.step p{font-size:14px;line-height:1.5;margin-top:2px}

/* The clock is the hero surface of the session: it is what the whole screen is
   for. Digits were gradient-clipped text, which measured 1.81:1 against the
   light theme — the largest type on the screen failing contrast. Solid --txt,
   and --accent while the block is actually running, which also makes "running"
   a visible state rather than just a changed button label. */
.timer-box{text-align:center;padding:18px;box-shadow:var(--sh-2)}
.timer-digits{font-family:'JetBrains Mono',monospace;font-size:clamp(46px,13vw,56px);
  font-weight:600;letter-spacing:2px;color:var(--txt);line-height:1.1;
  font-variant-numeric:tabular-nums;transition:color .2s}
.timer-box.running .timer-digits{color:var(--accent)}
.timer-box .btn-primary{margin-top:14px}

/* All ten scores stay on one row at every width. Ten 44px buttons plus gaps
   need ~475px, so below that they share the row instead of wrapping: each is
   flex:1 with a 44px height floor, and the gap tightens on narrow screens.
   No wrap, no horizontal scroll. */
.score-row{display:flex;gap:7px;flex-wrap:nowrap;margin-top:10px}
/* 36px was under the 44px minimum, ten times over. */
.score-b{flex:1 1 0;min-width:0;max-width:56px;height:44px;padding:0;
  border-radius:var(--r-md);border:1px solid var(--line2);
  background:var(--bg2);color:var(--mut);font-family:inherit;font-weight:700;font-size:15px;
  cursor:pointer;transition:.14s}
@media(max-width:560px){.score-row{gap:5px}.score-b{font-size:14px;border-radius:11px}}
/* At 320px the card's own 16px padding leaves 246px, which cannot hold ten
   24px targets. Reclaim most of it with a negative margin — the same trick
   .pg-eyebrow uses — so every button still clears the WCAG 2.5.8 floor. */
@media(max-width:360px){.score-row{gap:3px;margin-left:-14px;margin-right:-14px}.score-b{font-size:13px;border-radius:10px}}
.score-b:hover{border-color:var(--accent);color:var(--txt)}
.score-b:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Solid accent, not --grad: white on the gradient's cyan end is ~1.9:1. */
.score-b.on{background:var(--accent-fill);color:var(--on-accent);border-color:transparent}

/* One column, one rhythm. The session used to be a 2-column grid whose right
   column held a tab row; with the tabs gone there is a single ordered flow. */
.sess-body{display:flex;flex-direction:column;gap:16px}
.sess-body>.card,.sess-body>.rec-panel{margin:0}
/* The day's tool (Shadow Studio, Phrase Lab…) — prominent, but secondary to
   starting the block. Was a .glow-cta, which carried an infinite animation and
   competed with the clock for primacy. */
.sess-jump{width:100%;justify-content:flex-start;min-height:48px;padding:12px 16px;border-radius:var(--r-md)}
.sess-jump-go{margin-left:auto;color:var(--acc2);font-size:18px}
.sess-jump-why{font-size:12.5px;color:var(--mut);line-height:1.5;margin:8px 0 18px}
/* Supporting text and the rare Reset sit outside the hero card, so the card
   itself carries only the clock and the one action that starts it. */
.sess-timer-foot{display:flex;align-items:center;gap:12px;margin-top:-6px}   /* pulls back to a 10px gap under its own card */
.sess-timer-hint{flex:1;min-width:0;font-size:12.5px;color:var(--mut);line-height:1.5}
/* Reset is a rare, mildly destructive action, so it is a quiet text control
   rather than a second stacked button competing with Start. */
.sess-reset{background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--mut);cursor:pointer;min-height:44px;padding:0 12px;border-radius:var(--r-md);transition:.14s}
.sess-reset:hover{color:var(--txt);background:var(--hover)}
.sess-reset:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.sess-act,.sess-done{min-height:44px;justify-content:center}
.sess-act{margin-top:10px}
.sess-done{width:100%}
.sess-plan{margin:0}
.sess-plan-sub{font-size:12.5px;color:var(--mut);margin-bottom:4px}
.sess-aloud b{font-size:14px}
.sess-aloud ul{list-style:none;margin-top:8px}
.sess-aloud li{font-size:13.5px;color:var(--mut);padding:3px 0;line-height:1.5}
/* --mut2 on --bg2 measured 3.14:1 dark / 2.58:1 light. */
.sess-heard{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-md);
  padding:10px 14px;font-size:14px;line-height:1.6;min-height:44px;font-style:italic}
.sess-heard-empty{color:var(--mut);font-style:normal;font-size:12.5px}

/* RECORDER */
.rec-panel{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:14px}
.rec-btn{width:56px;height:56px;border-radius:50%;border:none;background:var(--grad);color:#fff;font-size:22px;transition:.2s;box-shadow:0 4px 16px rgba(99,102,241,.38);display:grid;place-items:center}
.rec-btn svg{width:26px;height:26px}
.rec-btn.recording{background:linear-gradient(135deg,#ef4444,#f97316);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 16px rgba(239,68,68,0)}}
/* The recording pulse and the over-length clip warning are live-state signals,
   so they are legitimately perpetual — but they were the only infinite
   animations in the app with no reduced-motion escape. The state stays legible
   without the motion: .recording keeps its red fill, .over keeps its gold ring. */
.rec-none{font-size:12.5px;color:var(--mut);margin-top:12px;line-height:1.5}
.rec-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg2);margin-top:8px;font-size:13px}
.rec-item audio{height:32px;flex:1;min-width:120px}
.rec-time{font-family:'JetBrains Mono',monospace;color:var(--red);font-weight:600;font-size:18px}

/* PHRASES */
.ph-card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px 18px;margin-bottom:10px}
.ph-card.mastered{border-color:rgba(52,211,153,.4)}
/* Every sentence of the week, joined into one speech. Deliberately a different
   colour from the phrase cards — it is the destination, not another exercise. */
.ph-speech{border:1px solid rgba(99,102,241,.42);border-radius:14px;padding:16px 18px;margin:18px 0 10px;
  background:linear-gradient(150deg,var(--wash1),var(--wash2))}
.ph-speech.mastered{border-color:rgba(52,211,153,.55)}
.ph-speech textarea{background:rgba(10,14,26,.35)}
:root[data-theme="light"] .ph-speech textarea{background:rgba(255,255,255,.72)}
.ph-sp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.ph-sp-top b{font-size:15.5px}
.ph-sp-count{font-size:11.5px;color:var(--mut);border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
.ph-sp-sub{font-size:12.5px;color:var(--mut);margin:0 0 10px}
/* The loop that turns a polished sentence into part of your speech. */
.ex-flow ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--mut);line-height:1.65}
.ex-flow li{margin-bottom:4px}

/* EXECUTIVE POLISH results — one recommended line, then disclosure. */
.ex-h{font-size:15px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.ex-best{background:color-mix(in srgb,var(--green) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--green) 34%,transparent);
  border-radius:var(--r-lg);padding:16px 18px}
.ex-best-t{font-size:17px;font-weight:600;line-height:1.5;letter-spacing:-.1px}
.ex-why{margin-top:12px;padding-top:11px;border-top:1px solid color-mix(in srgb,var(--green) 26%,transparent)}
.ex-why b{display:block;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);margin-bottom:5px}
.ex-why p{font-size:13px;color:var(--mut);line-height:1.55}
.ex-changes{display:flex;flex-wrap:wrap;gap:6px}
.ex-clean{font-size:13px;color:var(--green);font-weight:600;margin-top:10px}
.ex-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ex-acts>.btn{flex:1 1 auto;min-height:44px;justify-content:center;white-space:nowrap}
/* reuse is the point of a polished line, so Copy is the emphasised action */
.ex-copy{background:color-mix(in srgb,var(--green) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--green) 45%,transparent);color:var(--txt);font-weight:700}
.ex-copy:hover{background:color-mix(in srgb,var(--green) 26%,transparent)}
.ex-alt{padding:2px 0 10px}
.ex-alt+.ex-alt{border-top:1px solid var(--line);padding-top:14px}
.ex-alt-t{font-size:15.5px;font-weight:600;line-height:1.5}
.ex-alt-why{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.ex-sec{margin:12px 0 0}
.ex-frames div{padding:6px 0;font-size:12.5px;color:var(--mut);line-height:1.55}
.ex-frames div+div{border-top:1px solid var(--line)}
.ex-frames b{color:var(--acc2)}
.ex-more-hint{font-size:12.5px;color:var(--mut);margin-top:12px;line-height:1.5}
.ex-note{font-size:12.5px;color:var(--gold);margin-bottom:10px;line-height:1.5}
.ex-status{font-size:12.5px;color:var(--mut)}
.ex-aiprompt{min-height:44px;margin-top:12px}
.ph-mastered{background:var(--green);border:1px solid transparent;color:#04231a;font-weight:800}
.ph-mastered:hover{filter:brightness(1.06)}
.ph-mastered .btn-ic{color:#04231a}
.ph-icobtn{padding:8px 12px;display:inline-grid;place-items:center;min-width:44px;min-height:44px}
.ph-icobtn svg{width:18px;height:18px;display:block}
.ph-card .phrase{font-size:16.5px;font-weight:600;margin-bottom:4px}
.ph-card .use{font-size:13px;color:var(--mut);margin-bottom:10px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.idiom-tag{font-size:11px;font-weight:700;color:var(--pink);letter-spacing:1px}
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.cat-tab{border:1px solid var(--line2);background:var(--card);color:var(--mut);padding:7px 14px;border-radius:99px;font-size:clamp(12px,3.2vw,13px);font-weight:600;min-height:44px;display:inline-flex;align-items:center;cursor:pointer}
.cat-tab.on{background:var(--accent-fill);color:var(--on-accent);border-color:transparent}

/* SHADOW (YouGlish-style clip looper) */
.yt-shell{background:#000;border:2px solid #000;border-radius:18px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.45)}
.yt-ratio{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.yt-ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sh-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.sh-pill{display:flex;gap:2px;background:#000;border-radius:16px;padding:6px}
.sh-pill button{min-width:52px;height:44px;border:none;background:transparent;color:#fff;font-size:19px;border-radius:12px;transition:.15s}
.sh-pill button:hover{background:rgba(255,255,255,.14)}
.sh-round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:17px;transition:.15s;cursor:pointer}
.sh-round:hover{border-color:var(--acc2);color:var(--acc2)}
.sh-round:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Loop is a toggle, not an action. It was a filled --grad circle, which made it
   the loudest thing in the workspace and outranked every real step of the
   Listen-Shadow-Record loop. On-state is now a tint plus a ring. */
.sh-round.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
.sh-round svg{width:20px;height:20px}
.sh-pill button{display:inline-flex;align-items:center;justify-content:center;gap:2px}
.sh-pill button svg{width:22px;height:22px}
.sh-pill button i{font-size:10px;font-weight:800;font-style:normal;line-height:1}
.sh-time{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--acc2);font-weight:600;white-space:nowrap}
/* CLIP PANEL — two states.
   Default (no clip): a single compact row  → CLIP [Start] 0:00 → [End]      [Delete]
   Clip created:      a second row appears  → [Transcript] [0s/3s] 3 sec — a bit short
   The clip info never shares the row with the Start/End controls. */
.sh-seg{margin-top:14px;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:9px 12px}
.sh-seg-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sh-seg-row::-webkit-scrollbar{height:0}
.sh-seg-sp{flex:1 1 auto;min-width:4px}
.sh-seg .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:700;flex:none}
.sh-seg .btn{padding:6px 10px;gap:4px;flex:none;min-height:34px}
.sh-seg .btn .btn-ic{margin-right:0}
.sh-seg .sh-time,.sh-seg .sh-len{flex:none}
/* second row: collapsed by default, expands when the panel gets .has-clip */
.sh-seg-row2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  max-height:0;opacity:0;overflow:hidden;margin-top:0;padding-top:0;border-top:1px solid transparent;
  transition:max-height .26s ease,opacity .2s ease .04s,margin-top .26s ease,padding-top .26s ease}
.sh-seg.has-clip .sh-seg-row2{max-height:140px;opacity:1;margin-top:9px;padding-top:9px;border-top-color:var(--line2)}
.sh-seg-row2 .sh-len{flex:1 1 auto;min-width:0;white-space:normal;line-height:1.45} /* long validation text wraps */
.sh-len{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.sh-len.ok{color:var(--green)}.sh-len.warn{color:var(--gold)}
.sh-count{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;background:#000;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:3px 7px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.sh-count.go{border-color:var(--acc2);color:var(--acc2)}
.sh-count.ready{border-color:var(--green);color:var(--green)}
.sh-count.over{border-color:var(--gold);color:var(--gold);animation:pulse 1.2s infinite}
.sh-cap-hint{font-size:12.5px;color:var(--mut);line-height:1.55;margin-top:8px;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.sh-cap-hint:empty{display:none}
.sh-cap-hint a{color:var(--acc2);font-weight:600;text-decoration:underline}
/* DAILY REMINDER row in Settings */
.rem-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px}
.rem-row{display:flex;align-items:center;gap:9px;flex:1;min-width:170px;cursor:pointer;font-size:14px}
.rem-row input{width:22px;height:22px;min-height:0;accent-color:var(--acc);flex:none;margin:0}
.rem-box input[type=time]{width:auto;flex:none;padding:7px 10px;font-size:14px}
.rem-box input[type=time]:disabled{opacity:.45}
.rem-note{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:6px}
.fb-sync{font-size:12px;line-height:1.5;margin:10px 0 0}
.fb-sync:empty{display:none}
.fb-sync.ok{color:var(--green)}
.fb-sync.bad{color:var(--gold)}
/* Conversation practice entry on the dashboard */
.rp-entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  margin:14px 0 0;border:1px solid rgba(99,102,241,.35);
  background:linear-gradient(150deg,rgba(99,102,241,.12),rgba(34,211,238,.07));font-family:inherit;color:var(--txt)}
.rp-entry:hover{transform:translateY(-2px);border-color:var(--acc)}
.rp-entry-ic{position:relative;overflow:hidden;flex:none;width:52px;height:52px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff}
.rp-entry-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rp-entry-ic svg{width:21px;height:21px}
.rp-entry-t{flex:1;min-width:0}
.rp-entry-t b{display:block;font-size:15px;margin-bottom:3px}
/* Secondary entry point, so it gets a glance not a paragraph: the full sentence
   stays in the markup (and in all 15 translations) but the card shows two lines
   and the destination explains the rest. */
.rp-entry-t small{font-size:12.5px;color:var(--mut);line-height:1.5;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rp-entry-go{flex:none;color:var(--acc2);font-size:19px}
.track-entry{align-items:flex-start}
.track-entry .rp-entry-t{display:flex;flex-direction:column;align-items:flex-start}
.track-entry-cta{display:block;color:var(--accent-text);font-size:13px;font-weight:700;margin-top:9px}
/* conversation history rows on the progress page */
.cv-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.cv-row:first-of-type{border-top:none}
.cv-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-p{flex:none;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--gold);background:rgba(251,191,36,.13);border-radius:7px;padding:2px 8px}
.cv-p.full{color:var(--green);background:rgba(52,211,153,.14)}
.cv-d{flex:none;font-size:12px;color:var(--mut2);min-width:52px;text-align:right}
/* Practice page section headings */
.prac-sec{font-size:clamp(19px,4.6vw,26px);font-weight:800;letter-spacing:-.3px;margin:26px 0 4px}
.prac-sec-sub{font-size:13px;color:var(--mut);margin-bottom:12px}
.prac-subgroup{margin-top:-4px}

/* ---- Practice: three tab levels, each visibly smaller than the one above,
       and every row fills its line edge to edge (no dead space). ---- */
#v-practice .seg-fit .seg-tab{min-height:46px;font-size:14.5px;font-weight:700;padding:11px 14px;border-radius:14px}
#v-practice .seg-fit .seg-tab .btn-ic svg{width:18px;height:18px}

/* Level 2 is an underline tab bar, not a pill row: structurally different from
   the pills above and below it, so the three levels never read as one strip.
   The rule spans the full line; the active tab carries its group's colour. */
#v-practice .prac-subgroup{
  flex-wrap:nowrap;gap:0;margin:2px 0 14px;position:relative;
  border-bottom:1px solid var(--line2)}
#v-practice .prac-subgroup .seg-tab{
  /* min-width:0 let these shrink below their own label, so German and Russian
     section names lost their last characters to an ellipsis. max-content keeps
     the label whole and lets the row scroll instead — .seg-tabs is already
     overflow-x:auto at <=820px. */
  flex:1 1 auto;min-width:max-content;justify-content:center;
  background:none;border:0;border-radius:0;box-shadow:none;
  min-height:44px;padding:11px 4px;font-size:13px;font-weight:600;
  color:var(--mut);position:relative}
#v-practice .prac-subgroup .seg-tab .btn-ic{display:none}
#v-practice .prac-subgroup .seg-tab .seg-lbl{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#v-practice .prac-subgroup .seg-tab::after{
  content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:3px;
  border-radius:3px 3px 0 0;background:transparent;transition:background .15s}
#v-practice .prac-subgroup .seg-tab:hover{color:var(--fg);border-color:transparent}
#v-practice .prac-subgroup .seg-tab.on{background:none;font-weight:800}

/* Vocabulary is the green half — same green as the Knowledge Booster cards
   that now live inside it, so tab and cards read as one section. */
#v-practice .seg-fit .seg-tab[data-k="vocabulary"].on{background:linear-gradient(135deg,#10b981,#34d399);color:#04160f}
#v-practice .seg-fit .seg-tab[data-k="vocabulary"].on .btn-ic svg{color:#04160f}
#v-practice .seg-fit .seg-tab[data-k="vocabulary"]:hover{border-color:var(--green)}

/* The Knowledge Boosters sit under the Vocabulary tabs — they drill the words
   collected there rather than being a page-level section. */
/* The due-now lead: same .home-due component the Dashboard uses, so the two
   surfaces read as one system. Here it starts the drill instead of navigating. */
.prac-due{margin:16px 0 4px}
.prac-kb{margin:0 0 18px}
.prac-kb-h{font-size:15px;font-weight:800;letter-spacing:-.2px;margin:0 0 3px;color:var(--txt)}

/* The callout colour tells you which half of the library you are in. */
#v-practice .prac-subgroup[data-group="vocabulary"] .seg-tab.on{color:var(--green)}
#v-practice .prac-subgroup[data-group="vocabulary"] .seg-tab.on::after{background:var(--green)}
/* Grammar was pink — the only pink accent in the product, and off-brand.
   --accent-text for the label (the accent lightened for use AS text, see
   DESIGN_SYSTEM) and --accent for the underline, which carries no text. */
#v-practice .prac-subgroup[data-group="grammar"] .seg-tab.on{color:var(--accent-text)}
#v-practice .prac-subgroup[data-group="grammar"] .seg-tab.on::after{background:var(--accent)}

/* Level 3: the smallest step — compact uppercase chips. */
#v-practice .prac-subtabs{gap:6px}
#v-practice .prac-subtabs .prac-subtab{
  min-height:44px;font-size:11.5px;font-weight:600;padding:8px 10px;border-radius:var(--r-md);
  letter-spacing:.2px;text-transform:uppercase;white-space:nowrap}
#v-practice .prac-subtabs .prac-subtab b{margin-left:4px;font-size:12px}

@media(max-width:520px){
  #v-practice .prac-subgroup .seg-tab{font-size:12px;padding:11px 3px}
  #v-practice .prac-subtabs .prac-subtab{font-size:10.5px;padding:8px 5px;letter-spacing:0}
}
@media(max-width:360px){
  #v-practice .prac-subgroup .seg-tab{font-size:11px;padding:11px 2px}
  #v-practice .prac-subtabs .prac-subtab{font-size:9.5px;padding:8px 4px}
  #v-practice .prac-subtabs .prac-subtab b{margin-left:3px;font-size:10.5px}
}
/* GRAMMAR — reference rules + exercise launcher cards */
.gr-rule{border-left:2px solid var(--line2);padding-left:12px}
.gr-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px}
.gr-bad{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(248,113,113,.5)}
.gr-arr{color:var(--mut2)}
.gr-good{color:var(--green);font-weight:600}
.gr-why{font-size:12.5px;color:var(--mut);line-height:1.55;margin-top:4px}
/* Exercise launchers stay a grid of boxes at every width — never a stack of
   full-width rows. Two per line on a phone, three once there is room. */
.gx-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
@media(max-width:560px){
  .gx-grid{grid-template-columns:1fr 1fr;gap:10px}
  .gx-card{min-height:112px;padding:14px 13px}
  .gx-card b{font-size:13.5px}
  .gx-card small{font-size:11.5px}
  .gx-best,.gx-new{font-size:10px;padding:3px 6px;letter-spacing:.4px}
}
.gx-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;
  border:1px solid var(--line2);background:var(--card);border-radius:var(--r);padding:18px;cursor:pointer;
  transition:.18s;font-family:inherit;color:var(--txt);min-height:132px}
.gx-card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.gx-card:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* "Words are due" entry on the Dashboard. Green because it is the same signal
   the Knowledge Booster cards carry: material you earned is waiting. Shown
   only when the count is above zero, so it never becomes furniture. */
.home-due{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  /* It is a <button>, so it inherits the UA's black button text unless told
     otherwise — which made the title 1.09:1 against the dark theme. */
  color:var(--txt);
  margin-bottom:14px;padding:14px 16px;
  background:linear-gradient(155deg,rgba(52,211,153,.12),rgba(52,211,153,.04));
  border-color:var(--line);box-shadow:var(--sh-1);transition:.15s}
.home-due:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--green) 40%,transparent);box-shadow:var(--sh-2)}
.home-due-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(52,211,153,.20);color:var(--green)}
.home-due-ic svg{width:20px;height:20px}
/* Rating ask — same shape as the due card, gold instead of green, and not a
   button itself since it carries two of its own. */
.home-rate{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px;padding:14px 16px;
  background:linear-gradient(155deg,rgba(251,191,36,.10),rgba(251,191,36,.03));
  border-color:var(--line);box-shadow:var(--sh-1)}
.rate-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.home-due-t{flex:1;min-width:0}
.home-due-t b{display:block;font-size:15px;margin-bottom:2px}
.home-due-t small{font-size:12.5px;color:var(--mut);line-height:1.5;display:block}
.home-due-go{flex:none;color:var(--green);font-size:19px}

/* The progress ring used to sit inside .hero, which supplied the gap to the
   stat cards below. On its own it needs that spacing back, and the last phase
   bar must not leave a strip of dead space inside the card. */
.home-ring{margin-bottom:22px;box-shadow:var(--sh-1)}
/* Hero context: role / goal / daily-slot as quiet pills, replacing the old
   run-on sentence. Values are the same translated labels used elsewhere. */
.home-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Momentum strip — the evidence a returning user came back for. It replaces the
   marketing hero once there is any history to show (the hero is the empty
   state), so the day's task moves ~130px up the screen. Dot styles are the
   Progress Calendar's .pcal-wd, reused rather than re-cut, and the counts are
   read from calWeekProgress() so Home and the calendar can never disagree. */
.home-week{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);padding:12px 14px;margin-bottom:16px}
.home-week-days{display:flex;gap:5px}
.home-week .pcal-wd{width:28px;height:28px;font-size:11.5px}
.home-week-lbl{font-size:12.5px;color:var(--mut);line-height:1.35;min-width:0}
.home-week-lbl b{display:block;color:var(--txt);font-size:15px;font-weight:800;letter-spacing:-.2px}
@media(max-width:400px){.home-week{gap:10px;padding:11px 12px}.home-week .pcal-wd{width:26px;height:26px}}

/* Execution rules used to be a 50%-width tab competing with the dashboard for
   a decision the user does not need to make daily. It is reference material, so
   it becomes a closed disclosure at the foot of the page: still one tap away,
   still keyboard-operable, no longer a fork in the road. */
.home-more{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
  box-shadow:var(--sh-1);margin-bottom:22px;overflow:hidden}
.home-more>summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:14px 16px;
  cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;transition:background .12s}
.home-more>summary::-webkit-details-marker{display:none}
.home-more>summary:hover{background:var(--hover)}
.home-more>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.home-more>summary .btn-ic{color:var(--gold);line-height:0;flex:none}
.home-more>summary .hm-chev{margin-left:auto;color:var(--mut);font-size:13px;transition:transform .15s}
.home-more[open]>summary .hm-chev{transform:rotate(90deg)}
.home-more[open]>summary{border-bottom:1px solid var(--line)}
.home-more-body{padding:4px 16px 18px}

/* Dashboard is the "what you have earned" half, so its cards carry green the
   same way the rules carry the warning colour. The progress ring and the phase
   chips keep their own colours - those encode meaning, not theme. */
.home-dash{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);padding:6px;grid-auto-rows:1fr}
.home-dash .stat-ic{color:var(--green)}

/* The one next step, stated once under the panel instead of nine times inside
   it. It is a real button and goes to the screen that changes the number. */
.home-step{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  min-height:48px;margin:10px 0 22px;padding:12px 16px;cursor:pointer;
  font-family:inherit;font-size:13.5px;line-height:1.5;font-weight:600;
  color:var(--txt);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--sh-1);transition:.15s}
.home-step:hover{background:var(--hover);box-shadow:var(--sh-2)}
.home-step:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.home-step-go{margin-left:auto;flex:none;color:var(--green);font-size:19px}

/* The execution rules are the non-negotiable part of the method, so they carry
   the warning colour rather than the app's usual indigo. (The .home-tabs rules
   that used to sit here went with the Dashboard/Execution-rules tab row — the
   rules now live in a .home-more disclosure, so green means "earned" on Home
   and nothing else.) */
.rules-h{margin:26px 0 12px;color:var(--gold)}
.rules-h svg{color:var(--gold)}
.home-rules .card{border-color:color-mix(in srgb,var(--gold) 34%,transparent)}
.home-rules .rule-ic{color:var(--gold)}

/* About actions: Support / Privacy policy / Manual stay on one line at any
   width. They share the row and shed their icons before they would ever wrap. */
.about-links{display:flex;flex-wrap:nowrap;gap:8px;margin-top:12px}
.about-links>*{flex:1 1 auto;min-width:0;justify-content:center;white-space:nowrap}
@media(max-width:520px){
  .about-links{gap:6px}
  /* icons are gone here, so the button can be a plain block and ellipsise a
     very long label (Russian "Политика конфиденциальности") rather than wrap */
  .about-links>*{display:block;font-size:11px;padding:7px 6px;
    overflow:hidden;text-overflow:ellipsis;text-align:center}
  .about-links .btn-ic{display:none}
}
@media(max-width:380px){
  .about-links{gap:5px}
  .about-links>*{font-size:10px;padding:6px 4px}
}
/* Neutral: the pink lives on the Grammar tab, which is the one place that
   colour needs to appear. Repeating it on seven card icons was noise. */
.gx-ic{color:var(--mut);line-height:0;margin-bottom:4px}
.gx-ic svg{width:24px;height:24px}
.gx-card b{font-size:14.5px;line-height:1.35}
.gx-card small{font-size:12px;color:var(--mut)}
.gx-best,.gx-new{margin-top:auto;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  border-radius:7px;padding:3px 8px}
.gx-best{color:var(--green);background:rgba(52,211,153,.14)}
.gx-new{color:var(--mut2);background:var(--bg2)}
.gx-why{display:none;margin-top:14px;padding:12px 15px;border-radius:12px;font-size:13.5px;line-height:1.55;
  align-items:flex-start;gap:9px}
.gx-why.show{display:flex;animation:fade .22s}
.gx-why.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:var(--txt)}
.gx-why.no{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35);color:var(--txt)}
.gx-why-ic{flex:none;line-height:0;margin-top:1px}
.gx-why.ok .gx-why-ic{color:var(--green)}
.gx-why.no .gx-why-ic{color:var(--gold)}
.gx-why-ic svg{width:18px;height:18px}
/* CONFIRM DIALOG — shown before anything destructive */
.cf-ov{position:fixed;inset:0;z-index:150;background:rgba(6,9,18,.78);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:22px;opacity:0;transition:opacity .18s ease}
.cf-ov.show{opacity:1}
.cf-card{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line2);
  border-radius:20px;padding:26px 24px 22px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6);
  transform:translateY(8px) scale(.98);transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.cf-ov.show .cf-card{transform:none}
.cf-ic{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:rgba(99,102,241,.14);color:var(--acc)}
.cf-ic.danger{background:rgba(239,68,68,.14);color:var(--red)}
.cf-ic svg{width:24px;height:24px}
.cf-card h3{font-size:17.5px;font-weight:800;line-height:1.3;margin-bottom:8px}
.cf-card p{font-size:13.5px;color:var(--mut);line-height:1.6;margin-bottom:20px}
.cf-actions{display:flex;gap:10px}
.cf-actions .btn{flex:1;justify-content:center;min-height:44px}
/* WELCOME MODAL — first run. Persistent: only a user action closes it. */
.wc-ov{position:fixed;inset:0;z-index:130;background:rgba(6,9,18,.78);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:22px;opacity:0;transition:opacity .28s ease}
.wc-ov.show{opacity:1}
.wc-card{position:relative;max-width:400px;width:100%;background:var(--card);border:1px solid var(--line2);
  border-radius:22px;padding:30px 26px 26px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6);
  transform:translateY(10px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.3,1);max-height:92vh;overflow:auto}
.wc-ov.show .wc-card{transform:none}
.wc-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);
  background:var(--card2);color:var(--mut);display:grid;place-items:center;cursor:pointer}
.wc-x svg{width:17px;height:17px}
.wc-emoji{color:var(--gold);line-height:0;margin-bottom:12px}
.wc-emoji svg{width:40px;height:40px;display:inline-block}
.wc-card h2{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
.wc-lead{font-size:14.5px;color:var(--mut);line-height:1.6;margin-bottom:16px}
.wc-score{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px;margin-bottom:16px}
.wc-score-l{display:block;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.wc-score b{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;color:var(--acc2)}
.wc-body{font-size:13.5px;color:var(--mut);line-height:1.6;margin-bottom:20px}
.wc-go{width:100%;justify-content:center}
/* EMPTY STATES — one shared component (icon + what's missing + the action that fills it) */
.empty-st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  padding:30px 22px;border:1px dashed var(--line2);border-radius:var(--r);background:var(--bg2)}
.empty-st .empty-ic{color:var(--mut2);line-height:0}
.empty-st .empty-ic svg{width:30px;height:30px}
.empty-st b{font-size:14.5px;color:var(--txt)}
.empty-st p{font-size:13px;color:var(--mut);line-height:1.55;max-width:44ch;margin:0}
.empty-st .btn{margin-top:6px}
.clip-row{display:flex;align-items:center;gap:12px;padding:11px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px;font-size:14px;cursor:pointer;transition:.15s}
.clip-row:hover{border-color:var(--acc)}
.clip-row .rng{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);white-space:nowrap}
.clip-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
/* SPEAKING FEEDBACK */
.fb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.fb-chip{padding:4px 11px;border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid var(--line2);color:var(--mut)}
.fb-chip.ok{color:var(--green);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)}
.fb-chip.bad{color:var(--gold);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.09)}
.fb-chip.miss{color:var(--red);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.07)}
.fb-item{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:var(--card);margin-bottom:10px}
.fb-item.fixed{border-color:rgba(52,211,153,.45)}
.fb-item .w{font-size:16.5px;font-weight:700;text-decoration:underline wavy var(--gold) 2px;text-underline-offset:4px}
.fb-item.fixed .w{text-decoration-color:var(--green)}
.fb-pct{font-family:'JetBrains Mono',monospace;background:rgba(251,191,36,.15);color:var(--gold);border-radius:8px;padding:2px 9px;font-weight:600;font-size:13px;float:right}
.fb-item.fixed .fb-pct{background:rgba(52,211,153,.15);color:var(--green)}
.fb-heard{font-size:13px;color:var(--mut);margin:10px 0 10px}
.fb-score-ring{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600}
/* SPEAKING FEEDBACK — a coach's debrief, not a dashboard. The verdict, the
   attempt trend and the two or three highest-impact fixes stay in the open;
   word-by-word, pace, grammar and vocabulary are one tap away. */
.fb-h{font-size:15px;font-weight:800;margin:16px 0 10px}
/* Emphasised secondary, not a second accent fill: on Session this sits 277px
   below "Mark session complete" and on Shadow just under "Start feedback", so
   an accent-filled retry would put two primaries in one viewport. Outlined
   accent still reads as the next step. */
.fb-more,.fb-sec{margin:12px 0 0}
.fb-sec-sub{font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:10px}
.fb-sec-act{margin-top:8px}
.fb-stat-v{font-size:14px;font-weight:700;line-height:1.4}
/* Score trend sparkline. Capped so it stays a quiet inline read on desktop
   rather than growing into a dashboard panel. No animation, so nothing to
   guard for reduced motion. */
.fb-trend{max-width:340px;margin:12px auto 2px}
.fb-trend svg{width:100%;height:auto;display:block;overflow:visible}

/* 42 of the panel's 52 controls were 38px or less. .btn-sm and .voc-mini are

#fbOut .voc-goto:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* POSTURE COACH */
.pc-wrap{display:none;position:relative;margin-top:14px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px}
/* dismiss the whole panel — stopping the coach is not the same as closing it */
.pc-x{position:absolute;top:6px;right:6px;z-index:2;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line2);background:var(--card2);color:var(--mut);display:grid;place-items:center;cursor:pointer}
