/* Fold this run's scores into the stored session so the history can show a
   trend without keeping any audio. */
function rpEvPersist(scored,weakList){
  if(!_rpLastTs)return;
  const c=(S.convos||[]).find(x=>x.ts===_rpLastTs); if(!c)return;
  if(scored.length){
    c.overall=Math.round(scored.reduce((a,b)=>a+b.overall,0)/scored.length);
    c.lines=(c.lines||[]).map((ln,i)=>{
      const m=scored.find(x=>x.i===i);
      return m?{text:ln.text,score:m.overall}:ln;
    });
  }
  c.weak=weakList.slice(0,20).map(w=>({w:w.word,s:w.score}));

/* ---------- HISTORY FOR ONE SCENARIO ----------
   Coming back to the same character is the point of the feature, so the value
   is in the comparison: how the score has moved, and which words keep being
   flagged. Only text and scores are kept — never audio. */
function rpHistFor(id){return (S.convos||[]).filter(c=>c&&c.id===id).sort((a,b)=>b.ts-a.ts)}
function rpHistDate(ts){
  try{return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})}catch(e){return""}
}
/* Words flagged in more than one session — the ones actually holding you back,
   as opposed to a single bad take. */
function rpHistRecurring(rows){
  const n=new Map();
  rows.forEach(c=>{
    const seen=new Set();
    (c.weak||[]).forEach(x=>{
      if(!x||!x.w||seen.has(x.w))return; seen.add(x.w);
      const e=n.get(x.w)||{w:x.w,n:0,best:100};
      e.n++; e.best=Math.min(e.best,x.s||0); n.set(x.w,e);
    });
  });
  return [...n.values()].filter(x=>x.n>1).sort((a,b)=>b.n-a.n||a.best-b.best).slice(0,12);
}

/* Aggregate of every conversation you have evaluated, for the dashboard tile
   and the Progress page. Only sessions with a score count towards the trend. */
function rpScoreStats(){
  const all=(S.convos||[]).slice();
  const sc=all.filter(c=>typeof c.overall==="number").sort((a,b)=>a.ts-b.ts);
  return {sessions:all.length,scored:sc.length,
    latest:sc.length?sc[sc.length-1].overall:null,
    best:sc.length?Math.max(...sc.map(x=>x.overall)):null,
    delta:sc.length>1?sc[sc.length-1].overall-sc[0].overall:null,
    recurring:rpHistRecurring(all)};
}

/* ---- hear the word as YOU said it ----
   Cut straight out of your own recording. Precision matters here: a snippet
   that lands on the wrong word teaches the wrong thing. So the exact word text
   is matched against Whisper's timings across the whole utterance, and only if
   that fails does it fall back to energy bursts and then to a length-weighted
   time estimate. Playback reuses the unlocked audio element, since the timings
   arrive over the network and would otherwise be blocked on iOS. */
const _rpMineUrl=new Map();
function rpPickWord(words,target,idx,count){
  const tw=String(target).toLowerCase().replace(/[^a-z']/g,"");
  const hits=words.map((w,i)=>({w,i})).filter(x=>x.w.w.replace(/[^a-z']/g,"")===tw);
  if(hits.length){
    const want=words.length===count?idx:Math.round((idx+0.5)/Math.max(1,count)*words.length-0.5);
    hits.sort((a,b)=>Math.abs(a.i-want)-Math.abs(b.i-want));
    return hits[0].w;                       /* exact text match, nearest the expected spot */
  }
  return fbPickWord(words,idx,count,target);
}
window.rpEvMine=async(ti,widx,wcount,word)=>{
  const turn=_rpLast&&_rpLast.turns&&_rpLast.turns[ti];
  if(!turn||!turn.blob)return toast(t("rp.eval_noaudio"));
  const blob=turn.blob;
  let url=_rpMineUrl.get(ti);
  if(!url){url=URL.createObjectURL(blob);_rpMineUrl.set(ti,url)}
  const words=await fbWords(blob);
  const seg=words?null:await fbSegments(blob);
  try{speechSynthesis.cancel()}catch(_){}
  fbStopAudio();
  const a=ttsPlayer(); _ttsAudio=a; a.onended=null; a.playbackRate=1;
  const playSpan=d=>{
    let start=null,end=null;
    if(words&&words.length){const o=rpPickWord(words,word,widx,wcount);start=o.start;end=o.end;}
    else if(seg&&seg.segs&&seg.segs.length&&wcount>0){
      let si=seg.segs.length===wcount?widx:Math.round((widx+0.5)/wcount*seg.segs.length-0.5);
      si=Math.max(0,Math.min(seg.segs.length-1,si));
      start=seg.segs[si].start;end=seg.segs[si].end;
    }else{
      const f=fbWordFrac(turn.gw&&turn.gw.length?turn.gw:new Array(Math.max(1,wcount)).fill("word"),widx);
      const pad=0.18;start=Math.max(0,f[0]*d-pad);end=Math.min(d,f[1]*d+pad);
    }
    const st=Math.max(0,start-0.04),en=Math.min(d,end+0.08);
    try{a.currentTime=st}catch(_){}
    a.play().catch(()=>{});
    setTimeout(()=>{if(_ttsAudio===a){try{a.pause()}catch(_){}}},Math.max(320,(en-st)*1000+120));
  };
  const begin=()=>{
    if(isFinite(a.duration)&&a.duration>0)return playSpan(a.duration);
    /* webm from MediaRecorder often reports Infinity until it is seeked */
    a.currentTime=1e10;
    a.onseeked=()=>{a.onseeked=null;playSpan(a.duration)};
  };
  if(a.src===url&&a.readyState>=1)begin();
  else{a.src=url;a.onloadedmetadata=()=>{a.onloadedmetadata=null;begin()}}
};

const OA_KEY="be12_oaikey";
const RV_MODEL="gpt-4o-realtime-preview-2024-12-17";
function oaKey(){try{return localStorage.getItem(OA_KEY)||""}catch(e){return""}}
window.oaSaveKey=()=>{const el=document.getElementById("oaKeyIn");if(!el)return;const v=(el.value||"").trim();try{localStorage.setItem(OA_KEY,v)}catch(e){}toast(v?t("rv.key_saved"):t("rv.key_cleared"));go("roleplay",cur.arg1)};

function oaKeyBox(){const k=oaKey();if(!k)return `<div class="rp-keynote" id="oaKeyBox">${t("rv.key_box")}${oaKeyForm("")}</div>`;return `<div class="rp-keynote rp-key-set" id="oaKeyBox"><span>${t("rv.key_connected",{tail:esc(k.slice(-4))})}</span> <button class="btn btn-g btn-sm" onclick="oaKeyEdit()">${t("rp.key_change")}</button></div>`}
window.oaKeyEdit=()=>{const box=document.getElementById("oaKeyBox");if(!box)return;box.classList.remove("rp-key-set");box.innerHTML=t("rv.key_box")+oaKeyForm(oaKey())};
const RV_VOICE="coral"; /* one warm, natural female voice */
const RV_ACCENTS=[["en-US","US English"],["en-GB","UK English"],["en-AU","Australian English"],["es-ES","Spanish (Spain)"],["es-MX","Spanish (Mexico)"],["fr-FR","French"],["de-DE","German"],["it-IT","Italian"],["pt-BR","Portuguese (Brazil)"]];
let RV=null;
/* ---- small audio helpers (mic → PCM16 @24k, and playback of PCM16 @24k) ---- */
function rvFloatToPCM16(float32){const out=new Int16Array(float32.length);for(let i=0;i<float32.length;i++){let s=Math.max(-1,Math.min(1,float32[i]));out[i]=s<0?s*0x8000:s*0x7FFF}return out}
function rvDownsample(buf,inRate,outRate){if(outRate===inRate)return buf;const ratio=inRate/outRate,n=Math.round(buf.length/ratio),out=new Float32Array(n);let i=0,j=0;while(i<n){const next=Math.round((i+1)*ratio);let sum=0,c=0;for(;j<next&&j<buf.length;j++){sum+=buf[j];c++}out[i]=c?sum/c:0;i++}return out}
function rvB64FromBytes(bytes){let bin="";const u8=new Uint8Array(bytes.buffer||bytes);for(let i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);return btoa(bin)}
function rvBytesFromB64(b64){const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8}
function rvSend(o){try{if(RV&&RV.ws&&RV.ws.readyState===1)RV.ws.send(JSON.stringify(o))}catch(e){}}

window.rvStart=async(scenarioId,voice,accent)=>{
  const sc=rpById(scenarioId); if(!sc)return;
  const key=oaKey(); if(!key)return toast(t("rv.key_needed_short"));
  voice=voice||RV_VOICE; accent=accent||"en-US";
  const el=document.getElementById("v-roleplay");
  RV={sc,voice,accent,ws:null,ac:null,proc:null,stream:null,covered:new Set(),playAt:0,sources:[],aiBubble:null,userBubble:null,ended:false};
  el.innerHTML=`
   <div class="rp-live">
     <div class="rp-live-top"><b>${esc(sc.title)} · ${esc((RV_ACCENTS.find(a=>a[0]===accent)||[,accent])[1])}</b><button class="btn btn-danger btn-sm" onclick="rvEnd()">${t("rv.end")}</button></div>
     <div class="rp-live-grid">
       <div class="rp-live-points"><div class="rp-lp-h">${t("rp.points_h")} <span id="rpProg" class="chip">0/${sc.points.length}</span></div>${sc.points.map((p,i)=>`<div class="rp-point" id="rpp${i}"><span class="rp-pn">${i+1}</span><span>${esc(p)}</span></div>`).join("")}</div>
       <div class="rp-live-stage">
         <div class="rp-av-wrap">${rpAvatar(sc,120)}<div class="rp-eq"><span></span><span></span><span></span><span></span><span></span></div></div>
         <button class="rp-mic" id="rvMute" onclick="rvToggleMute()" aria-label="Mute">${ic("mic")}</button>
         <div class="rp-status" id="rpStatus">${t("rv.connecting")}</div>
       </div>
       <div class="rp-live-tx"><div class="rp-tx-h">${t("rp.transcript")}</div><div class="rp-tx" id="rpTx"></div></div>
     </div>
   </div>`;
  manIconizeInline(el);
  try{
    RV.ac=new (window.AudioContext||window.webkitAudioContext)();
    RV.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){rvStatus(t("rv.mic_denied"));return}
  const ws=new WebSocket("wss://api.openai.com/v1/realtime?model="+RV_MODEL,["realtime","openai-insecure-api-key."+key,"openai-beta.realtime-v1"]);
  RV.ws=ws;
  ws.onopen=()=>{
    rvStatus(t("rv.listening"));
    const persona=`You are ${sc.persona}, a ${sc.role}. Setting: ${sc.scenario} Stay fully in character, warm and natural. Speak ${(RV_ACCENTS.find(a=>a[0]===accent)||[,"English"])[1]} with that accent. Keep replies short and conversational and keep things moving with a question. The learner is practising spoken ${accent.split("-")[0]==="en"?"English":"this language"} at an intermediate level. Their goals: ${sc.points.map((p,i)=>`${i+1}) ${p}`).join("; ")}. When the learner clearly completes a goal, call mark_point with its number. Greet them first.`;
    rvSend({type:"session.update",session:{
      modalities:["audio","text"],instructions:persona,voice,
      input_audio_format:"pcm16",output_audio_format:"pcm16",
      input_audio_transcription:{model:"whisper-1"},
      turn_detection:{type:"server_vad",threshold:0.5,prefix_padding_ms:300,silence_duration_ms:600},
      tools:[{type:"function",name:"mark_point",description:"Mark a talking-point goal as completed by the learner.",parameters:{type:"object",properties:{n:{type:"integer",description:"1-based goal number"}},required:["n"]}}],
      tool_choice:"auto"
    }});

    rvStartMic();
  };
  ws.onmessage=(ev)=>{try{rvEvent(JSON.parse(ev.data))}catch(e){}};
  ws.onerror=()=>rvStatus(t("rv.conn_err"));
  ws.onclose=()=>{if(RV&&!RV.ended)rvStatus(t("rv.conn_closed"))};
};
function rvStartMic(){
  if(!RV||!RV.ac||!RV.stream)return;
  const src=RV.ac.createMediaStreamSource(RV.stream);
  const proc=RV.ac.createScriptProcessor(4096,1,1);RV.proc=proc;
  proc.onaudioprocess=(e)=>{
    if(!RV||RV.muted)return;
    const inBuf=e.inputBuffer.getChannelData(0);
    const ds=rvDownsample(inBuf,RV.ac.sampleRate,24000);
    rvSend({type:"input_audio_buffer.append",audio:rvB64FromBytes(rvFloatToPCM16(ds))});
  };
  src.connect(proc);proc.connect(RV.ac.destination);
}
function rvEvent(m){
  switch(m.type){
    case "input_audio_buffer.speech_started": rvBargeIn(); rvStatus(t("rv.listening")); break;
    case "response.audio.delta": if(m.delta)rvPlay(m.delta); rvSpeaking(true); break;
    case "response.audio.done": case "response.done": rvSpeaking(false); if(!RV.muted)rvStatus(t("rv.listening")); break;
    case "response.audio_transcript.delta": rvAppendAI(m.delta||""); break;
    case "conversation.item.input_audio_transcription.completed": if(m.transcript)rvUser(m.transcript.trim()); break;
    case "response.function_call_arguments.done":

}

(async function boot(){
  const valid=["home","journey","phrases","shadow","practice","review","profile","roleplay","pron","data","session","manual"];

  const p=_hs.split("/").filter(Boolean);
  let v=decodeURIComponent(p[0]||"home"),a1=p[1]?decodeURIComponent(p[1]):undefined,a2=p[2]?decodeURIComponent(p[2]):undefined;
  if(a1&&/^\d+$/.test(a1))a1=+a1;

     and most of our Central African users are Francophone, so awaiting it

    if(!inTime)dict.then(()=>{localizeStatic();try{go(cur.v,cur.arg1,cur.arg2)}catch(e){}});

  const done=totalDone();
  track("app_open",{

    onboarded:S.profile&&S.profile.name?"yes":"no",
    /* bucketed, not the raw count — retention shape without a high-cardinality field */

})();

if("serviceWorker" in navigator&&location.protocol==="https:"){
  let _swReloading=false;const _bootAt=Date.now();
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(_swReloading)return;
    /* Don't auto-reload during the first seconds of load: a new SW claiming the
       page mid-boot races the hash restore and can drop you onto Home. The app is
       network-first, so the fresh version is already loaded — the reload is only

       adopts the account copy wholesale, so every device that logs in ends up
       identical — the same result you got by hand with reset-then-login.

  ov.onclick=e=>{if(e.target===ov)fbCloseModal()};
  ov.innerHTML=`<div class="auth-card" style="position:relative">
    <button class="auth-x" onclick="fbCloseModal()">×</button>
    <img src="logo.svg" alt="" style="width:52px;height:52px;border-radius:15px;display:block;margin:0 auto 14px">
    <h2>${signup?t("auth.create_title"):t("auth.welcome_back")}</h2>
    <p class="sub">${signup?t("auth.create_sub"):t("auth.login_sub")}</p>
    <!-- Google/Apple sign-in removed from the UI, not from the code.
         signInWithRedirect cannot complete while the app is served from
         app.lomonec.com but Firebase's auth handler lives on
         be-mastery.firebaseapp.com: browsers partition third-party storage, so
         the session never comes back and the user lands on a page that looks
         signed out. Verified on a real device. The fix is serving Firebase's
         /__/auth/ handler from our own domain, which GitHub Pages cannot do —
         so until hosting moves, offering the button would mean shipping one
         that silently fails. fbGoogle() is kept for that day. -->
    <input id="authEmail" type="email" placeholder="${esc(t("auth.email_ph"))}" autocomplete="email">
    <input id="authPw" type="password" placeholder="${esc(t("auth.password_ph"))}" autocomplete="${signup?"new-password":"current-password"}">
    <div class="auth-err" id="authErr"></div>
    <button class="btn btn-p" style="width:100%;justify-content:center" onclick="fbEmailAuth('${signup?"up":"in"}')">${signup?t("auth.signup_btn"):t("auth.login_btn")}</button>
    ${signup?"":`<p style="text-align:center;margin-top:10px"><a class="auth-forgot" onclick="fbReset()">${t("auth.forgot")}</a></p>`}
    <p class="auth-alt">${signup?`${t("auth.have_account")} <a onclick="fbOpenModal('in')">${t("auth.login_btn")}</a>`:`${t("auth.no_account")} <a onclick="fbOpenModal('up')">${t("auth.register_link")}</a>`}</p>
    <p class="auth-terms">${t("auth.terms_pre")} <a href="privacy.html" target="_blank" style="color:var(--mut)">${t("auth.terms_link")}</a>${t("auth.terms_post")}</p>
  </div>`;
  document.body.appendChild(ov);
};
window.fbCloseModal=function(){const o=document.getElementById("authOv");if(o)o.remove()};
/* --- account card (injected by rData) --- */
window.fbAuthCard=function(){
  if(FBUser){
    const em=FBUser.email||"account",initial=(em[0]||"?").toUpperCase();
    return `<div class="card" style="margin-bottom:16px;border-color:rgba(52,211,153,.4)">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:48px;height:48px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;flex:none">${esc(initial)}</div>
        <div style="min-width:0"><b style="font-size:15px">${t("auth.card_synced")}</b><p style="font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis">${esc(em)}</p></div>
      </div>
      <p style="font-size:12.5px;color:var(--mut);margin:12px 0 0">${t("auth.card_synced_desc")}</p>
      <p class="fb-sync" id="fbSyncMsg"></p>
      <button class="btn btn-g btn-sm" style="margin-top:10px" onclick="fbTestSync()">${t("auth.test_sync")}</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-g btn-sm" onclick="fbSignOut()">${t("auth.signout_btn")}</button>
        <button class="btn btn-g btn-sm" style="color:#fca5a5" onclick="fbDeleteAccount()">${t("auth.delete_btn")}</button>
      </div>
    </div>`;
  }
  if(!fbConfigured())return "";
  return `<div class="card" style="margin-bottom:16px;border-color:rgba(34,211,238,.4)">
    <b style="font-size:16px">${hIcon("cloud",t("auth.card_sync_title"))}</b>
    <p style="font-size:13px;color:var(--mut);line-height:1.6;margin:6px 0 14px">${t("auth.card_sync_desc")}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-outline auth-go" onclick="fbOpenModal('up')">${t("auth.create_account_btn")}</button>
      <button class="btn btn-g" onclick="fbOpenModal('in')">${t("auth.login_btn")}</button>
    </div>
  </div>`;
};
/* --- gentle one-time nudge after the first completed session --- */
function fbDismissed(){return localStorage.getItem(FB_NUDGE_KEY)==="1"}
window.fbDismissNudge=function(){localStorage.setItem(FB_NUDGE_KEY,"1");fbHideNudge()};
function fbHideNudge(){const n=document.getElementById("syncNudge");if(n)n.remove()}
function fbUpdateNudge(){
  fbHideNudge();
  if(!fbConfigured()||FBUser||fbDismissed())return;
  if(totalDone()<1)return;
  const n=document.createElement("div");n.className="sync-nudge";n.id="syncNudge";
  n.innerHTML=`<span class="nudge-ic" style="color:var(--acc2);line-height:0;flex:none">${ic("cloud")}</span>
    <div style="flex:1;font-size:13px;line-height:1.5"><b>${t("auth.nudge_title")}</b><br><span style="color:var(--mut)">${t("auth.nudge_desc")}</span></div>
    <button class="btn-outline auth-go" onclick="fbOpenModal('up')">${t("auth.nudge_signin")}</button>
    <button class="auth-x" style="position:static;font-size:20px" onclick="fbDismissNudge()">×</button>`;
  document.body.appendChild(n);
}
/* refresh the nudge on each navigation (cheap, once per view change) */
(function(){const _g=window.go;window.go=function(){const r=_g.apply(this,arguments);try{fbUpdateNudge()}catch(e){}return r}})();
setTimeout(fbUpdateNudge,800);
</script>
</body>
</html>
