.pc-x svg{width:15px;height:15px}
.pc-row{display:flex;gap:14px;align-items:center}
.pc-cv{width:110px;height:146px;background:#0a0e1a;border-radius:10px;border:2.5px solid var(--line2);transition:border-color .3s,box-shadow .3s;flex:none}
.pc-cv.good{border-color:var(--green)}
.pc-cv.warn{border-color:var(--gold)}
.pc-cv.bad{border-color:#f97316;box-shadow:0 0 20px rgba(249,115,22,.45)}
/* VOCABULARY */
.voc-row{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;overflow:hidden}
.voc-head{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer}
.voc-head:hover{background:rgba(255,255,255,.03)}
.voc-head .wd{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voc-mini{padding:0;width:44px;height:44px;min-height:44px;flex:none;justify-content:center}
.voc-mini svg{width:18px;height:18px}
.voc-mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Saved is a STATE, not the row's primary action. It used to be a filled --grad
   button — the brightest thing on every row — even though on "My words" every
   row is already saved, so the loudest control on the list deleted the word.
   Quiet green tint now, and the label says what a tap will do. */
.voc-save.on{background:color-mix(in srgb,var(--green) 16%,transparent);
  border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}
.voc-save.on:hover{background:color-mix(in srgb,var(--green) 26%,transparent)}
.voc-chev{color:var(--mut);flex:none;font-size:12px}
.voc-lvl{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.5px}
.voc-lvl.a{background:rgba(52,211,153,.15);color:var(--green)}
.voc-lvl.b{background:rgba(99,102,241,.18);color:#a5b4fc}
.voc-lvl.c{background:rgba(251,191,36,.15);color:var(--gold)}
.voc-body{padding:0 14px 13px 52px;font-size:13.5px;color:var(--mut);display:none}
.voc-row.open .voc-body{display:block}
.voc-syn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 16px;margin-bottom:8px;font-size:14.5px;flex-wrap:wrap}
.voc-syn .arr{color:var(--mut2)}
.voc-syn b.up{color:var(--acc2);border-bottom:1px dashed var(--acc2)}
/* ===== PRACTICE TAB ===== */
/* Segmented pill tabs — the one tab component used across the app
   (Library buckets, Journey phases, Shadow Studio, Phrase Lab). */
.prac-subtabs,.seg-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
#v-practice .prac-add-btn{min-height:44px}
#v-practice .prac-add input{min-height:44px}
/* the three vocabulary buckets are one control — equal widths read as a
   segmented switch rather than three loose pills of random length */
.prac-subtabs{flex-wrap:nowrap}
.prac-subtabs .prac-subtab{flex:1 1 0;min-width:0;justify-content:center;text-align:center;padding:8px 6px}
.prac-subtabs .prac-subtab b{margin-left:4px}
.prac-subtab,.seg-tab{border:1px solid var(--line2);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.prac-subtab b,.seg-tab b{margin-left:5px;color:var(--mut)}
/* was background:var(--grad) with white text — ~1.9:1 at the gradient's cyan
   end. Shared by every tab row, so it is fixed here rather than per screen. */
.prac-subtab.on,.seg-tab.on{background:var(--accent-fill);border-color:transparent;color:var(--on-accent)}
.prac-subtab.on b,.seg-tab.on b{color:var(--on-accent);opacity:.85}
.prac-subtab:hover,.seg-tab:hover{border-color:var(--acc)}
.prac-subtab:focus-visible,.seg-tab:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.seg-tab .btn-ic svg,.seg-tab .inl-ic svg{width:16px;height:16px;display:block}
/* horizontal scroll instead of wrapping when a tab row is too wide for the phone */
@media(max-width:520px){
  .seg-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-2px;padding:2px;
    /* soft fade on the right edge so it's obvious more tabs are hiding there */
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
    mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
  .seg-tabs::-webkit-scrollbar{display:none}
  .seg-tab{flex:0 0 auto}
  /* a row that already fits needs no fade */
  .seg-fit{-webkit-mask-image:none;mask-image:none}
  /* .seg-fit on a phone: tabs share the width evenly and drop their icons. */
  .seg-fit{overflow-x:visible;gap:6px}
  .seg-fit .seg-tab{padding:7px 4px;font-size:clamp(10.5px,3vw,12px);gap:3px}
  .seg-fit .seg-tab .btn-ic{display:none}
  .seg-fit .seg-tab b{margin-left:0}
}
.prac-ex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
/* Neutral launchers. The green on the Vocabulary tab above already says which
   section these belong to; repeating it on the cards, their icons and the
   heading turned one signal into four. Green is reserved for earned state. */
.prac-ex-card{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:13px 8px;cursor:pointer;color:var(--txt);transition:.15s}
.prac-ex-card:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.25)}
.prac-ex-card .pex-ic{width:36px;height:36px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;color:var(--mut);margin-bottom:4px}
/* .ready = there are enough words in the bucket for this drill to run, so the
   green here is earned state, not decoration: it says "something is waiting". */
.prac-ex-card.ready{background:linear-gradient(155deg,rgba(52,211,153,.20),rgba(52,211,153,.08));border-color:rgba(52,211,153,.42)}
.prac-ex-card.ready:hover{border-color:var(--green);box-shadow:0 10px 26px rgba(52,211,153,.22)}

.prac-ex-card .pex-ic svg{width:20px;height:20px}

.prac-ex-card small{font-size:11.5px;color:var(--mut)}
.prac-stats{text-align:center}
/* was gradient-clipped text at 1.23:1 in dark — see the session timer digits */
.prac-total{font-size:40px;font-weight:800;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums}
.prac-total-l{font-size:12.5px;color:var(--mut);margin-top:2px}
.prac-bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:14px 0 12px}
.prac-bar span{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.prac-legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);text-align:left;max-width:240px;margin:0 auto}
.prac-legend .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.pdot.ready{background:var(--acc)}.pdot.upnext{background:var(--mut2)}.pdot.learned{background:var(--green)}
.prac-add{display:flex;gap:8px;margin-top:16px}
.prac-add input{flex:1;min-width:0}
@media(max-width:520px){.prac-ex{gap:7px}.prac-ex-card{padding:11px 5px;border-radius:12px}.prac-ex-card .pex-ic{width:30px;height:30px;margin-bottom:2px}.prac-ex-card .pex-ic svg{width:17px;height:17px}.prac-ex-card b{font-size:12px}.prac-ex-card small{font-size:9.5px;line-height:1.2}}

.pv-actions{display:flex;gap:10px;justify-content:center}
.pv-actions .btn{flex:1;max-width:220px;justify-content:center}
.pv-quiz{margin-bottom:18px}
.pv-clue{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:20px;text-align:center;margin-bottom:16px}

.pv-end{text-align:center;padding:40px 10px}
.pv-end-ic{color:var(--gold);margin-bottom:6px}.pv-end-ic svg{width:44px;height:44px}
.pv-end h2{font-size:24px;margin-bottom:6px}
.pv-end p{color:var(--mut);margin-bottom:22px}
.cw-wrap{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px}

.cw-cell{position:relative;width:34px;height:34px;background:var(--card)}

.pv-opt:hover{border-color:var(--green);color:var(--green)}

/* RESOURCES */

/* REVIEW */
.slider-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.slider-row label{width:170px;font-size:14px;color:var(--mut);flex:none}
.slider-row input[type=range]{flex:1;accent-color:var(--acc)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}

.pass{color:var(--green);font-weight:700}.fail{color:var(--red);font-weight:700}

/* ONBOARDING — first-win moment */
.ob-win{margin-top:6px}
.ob-line{position:relative;font-size:19px;font-weight:700;line-height:1.45;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:18px 20px 14px;margin-bottom:6px}
.ob-hear{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.ob-hear:hover{border-color:var(--acc);transform:translateY(-1px)}
.ob-hear svg{width:15px;height:15px;color:var(--acc)}
.ob-stage{position:relative;margin:14px 0 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.ob-mic{width:88px;height:88px;border-radius:50%;border:none;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 32px rgba(99,102,241,.42);transition:transform .15s;position:relative}
.ob-mic:hover{transform:scale(1.06)}
.ob-mic svg{width:34px;height:34px}
.ob-mic.listening{animation:obMicPulse 1.2s ease-in-out infinite}
.ob-mic-rings{position:absolute;inset:0;border-radius:50%;animation:obRings 1.4s ease-out infinite}
@keyframes obRings{0%{box-shadow:0 0 0 0 rgba(99,102,241,.45)}100%{box-shadow:0 0 0 26px rgba(99,102,241,0)}}
@keyframes obMicPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.ob-mic-lbl{font-size:13px;color:var(--mut);font-weight:600}
.ob-mic-lbl.live{color:var(--acc)}
.ob-reveal{animation:fade .35s;width:100%}
.ob-ring{--p:0;--col:var(--acc);width:130px;height:130px;border-radius:50%;margin:2px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--col) calc(var(--p)*1%),var(--line2) 0)}
.ob-ring-in{width:104px;height:104px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;line-height:1;padding-left:11px}
.ob-score{font-size:38px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--txt);line-height:1}
.ob-score-pct{font-size:19px;font-weight:700;color:var(--mut);align-self:center;margin-left:2px}
.ob-baseline{font-size:12.5px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:9px}
.ob-baseline svg{width:15px;height:15px;color:var(--gold);flex:none}
.ob-baseline b{color:var(--txt)}
.ob-reveal-line{font-size:15px;font-weight:700;margin:2px 0 12px;line-height:1.4}
.ob-reveal-sub{font-size:12px;color:var(--mut2);margin-bottom:9px}
.ob-words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ob-w{font-size:13px;padding:4px 9px;border-radius:8px;font-weight:600}
.ob-w.ok{background:rgba(52,211,153,.16);color:var(--green);border:1px solid rgba(52,211,153,.4)}
.ob-w.warn{background:rgba(251,191,36,.14);color:var(--gold);border:1px solid rgba(251,191,36,.4)}
.ob-out{font-size:13.5px;min-height:18px;margin:6px 0 12px;color:var(--mut)}
.ob-win-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ob-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ob-confetti i{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;animation:obConf 1.9s ease-in forwards}
@keyframes obConf{to{transform:translateY(380px) rotate(600deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.ob-mic.listening,.ob-mic-rings,.ob-confetti i{animation:none}.ob-confetti{display:none}}
/* ONBOARDING */
/* Onboarding overlay. Must scroll: on a short screen (or an installed Android
   app, where the system bars eat height) the assessment step is taller than the
   viewport, and a centred grid would clip the buttons off the bottom with no way
   to reach them. `display:flex` + `margin:auto` on the card centres it when it
   fits and scrolls cleanly — without the top-clipping that centred overflow
   causes. Safe-area padding keeps it clear of the notch and nav bar. */
.ob-wrap{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right))
          max(24px,calc(env(safe-area-inset-bottom) + 16px)) max(20px,env(safe-area-inset-left));
  background-image:radial-gradient(ellipse 80% 55% at 50% -10%,var(--wash1),transparent),radial-gradient(ellipse 60% 45% at 90% 110%,var(--wash2),transparent)}
.ob-card{max-width:520px;width:100%;margin:auto;text-align:center;animation:fade .4s}
.ob-logo{width:76px;height:76px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:38px;margin:0 auto 20px;box-shadow:0 16px 50px rgba(99,102,241,.45);color:#fff}
.ob-logo svg{width:40px;height:40px}
.ob-card h2{font-size:clamp(24px,5vw,34px);font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-bottom:10px}
.ob-card .sub{margin:0 auto 26px}
.ob-em{font-style:italic;color:var(--accent)}
.ob-go{width:auto;min-width:180px;margin:0 auto;font-size:16px;padding:14px 34px}
.ob-skip{min-height:44px}
.ob-hear{min-height:44px}
#obWrap h1{font-size:clamp(22px,5.6vw,27px);font-weight:800;line-height:1.25;letter-spacing:-.4px}
#obWrap .auth-alt a{min-height:44px;display:inline-flex;align-items:center}
.ob-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.ob-chip{border:1px solid var(--line2);background:var(--card);color:var(--txt);padding:12px 20px;border-radius:14px;font-size:14.5px;font-weight:600;transition:.15s;min-height:44px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.ob-chip:hover,.ob-chip.on{border-color:var(--acc);background:rgba(99,102,241,.14)}
.ob-dots{display:flex;gap:7px;justify-content:center;margin-top:26px}

/* AUTH (optional cloud sign-in) */
.auth-ov{position:fixed;inset:0;z-index:120;background:rgba(6,9,18,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:22px;animation:fade .2s}
.auth-card{max-width:400px;width:100%;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:28px 24px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:fade .3s;max-height:92vh;overflow:auto}
.auth-card h2{font-size:23px;font-weight:800;letter-spacing:-.4px;text-align:center;margin-bottom:6px}
.auth-card .sub{text-align:center;margin:0 auto 22px;font-size:13.5px}
/* 44x44 hit area, not a bare 24px glyph — this is the only way to dismiss the
   sign-in sheet, and it measured 20x11 before. The box grows around the glyph;
   top/right are pulled in so the × stays visually where it was. */
.auth-x{position:absolute;top:6px;right:8px;width:44px;height:44px;display:grid;place-items:center;background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer;line-height:1}
.auth-card input{margin-bottom:10px}
.auth-err{color:#fca5a5;font-size:12.5px;text-align:center;min-height:16px;margin:2px 0 8px}
.auth-alt{text-align:center;font-size:13px;color:var(--mut);margin-top:16px}
/* the sign-in buttons were .btn-p — white on --grad, ~1.9:1 at the cyan end —
   and 38px in the Dashboard nudge. Shared by Settings and that nudge. */
/* Emphasised secondary: reads as actionable without a second accent FILL where
   one would collide with a nearby primary. Same recipe as .fb-again, which
   should fold into this class in a later cleanup (COMPONENT_LIBRARY). */
.btn-outline{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:11px 18px;border-radius:var(--r-md);
  background:transparent;border:1.5px solid var(--accent);
  color:color-mix(in srgb,var(--accent) 58%,#fff);
  font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
  transition:background .12s,transform .12s cubic-bezier(.2,.8,.3,1)}
:root[data-theme="light"] .btn-outline{color:var(--accent)}
.btn-outline:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.btn-outline:active{transform:scale(.985)}
.btn-outline:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn-outline{transition:none}.btn-outline:active{transform:none}}
/* .btn-outline at full width — the only difference is size, so it is a
   modifier rather than a second copy of the recipe. */
.fb-again{width:100%;min-height:48px;margin:14px 0 4px;padding:12px 18px;font-size:15px}
.auth-go{width:auto;min-width:140px}
/* "Register" / "Log in" and "Forgotten your password?" are actions, not prose,
   so they get a real hit area. The Privacy Policy link inside .auth-terms is
   deliberately left inline — it sits mid-sentence, where WCAG 2.5.8 exempts it
   and padding would break the line. */
.auth-alt a,.auth-forgot{color:var(--acc2);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 6px;margin:-13px 0}
.auth-forgot{color:var(--mut);font-weight:400;font-size:12.5px}
/* --mut2 is a border/divider token and must never carry text (DESIGN_SYSTEM).
   At 11px on the auth sheet it measured 2.95:1, well under AA. */
.auth-terms{text-align:center;font-size:11px;color:var(--mut);margin-top:16px;line-height:1.6}
.sync-nudge{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:58;background:var(--card2);border:1px solid rgba(34,211,238,.4);border-radius:16px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:flex;align-items:center;gap:12px;animation:fade .35s;max-width:520px;margin:0 auto}
@media(min-width:821px){.sync-nudge{bottom:16px}}
.sync-nudge .nudge-ic svg{width:24px;height:24px}
/* BOTTOM NAV (mobile app style) */
.bottom-nav{display:none}
@media(max-width:820px){
  .nav-in button.tab,.nav-in a.tab{display:none}
  .bottom-nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;align-items:stretch;
    background:var(--bnav-bg);backdrop-filter:blur(16px);border-top:1px solid var(--line2);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
  .bnav-item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;
    color:var(--mut);font-size:10.5px;font-weight:600;padding:4px 2px;border-radius:12px;transition:.15s;font-family:inherit}
  .bnav-item .ic{font-size:21px;line-height:0;transition:.15s;display:block}
  .bnav-item .ic svg{width:25px;height:25px;display:block}
  .bnav-item.on{color:var(--accent-text)}
  .bnav-item.on .ic{transform:translateY(-2px) scale(1.12)}
  .bnav-item.on::before{content:"";position:absolute;width:0}
  main{padding-bottom:110px}
  .toast{bottom:96px}
}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--acc);padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:150;transition:.3s;opacity:0}
.toast.show{transform:translateX(-50%);opacity:1}
/* ---- In-app document viewer -------------------------------------------
   One overlay for every internal document reached from the footer (Privacy,
   About, and anything added later). It sits ON TOP of the current view rather
   than navigating, which is what makes "close" restore the previous screen
   perfectly: scroll position, active tab, typed text, a running session and
   playback are all untouched because nothing re-renders. */
.doc-ov{position:fixed;inset:0;width:100%;height:100%;z-index:140;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s}
.doc-frame{flex:1 1 auto;width:100%;height:100%;min-height:0;border:none;background:var(--bg)}
/* Chrome is absolutely positioned inside a FIXED overlay, so it cannot scroll
   away — the iframe scrolls, the buttons do not. 44px, safe-area aware. */
.doc-close,.doc-theme{position:absolute;top:max(14px,calc(env(safe-area-inset-top) + 8px));z-index:3;
  width:44px;height:44px;min-height:44px;border-radius:50%;border:1px solid var(--line2);
  background:rgba(8,12,22,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.doc-close{left:max(14px,calc(env(safe-area-inset-left) + 8px))}
.doc-theme{right:max(14px,calc(env(safe-area-inset-right) + 8px))}
.doc-close svg,.doc-theme svg{width:21px;height:21px}
.doc-close:hover,.doc-theme:hover{border-color:var(--acc)}
.doc-close:focus-visible,.doc-theme:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
html[dir="rtl"] .doc-close{left:auto;right:max(14px,calc(env(safe-area-inset-right) + 8px))}
html[dir="rtl"] .doc-theme{right:auto;left:max(14px,calc(env(safe-area-inset-left) + 8px))}
@media (prefers-reduced-motion:reduce){.doc-ov{animation:none}}
.footer-note{text-align:center;color:var(--mut);font-size:12.5px;margin-top:50px;line-height:1.7}
/* These sit outside every #v-* container, which is why the per-screen audit
   never saw them: they were 16px-tall links present on every screen. WCAG 2.5.8
   exempts links inline in a text run, but this project sets its own 44px floor,
   so the hit area is padded out without changing where the text sits. */
.footer-note a{color:var(--acc2);display:inline-block;min-width:44px;text-align:center;padding:13px 6px;margin:-13px 0}
@media(max-width:640px){.ring-wrap{flex-direction:column;text-align:center}.slider-row label{width:110px}}

/* RTL */

/* Directional glyphs drawn in markup. Unicode does not bidi-mirror U+2192 and
   friends, so in Arabic and Urdu they point away from the direction of travel.
   Arrows that live INSIDE translated strings are already correct — the ar/ur
   files ship "←" where English ships "→" — so only the markup ones are listed.
   Media-playback glyphs (▶) are deliberately absent: playback controls do not
   mirror. */
html[dir="rtl"] .home-due-go,
html[dir="rtl"] .home-step-go,

/* In-app User Manual (localized document) */
/* HELP CENTRE (the "?" landing) */
/* was background:var(--grad) with white text — ~1.9:1 at the gradient's cyan
   end, on the largest type of the screen */
.help-hero{background:var(--accent-fill);border-radius:20px;padding:34px 26px;text-align:center;color:var(--on-accent);margin-bottom:14px}
.help-hero h1{font-size:clamp(20px,4vw,28px);font-weight:800;line-height:1.25}
/* Search bar stays pinned below the top nav so the term can be changed while scrolling */
/* sits BELOW the sticky "‹ Profile · Help & guide" bar, not on top of it.
   Background stays transparent — the blur alone keeps content readable, and a
   solid fill reads as a black band across the page. */
/* Sticks directly under the sticky .pg-eyebrow. --pg-eyebrow-h is measured at
   render time (syncEyebrowH) because the eyebrow's height is not a constant:
   it changes with the breakpoint and with the translated label, which wraps in
   several languages. The old fallback of 38px was never replaced by a real
   value — the variable was referenced but never defined — so this stuck at
   100px while the eyebrow ran to 126px and covered 18px of the input. The
   fallback below is the tallest observed eyebrow, so a miss leaves a small gap
   rather than an overlap. */
.help-searchbar{position:sticky;top:calc(62px + var(--pg-eyebrow-h,68px));z-index:39;background:transparent;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 0 10px;margin-bottom:10px}
.help-search{max-width:520px;margin:0 auto;position:relative}
.help-search-ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut);line-height:0}
.help-search-ic svg{width:18px;height:18px}
.hero-ic{display:inline-flex;vertical-align:-3px;margin-right:8px;line-height:0}
.hero-ic svg{width:24px;height:24px}
.help-search input{width:100%;border:1px solid var(--line2);border-radius:14px;padding:14px 108px 14px 44px;font-size:16px;color:var(--txt);background:var(--card2);box-shadow:0 4px 18px rgba(0,0,0,.12);transition:border-color .15s,box-shadow .15s}
.help-search input:focus{outline:none;border-color:var(--acc);box-shadow:0 4px 22px rgba(99,102,241,.25)}
.help-nav{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px}
.help-count{font-size:12px;font-weight:700;color:var(--mut);font-family:'JetBrains Mono',monospace;margin-right:4px;min-width:34px;text-align:right}
.help-arrow{width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.12s}
.help-arrow:hover{border-color:var(--acc);color:var(--acc)}
.help-arrow:active{transform:scale(.9)}
.help-arrow:disabled{opacity:.35;cursor:default;pointer-events:none}
.help-hl.cur{background:#fb923c;color:#1a0f02;box-shadow:0 0 0 2px rgba(251,146,60,.55)}
/* Manual sections as disclosures — see helpCollapse(). */
.help-sec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
  box-shadow:var(--sh-1);margin-bottom:10px;overflow:hidden}
.help-sec>summary{display:flex;align-items:center;gap:10px;min-height:56px;padding:14px 16px;
  cursor:pointer;font-size:15.5px;font-weight:800;line-height:1.35;list-style:none;transition:background .12s}
.help-sec>summary::-webkit-details-marker{display:none}
.help-sec>summary::after{content:"▸";margin-left:auto;flex:none;color:var(--mut);font-size:15px;transition:transform .15s}
.help-sec[open]>summary::after{transform:rotate(90deg)}
.help-sec>summary:hover{background:var(--hover)}
.help-sec>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.help-sec[open]>summary{border-bottom:1px solid var(--line)}
.help-sec-ic{flex:none;line-height:0;color:var(--accent)}
.help-sec-ic svg{width:20px;height:20px}
.help-sec>summary .no{flex:none;font-size:12px;font-weight:800;color:var(--on-accent);
  min-width:22px;height:22px;display:inline-grid;place-items:center;
  background:var(--accent-fill);border-radius:7px}
.help-sec-body{padding:4px 16px 18px}
.manual-title{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:8px}
html[dir="rtl"] .help-sec>summary::after{transform:scaleX(-1)}
html[dir="rtl"] .help-sec[open]>summary::after{transform:scaleX(-1) rotate(-90deg)}
/* the search prev/next arrows were 26px */

#v-manual .manual-doc a{min-height:44px;display:inline-flex;align-items:center;color:var(--acc2)}

.fb-pw{--c:var(--mut);display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-left:3px solid var(--c);border-radius:8px;padding:4px 9px}

/* ROLE-PLAY (AI conversation) */
.rp-av{position:relative;overflow:hidden;display:grid;place-items:center;border-radius:20px;background:var(--grad);color:#fff;flex:none}
.rp-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rp-av .rp-av-ic{display:grid;place-items:center;width:100%;height:100%}
.rp-av.has-photo .rp-av-ic{display:none}
.rp-av svg{width:44%;height:44%}
.rp-keynote{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--mut);margin-bottom:18px}
.rp-keynote a{cursor:pointer;font-weight:600}
.rp-key-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rp-key-row input{flex:1;min-width:200px}
.rp-key-note{font-size:11.5px;color:var(--mut2);margin-top:8px}
.rp-key-set{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--txt)}
.rp-key-set span{color:var(--green);font-weight:600;font-size:13.5px}
.rp-hero{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--accent-fill);border:none;border-radius:20px;padding:20px 22px;color:#fff;cursor:pointer;margin-bottom:8px;transition:.15s}
.rp-hero:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(99,102,241,.3)}
.rp-hero .rp-av{background:rgba(255,255,255,.18)}
.rp-hero-t{display:flex;flex-direction:column;gap:2px}
.rp-hero-t small{font-size:11px;font-weight:700;letter-spacing:1.5px;opacity:.85}
.rp-hero-t b{font-size:20px;font-weight:800}
.rp-hero-go{font-size:13px;opacity:.9;font-weight:600}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.rp-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:18px 14px;cursor:pointer;color:var(--txt);font-family:inherit;transition:.15s}
.rp-card:hover{border-color:var(--acc);transform:translateY(-3px)}
.rp-card b{font-size:14.5px;line-height:1.3}
.rp-card small{color:var(--mut);font-size:12px}
.rp-intro{max-width:600px;margin:10px auto 0;text-align:center}
.rp-intro .rp-av{margin:0 auto 12px}
.rp-persona{color:var(--mut);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:12px}
.rp-h4{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--acc2);margin-bottom:8px;text-align:left}
.rp-points{display:flex;flex-direction:column;gap:10px}
.rp-point{display:flex;align-items:flex-start;gap:12px;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:13px 16px;text-align:left;font-size:14px;transition:.2s}
.rp-point.done{border-color:var(--green);background:rgba(52,211,153,.08)}
.rp-pn{width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:var(--mut)}
.rp-point.done .rp-pn{background:var(--green);color:#fff;border-color:var(--green)}
.rp-live-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.rp-live-top b{font-size:17px}
.rp-live-grid{display:grid;grid-template-columns:260px 1fr 300px;gap:18px;align-items:start}
.rp-live-points,.rp-live-tx{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:16px}
.rp-lp-h,.rp-tx-h{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.rp-live-points .rp-point{margin-bottom:10px}
.rp-live-stage{display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:28px 18px;min-height:340px;justify-content:center}
.rp-live-stage .rp-av{width:130px;height:130px;border-radius:28px}
.rp-mic{width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 28px rgba(99,102,241,.45);transition:.15s}
.rp-mic svg{width:32px;height:32px}
.rp-mic:hover{transform:scale(1.05)}
.rp-mic.on{background:linear-gradient(135deg,#ef4444,#f97316);animation:pulse 1.2s infinite}
.rp-mic.muted{background:var(--card2);border:1px solid var(--line2);color:var(--mut);box-shadow:none}
.rp-start{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:22px}
.rp-status{font-size:13px;color:var(--mut);min-height:18px}
.rp-av-wrap{position:relative;display:grid;place-items:center}
.rp-av-wrap .rp-av{transition:box-shadow .3s,transform .3s}
.rp-live-stage.speaking .rp-av{animation:rpGlow 1.3s ease-in-out infinite}
@keyframes rpGlow{0%,100%{box-shadow:0 0 0 3px rgba(99,102,241,.35),0 0 26px rgba(99,102,241,.45);transform:scale(1)}50%{box-shadow:0 0 0 7px rgba(34,211,238,.28),0 0 46px rgba(34,211,238,.55);transform:scale(1.04)}}
.rp-eq{display:none;gap:4px;height:26px;align-items:flex-end;margin-top:14px}
.rp-live-stage.speaking .rp-eq{display:flex}
.rp-eq span{width:5px;height:8px;background:var(--grad);border-radius:3px;animation:rpBar .9s ease-in-out infinite}
.rp-eq span:nth-child(2){animation-delay:.12s}.rp-eq span:nth-child(3){animation-delay:.24s}.rp-eq span:nth-child(4){animation-delay:.36s}.rp-eq span:nth-child(5){animation-delay:.48s}
@keyframes rpBar{0%,100%{height:7px}50%{height:26px}}
.rp-tx{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.rp-bubble{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.rp-bubble.ai{background:var(--card2);border:1px solid var(--line2);align-self:flex-start;border-bottom-left-radius:4px}
.rp-bubble.me{background:var(--accent-fill);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
/* ---- focused conversation workspace ----
   The conversation used to be a three-column grid inside the page, so on a
   phone the mic scrolled off as soon as the transcript grew and you could not
   speak and read at the same time. This is a full-screen surface instead: the
   character pinned to the top, the transcript scrolling in the middle so the
   whole exchange stays reviewable, and the mic fixed to the bottom. */
.rp-work{position:fixed;top:0;left:0;right:0;bottom:0;z-index:130;background:var(--bg);display:none;flex-direction:column;animation:fade .2s}
.rp-work.show{display:flex}
.rp-work-bar{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line2);background:var(--card);flex:none}
.rp-work-bar .rp-av{width:44px;height:44px;border-radius:14px}
.rp-work-who{min-width:0;flex:1}
.rp-work-who b{display:block;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-work-who small{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-work-bar.speaking .rp-av{animation:rpGlow 1.3s ease-in-out infinite}
.rp-work-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.rp-bubble.draft{opacity:.6;font-style:italic}
.rp-work-foot{flex:none;border-top:1px solid var(--line2);background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.rp-work-foot .rp-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
/* Talking points collapse to a single tappable line so they never crowd the mic */
.rp-pts{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:12px;overflow:hidden}
.rp-pts summary{list-style:none;cursor:pointer;padding:9px 13px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.rp-pts summary::-webkit-details-marker{display:none}
.rp-pts summary .chip{margin-left:auto}
.rp-pts .rp-pts-in{padding:0 11px 11px;display:flex;flex-direction:column;gap:7px}
.rp-pts .rp-point{padding:9px 12px;font-size:13px}
/* Speaking window, shown as a line that drains from the right. It refills every
   time you actually say a word, so it only runs out when you have genuinely
   stopped — a pause mid-sentence can no longer end your turn. */
.rp-timer{width:100%;height:5px;border-radius:3px;background:rgba(148,163,184,.16);overflow:hidden;flex:none;opacity:0;transition:opacity .2s}
.rp-timer i{display:block;height:100%;border-radius:3px;background:var(--grad);transform-origin:left center;transform:scaleX(var(--p,1));transition:transform .2s linear}
.rp-inner.listening .rp-timer{opacity:1}
.rp-mic-wrap{position:relative;width:78px;height:78px;display:grid;place-items:center}
.rp-mic-wrap .rp-mic{position:relative;width:74px;height:74px}
@media(max-width:560px){.rp-work-body{padding:14px 12px}.rp-work-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}}
.rp-modal-ov{position:fixed;inset:0;z-index:140;background:rgba(6,9,18,.7);backdrop-filter:blur(5px);display:grid;place-items:center;padding:22px;animation:fade .2s}
.rp-modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:24px;max-width:400px;width:100%}
.rp-modal b{font-size:18px;display:block;margin-bottom:8px}
.rp-modal p{font-size:14px;color:var(--mut);margin-bottom:18px;line-height:1.5}
.rp-modal-btns{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:820px){.rp-live-grid{grid-template-columns:1fr}.rp-live-stage{order:1}.rp-live-tx{order:2}.rp-live-points{order:3}.rp-live-stage{min-height:220px;padding:20px 18px}.rp-tx{max-height:46vh;min-height:200px}}
/* PRONUNCIATION PRACTICE */
.pron-input{display:flex;gap:8px;max-width:520px;margin-bottom:12px}
.pron-input input{flex:1}
.pron-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.pron-chips-l{font-size:12px;color:var(--mut);margin-right:2px}
.pron-chips .chip{cursor:pointer;transition:.15s}
.pron-chips .chip:hover{border-color:var(--acc);color:var(--txt)}
.pron-card{background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:30px 22px;text-align:center;max-width:560px;margin:0 auto}
.pron-word{font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:-1px}
.pron-stress{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--acc2);margin:6px 0 18px;letter-spacing:1px}
.pron-audio{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.pron-mic{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 30px rgba(99,102,241,.45);transition:.15s;margin:0 auto}
.pron-mic svg{width:36px;height:36px}
.pron-mic:hover{transform:scale(1.05)}
.pron-mic.on{background:linear-gradient(135deg,#ef4444,#f97316);animation:pulse 1.2s infinite}
.pron-status{font-size:13px;color:var(--mut);margin-top:12px;min-height:18px}
.pron-result{margin-top:16px}
.pron-chips-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.pron-verdict{font-size:14.5px;font-weight:600}
.pron-verdict.good{color:var(--green)}
.pron-verdict.work{color:var(--gold)}
.pron-note{max-width:560px;margin:16px auto 0;font-size:12px;color:var(--mut);text-align:center;line-height:1.5}
.manual-doc.help-mode .top,.manual-doc.help-mode .toc{display:none}
.manual-doc .man-ic{display:inline-flex;vertical-align:-3px;margin-right:9px;color:var(--macc);line-height:0}
.manual-doc h2.sec .man-ic svg{width:22px;height:22px}
.manual-doc .man-ic svg{width:19px;height:19px}
.manual-doc .tip .man-ic,.manual-doc .example .man-ic{margin-right:6px;vertical-align:-2px}
.manual-doc .tip .man-ic svg,.manual-doc .example .man-ic svg{width:16px;height:16px}
.man-inl{display:inline-flex;vertical-align:-2px;line-height:0}
.man-inl svg{width:1.05em;height:1.05em}
.manual-doc .man-inl{color:var(--macc)}
.manual-doc .man-inl svg{width:15px;height:15px}
.manual-doc{--macc:#818cf8;--mgold:#fbbf24;--mgreen:#34d399;--mred:#f87171;font-size:15.5px;line-height:1.65}
/* These four were hardcoded dark-theme colours with no light counterpart, so
   the whole Help centre rendered amber-on-white and indigo-on-white in light
   mode — 36 text nodes between 1.2:1 and 2.6:1. Reuse the light palette's
   already-vetted values rather than inventing new ones. */
:root[data-theme="light"] .manual-doc{--macc:#4f46e5;--mgold:#8f4308;--mgreen:#046a4e;--mred:#c01c1c}
.manual-doc .top{background:var(--accent-fill);color:var(--on-accent);padding:34px 22px;text-align:center;border-radius:18px;margin-bottom:0}
.manual-doc .top h1{font-size:clamp(21px,4vw,30px);line-height:1.25;margin:10px 0 12px}
.manual-doc .top p{max-width:640px;margin:0 auto;font-size:15px;opacity:.95}
.manual-doc .top img{width:64px;height:64px;border-radius:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.manual-doc .badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 14px;font-size:12px;font-weight:700;letter-spacing:1px}
.manual-doc .toc{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:20px 24px;margin:16px 0 30px}
.manual-doc .toc h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);margin-bottom:12px}
.manual-doc .toc ol{columns:2;column-gap:34px;padding-left:20px;font-size:14.5px}
.manual-doc .toc li{margin-bottom:6px;break-inside:avoid}
.manual-doc .toc a{color:var(--macc);text-decoration:none;font-weight:600;cursor:pointer}
.manual-doc .toc a:hover{text-decoration:underline}
@media(max-width:640px){.manual-doc .toc ol{columns:1}}
.manual-doc .wrap{padding:0}
.manual-doc section{margin-bottom:44px;scroll-margin-top:80px}
.manual-doc h2.sec{font-size:22px;margin-bottom:6px;padding-top:16px;border-top:2px solid var(--macc);display:flex;gap:10px;align-items:center}
.manual-doc h2.sec .no{background:var(--macc);color:#fff;border-radius:9px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:16px;flex:none}
.manual-doc .lead{color:var(--mut);font-size:15.5px;margin-bottom:18px}
.manual-doc h3{font-size:17px;margin:22px 0 10px;color:var(--txt)}
.manual-doc p{margin-bottom:12px}
.manual-doc figure{margin:18px 0 22px}
.manual-doc figure img{width:100%;border:1px solid var(--line2);border-radius:12px}
.manual-doc figure.small img{max-width:400px;display:block;margin:0 auto}
.manual-doc figcaption{font-size:13px;color:var(--mut);margin-top:8px;text-align:center;font-style:italic}
.manual-doc ol.steps{counter-reset:st;list-style:none;margin:14px 0 20px;padding:0}
.manual-doc ol.steps>li{position:relative;padding:12px 16px 12px 56px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;margin-bottom:10px}
.manual-doc ol.steps>li::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.manual-doc ol.steps b,.manual-doc p b{color:var(--txt)}
.manual-doc .example{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-left:5px solid var(--mgold);border-radius:12px;padding:14px 18px;margin:16px 0 22px}
.manual-doc .example .ttl{font-weight:800;color:var(--mgold);font-size:13px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.manual-doc .example ul{padding-left:20px;margin-bottom:8px}
.manual-doc .say{background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3);border-radius:10px;padding:10px 16px;margin:8px 0;font-style:italic;color:#c7cdff}
.manual-doc .tip{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.28);border-left:5px solid var(--mgreen);border-radius:12px;padding:13px 18px;margin:16px 0}
.manual-doc .tip b{color:var(--mgreen)}
.manual-doc .warn{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.28);border-left:5px solid var(--mred);border-radius:12px;padding:13px 18px;margin:16px 0}
.manual-doc .warn b{color:var(--mred)}
.manual-doc table{width:100%;border-collapse:collapse;font-size:14px;margin:16px 0 22px;background:var(--card2);border-radius:12px;overflow:hidden}
.manual-doc th,.manual-doc td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
.manual-doc th{background:rgba(129,140,248,.14);color:#c7cdff;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* #c7cdff is a dark-theme value used in three places here (th, .say, code).
   On the light build each sat between 1.2:1 and 1.9:1 over its own pale indigo
   wash. One override covers all three. */
:root[data-theme="light"] .manual-doc th,
:root[data-theme="light"] .manual-doc .say,
:root[data-theme="light"] .manual-doc code,
:root[data-theme="light"] .manual-doc kbd{color:#3730a3}
.manual-doc tr:last-child td{border-bottom:none}
.manual-doc code,.manual-doc kbd{background:rgba(129,140,248,.16);color:#c7cdff;border-radius:6px;padding:2px 7px;font-size:13px;font-family:'SF Mono',Menlo,Consolas,monospace}
.manual-doc footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 20px 0;border-top:1px solid var(--line2)}
/* The manual's own footer is a link bar, not prose, so it takes the width floor
   too. #v-manual .manual-doc a (above) only sets min-height, which left these
   at 44x43. The links inside the manual body stay inline — they sit in
   sentences, where a width floor would break the text. */
.manual-doc footer a{color:var(--macc);min-width:44px;justify-content:center}
html[dir="rtl"] .manual-doc th,html[dir="rtl"] .manual-doc td{text-align:right}
html[dir="rtl"] .manual-doc ol.steps>li{padding:12px 56px 12px 16px}
html[dir="rtl"] .manual-doc ol.steps>li::before{left:auto;right:14px}
html[dir="rtl"] .manual-doc h2.sec .no{}

/* ============================================================
   DESIGN-SYSTEM NORMALISATION
   Cross-cutting rules applied last so every screen behaves the
   same. Deliberately does not change colours, type or resting
   spacing — it standardises focus, touch targets and overflow.
   ============================================================ */

/* 1 — Focus. One visible ring for every interactive element (keyboard only). */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,[role=button]:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--acc2);outline-offset:2px;border-radius:8px}
.btn:focus-visible,.pv-opt:focus-visible{outline-offset:3px}

/* 2 — Nothing may push the page sideways. Wide content scrolls inside itself. */
/* `clip` (not `hidden`) — hidden turns these into scroll containers, which
   silently breaks every position:sticky descendant (e.g. .pg-eyebrow). */
html,body{max-width:100%;overflow-x:clip}

/* 2a — ONBOARDING FITS THE SCREEN.
   The welcome/assessment steps were sized in fixed pixels, so on a short phone
   the result step (logo + heading + phrase + score ring + chips + buttons) ran
   past the bottom and had to be scrolled. Every vertical dimension below scales
   with viewport HEIGHT and keeps its original value as the upper bound, so a
   tall screen looks exactly as before while a short one compresses to fit. */
.ob-logo{width:clamp(50px,8.6vh,76px);height:clamp(50px,8.6vh,76px);
  border-radius:clamp(15px,2.5vh,22px);margin-bottom:clamp(8px,2.2vh,20px)}
.ob-logo svg{width:52%;height:52%}
.ob-card h2{font-size:clamp(19px,3.1vh,34px);margin-bottom:clamp(5px,1.1vh,10px)}
.ob-card .sub{margin-bottom:clamp(9px,2.6vh,26px);font-size:clamp(12.5px,1.85vh,15.5px)}
.ob-dots{margin-top:clamp(9px,2.6vh,26px)}
.ob-chips{margin-bottom:clamp(10px,2.6vh,24px)}

.ob-line{font-size:clamp(13.5px,2.15vh,19px);

   ~70px, which is the difference between the result fitting and not. */
@media(max-height:760px){.ob-logo{display:none}}
/* 2b — ZOOM STABILITY. Three separate things make a phone appear to "zoom in";
   all of them are disabled here, without taking away deliberate pinch-zoom. */
html{
  -webkit-text-size-adjust:100%;   /* iOS/Android silently inflating text after rotation */
  text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
/* kill the 300ms double-tap-to-zoom gesture on things meant to be tapped once.
   This selector list previously ended in a comma with no declaration block —
   the @supports rule below sat where the "{…}" should have been, so the CSS
   parser discarded BOTH rules. Keep the block terminated. */
button,a,.btn,.seg-tab,.cat-tab,.tab,.bnav-item,.stat[role=button],.clip-row{touch-action:manipulation}
/* iOS zooms the whole page when focusing a field whose text is under 16px —
   enforced app-wide, not just inside the mobile block */
@supports(-webkit-touch-callout:none){
  input,select,textarea{font-size:max(16px,1em)}
}
main{min-width:0}
.card,.stat,.grid>*{min-width:0}                 /* let grid/flex children shrink */
img,video,canvas,svg{max-width:100%}
pre,code{overflow-wrap:anywhere}
/* tables scroll in their own container rather than widening the page */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 3 — Comfortable touch targets on phones (44px is the accessible minimum). */
@media(max-width:820px){
  .btn{min-height:44px}
  .btn-sm{min-height:44px}
  input,select,textarea{min-height:44px;font-size:16px}  /* 16px stops iOS zoom-on-focus */
  textarea{min-height:88px}
  .seg-tab,.prac-subtab{min-height:44px}
  .voc-mini,.ph-icobtn,.ex-icobtn{min-width:44px;min-height:44px}

/* 4 — Long words / labels wrap instead of overflowing their card. */
h1,h2,h3,.big,.pf-name,.gx-card b,.empty-st b{overflow-wrap:break-word}
/* bottom-nav labels stay on ONE line so every item is the same height —
   the type shrinks slightly on narrow phones instead of wrapping */
.bnav-item span:not(.ic){text-align:center;line-height:1.2;white-space:nowrap}
@media(max-width:400px){.bnav-item span:not(.ic){font-size:9.5px;letter-spacing:-.1px}}
@media(max-width:340px){.bnav-item span:not(.ic){font-size:9px}}

/* 5 — Motion. One hover timing, and honour reduced-motion everywhere. */
/* Single source of truth for reduced motion. Because this is universal and
   !important, a per-component "animation:none" or "transition:none" block adds
   nothing — eleven of them were removed. Only rules that do MORE than stop
   motion are kept next to their component: .btn-primary/.btn-outline suppress
   the :active transform, and onboarding hides the confetti outright. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

function sessScaffold(dd,weekPhrases){

      const name=EMOJI_ICON[raw]||EMOJI_ICON[key];

      if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const span=document.createElement("span");span.className="man-inl";span.innerHTML=ic(name);

function localizeStatic(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.getAttribute("data-i18n"))});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t(el.getAttribute("data-i18n-html"))});
  /* nav tabs: drop the leading emoji from the localized label (icon shown separately) and inject the line icon */
  document.querySelectorAll(".tab-lbl").forEach(el=>{el.textContent=el.textContent.replace(/^[\p{Extended_Pictographic}️‍\s]+/u,"")});
  document.querySelectorAll("[data-ic]").forEach(b=>{const s=b.querySelector(".tab-ic");if(s&&!s.firstChild)s.innerHTML=ic(b.dataset.ic)});
}
function t(key,vars){
  let s=(DICT&&DICT[key]!=null)?DICT[key]:(I18N_EN[key]!=null?I18N_EN[key]:key);
  if(vars)for(const k in vars)s=s.split("{{"+k+"}}").join(vars[k]);
  return s;
}
const RTL_LANGS=new Set(["ar","fa","ur","he","ps","sd","dv","yi"]);
function applyDirLang(code){
  document.documentElement.lang=code||"en";
  document.documentElement.dir=RTL_LANGS.has(code)?"rtl":"ltr";
}
async function loadLangDict(code){
  if(!code||code==="en"){DICT={};return}
  try{const r=await fetch(`i18n/${code}.json`);DICT=r.ok?await r.json():{}}catch(e){DICT={}}
}
async function setLang(code){
  code=code||"en";

/* IndexedDB for recordings */
let DB=null;
const dbReady=new Promise(res=>{
  const rq=indexedDB.open("be12_recordings",1);
  rq.onupgradeneeded=e=>{const db=e.target.result;const st=db.createObjectStore("recs",{keyPath:"id",autoIncrement:true});st.createIndex("ctx","ctx")};
  rq.onsuccess=e=>{DB=e.target.result;res()};
  rq.onerror=()=>res();
});
function addRec(ctx,label,blob,ts){return dbReady.then(()=>new Promise(res=>{
  if(!DB)return res(null);
  const tx=DB.transaction("recs","readwrite");
  tx.objectStore("recs").add({ctx,label,ts:ts||Date.now(),blob});
  tx.oncomplete=()=>res(true);tx.onerror=()=>res(null);
}))}
function allRecs(){return dbReady.then(()=>new Promise(res=>{
  if(!DB)return res([]);
  const rq=DB.transaction("recs").objectStore("recs").getAll();
  rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([]);
}))}
function getRecs(ctx){return dbReady.then(()=>new Promise(res=>{
  if(!DB)return res([]);
  const out=[];const tx=DB.transaction("recs");
  tx.objectStore("recs").index("ctx").openCursor(IDBKeyRange.only(ctx)).onsuccess=e=>{
    const c=e.target.result;if(c){out.push(c.value);c.continue()}else res(out.sort((a,b)=>b.ts-a.ts))};
  tx.onerror=()=>res([]);
}))}
function delRec(id){return dbReady.then(()=>new Promise(res=>{
  if(!DB)return res();
  const tx=DB.transaction("recs","readwrite");const store=tx.objectStore("recs");
  /* Read the record first so we can tombstone it (by name) — this stops GitHub
     auto-sync from re-downloading a recording you deleted. */
  const gr=store.get(id);
  gr.onsuccess=()=>{const rec=gr.result;
    if(rec){try{const nm=recName(rec);GH.del=GH.del||{};GH.del[nm]=1;if(GH.up)delete GH.up[nm];saveGH();if(ghCfg())ghDeleteRepoRec(nm)}catch(e){}}
    store.delete(id);
  };
  tx.oncomplete=res;tx.onerror=res;
}))}
function countRecs(){return dbReady.then(()=>new Promise(res=>{
  if(!DB)return res(0);
  const rq=DB.transaction("recs").objectStore("recs").count();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(0);
}))}

/* ================= GITHUB SYNC ================= */
/* Progress + recordings are pushed to a (private) GitHub repo via the Contents API,
   so any device with the token can load everything. Token lives ONLY in this browser
   (separate localStorage key — never included in progress.json or JSON exports). */
const GH_KEY="be12_gh";
let GH=(function(){try{return JSON.parse(localStorage.getItem(GH_KEY))||{}}catch(e){return{}}})();
function saveGH(){localStorage.setItem(GH_KEY,JSON.stringify(GH))}
function ghCfg(){return !!(GH.token&&GH.owner&&GH.repo)}
const ghBranch=()=>GH.branch||"main";
async function gh(path,opt={}){
  const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}${path?"/"+path:""}`;
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json"},opt.headers||{})}));
  if(r.status===404)return null;
  if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error(m||("HTTP "+r.status))}
  return r.json();
}
async function ghSha(path){try{const d=await gh(`contents/${path}?ref=${ghBranch()}`);return(d&&d.sha)||null}catch(e){return null}}
async function ghPut(path,b64,msg){
  const body={message:msg,content:b64,branch:ghBranch()};
  /* Re-fetch the file's sha and retry on conflict ("does not match"): the sha can
     go stale between the GET and the PUT when saves overlap. */
  let lastErr=null;
  for(let attempt=0;attempt<4;attempt++){
    const sha=await ghSha(path);if(sha)body.sha=sha;else delete body.sha;
    try{return await gh(`contents/${path}`,{method:"PUT",body:JSON.stringify(body)})}
    catch(e){lastErr=e;await new Promise(r=>setTimeout(r,250*(attempt+1)))}
  }
  throw lastErr;
}
async function ghDeleteRepoRec(name){
  try{const sha=await ghSha("recordings/"+name);if(!sha)return;
    await gh(`contents/recordings/${name}`,{method:"DELETE",body:JSON.stringify({message:"delete recording",sha,branch:ghBranch()})})}
  catch(e){}
}
const b64Enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64Dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,""))));
const blobToB64=blob=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.readAsDataURL(blob)});
function b64ToBlob(b64,type){const bin=atob(b64.replace(/\n/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})}
let ghTimer=null;
function ghQueue(){clearTimeout(ghTimer);ghTimer=setTimeout(()=>ghPush(true),5000)}
function ghStatus(msg){const el=document.getElementById("ghStatus");if(el)el.textContent=msg}
function ghMetaText(){return ghCfg()?t("acc.gh_connected",{repo:GH.owner+"/"+GH.repo,branch:ghBranch()})+(GH.last?t("acc.gh_last_sync",{when:new Date(GH.last).toLocaleString()}):"")+(GH.auto?t("acc.gh_auto_suffix"):""):t("acc.gh_not_connected")}
function refreshGhMeta(){const el=document.getElementById("ghMeta");if(el)el.textContent=ghMetaText()}
let ghPushing=false,ghPushAgain=false;
async function ghPush(silent){
  if(!ghCfg()){if(!silent)toast(t("gh.connect_first_data"));return}
  if(ghPushing){ghPushAgain=true;return}   /* coalesce overlapping saves */
  ghPushing=true;
  ghStatus(t("gh.saving"));
  try{await ghPut("progress.json",b64Enc(JSON.stringify(S,null,1)),"progress sync "+new Date().toISOString());
    GH.last=Date.now();saveGH();ghStatus("");if(!silent)toast(t("gh.saved_toast"));refreshGhMeta()}
  catch(e){ghStatus("");if(!silent)toast(t("gh.save_failed",{err:e.message}))}  /* background failures stay quiet — the retry loop handles transient conflicts */
  ghPushing=false;
  if(ghPushAgain){ghPushAgain=false;setTimeout(()=>ghPush(true),300)}
}
async function ghPull(){
  if(!ghCfg())return toast(t("gh.connect_first"));
  ghStatus(t("gh.loading"));
  try{const d=await gh(`contents/progress.json?ref=${ghBranch()}`);
    if(!d){ghStatus("");return toast(t("gh.no_progress"))}
    const data=JSON.parse(b64Dec(d.content));
    if(!data.days)throw new Error("unexpected file format");
    if(!await askConfirm({title:t("cf.import_title"),body:t("gh.replace_confirm"),confirmLabel:t("cf.import_ok")})){ghStatus("");return}
    data.tutor=data.tutor||{};S=data;localStorage.setItem(LS_KEY,JSON.stringify(S));
    GH.last=Date.now();saveGH();ghStatus("");toast(t("gh.loaded_toast"));go("home")}
  catch(e){ghStatus("");toast(t("gh.load_failed",{err:e.message}))}
}
const recName=r=>`${r.ctx}__${r.ts}.webm`;
function labelFor(ctx){
  if(ctx.startsWith("phrase")){const p=trackPhrases()[+ctx.slice(6)];return p?p.p.slice(0,40):"phrase"}
  const m=ctx.match(/^w(\d+)([A-Za-z]{3})$/);return m?`W${m[1]} ${m[2]}`:ctx;
}
async function ghUpRecs(){
  if(!ghCfg())return toast(t("gh.connect_first"));
  const recs=await allRecs();GH.up=GH.up||{};
  const todo=recs.filter(r=>!GH.up[recName(r)]);
  if(!todo.length)return toast(t("gh.all_uploaded"));
  let n=0;
  for(const r of todo){
    ghStatus(t("gh.uploading",{i:n+1,total:todo.length}));
    try{await ghPut("recordings/"+recName(r),await blobToB64(r.blob),"recording upload");GH.up[recName(r)]=1;saveGH();n++}
    catch(e){ghStatus("");toast(t("gh.upload_failed",{n,err:e.message}));refreshGhMeta();return}
  }
  GH.last=Date.now();saveGH();ghStatus("");toast(t(n>1?"gh.uploaded_many":"gh.uploaded_one",{n}));go("data");
}
async function ghDownRecs(){
  if(!ghCfg())return toast(t("gh.connect_first"));
  ghStatus(t("gh.checking"));
  try{const list=await gh(`contents/recordings?ref=${ghBranch()}`);
    if(!list||!Array.isArray(list)||!list.length){ghStatus("");return toast(t("gh.no_cloud_recs"))}
    const local=new Set((await allRecs()).map(recName));GH.up=GH.up||{};GH.del=GH.del||{};
    const todo=list.filter(f=>f.name.endsWith(".webm")&&!local.has(f.name)&&!GH.del[f.name]);
    if(!todo.length){ghStatus("");return toast(t("gh.all_local"))}
    let n=0;
    for(const f of todo){
      ghStatus(t("gh.downloading",{i:n+1,total:todo.length}));
      const blob=await gh(`git/blobs/${f.sha}`);
      const parts=f.name.replace(".webm","").split("__");
      await addRec(parts[0],labelFor(parts[0]),b64ToBlob(blob.content,"audio/webm"),+parts[1]||Date.now());
      GH.up[f.name]=1;saveGH();n++;
    }
    ghStatus("");toast(t(n>1?"gh.restored_many":"gh.restored_one",{n}));go("data")}
  catch(e){ghStatus("");toast(t("gh.restore_failed",{err:e.message}))}
}
/* ---- fully automatic sync ---- */
let ghRecBusy=false;
async function ghAutoStart(){
  if(!ghCfg()||!GH.auto)return;
  try{
    const d=await gh(`contents/progress.json?ref=${ghBranch()}`);
    if(d){
      const data=JSON.parse(b64Dec(d.content));
      if(data.days&&(data.savedAt||0)>(S.savedAt||0)){
        data.tutor=data.tutor||{};S=data;localStorage.setItem(LS_KEY,JSON.stringify(S));
        GH.last=Date.now();saveGH();toast(t("gh.latest_loaded"));
        go(cur.v==="session"?"session":cur.v,cur.arg1,cur.arg2);
      }else if((S.savedAt||0)>(data.savedAt||0)){ghPush(true)}
    }else if(S.savedAt){ghPush(true)}
    ghSyncRecs(false);
  }catch(e){}
}
async function ghSyncRecs(uploadOnly){
  if(!ghCfg()||ghRecBusy)return;ghRecBusy=true;
  try{
    GH.up=GH.up||{};
    const local=await allRecs();
    for(const r of local){const nm=recName(r);
      if(!GH.up[nm]){await ghPut("recordings/"+nm,await blobToB64(r.blob),"rec auto-sync");GH.up[nm]=1;GH.last=Date.now();saveGH()}}
    if(!uploadOnly){
      const list=await gh(`contents/recordings?ref=${ghBranch()}`);
      if(Array.isArray(list)){
        const have=new Set(local.map(recName));GH.del=GH.del||{};let n=0;
        for(const f of list){
          if(!f.name.endsWith(".webm")||have.has(f.name)||GH.del[f.name])continue;
          const b=await gh(`git/blobs/${f.sha}`);
          const parts=f.name.replace(".webm","").split("__");
          await addRec(parts[0],labelFor(parts[0]),b64ToBlob(b.content,"audio/webm"),+parts[1]||Date.now());

const dayKey=(w,d)=>`w${w}${d}`;

function totalDone(){return Object.keys(S.days).filter(k=>S.days[k]).length}

function currentPos(){
  const weeks=trackWeeks(),days=trackDays();
  for(const w of weeks){for(const d of days){if(!S.days[dayKey(w.n,d)])return{w:w.n,d}}}
  const last=weeks[weeks.length-1]||{n:1};
  return {w:last.n,d:days[days.length-1]||"Sun"};

function markPracticed(){
  const today=new Date().toISOString().slice(0,10);
  if(!S.dates.includes(today)){S.dates.push(today);S.dates.sort()}
  S.dayLog=S.dayLog||{};S.dayLog[today]=(S.dayLog[today]||0)+1;   // activity intensity for the progress calendar heatmap
  if(S.dayLog[today]===1){
    // once per day, not per action. Week alongside streak so retention can be
    // read against how far into the programme someone actually is.
    track("practice_day",{streak:String(Math.min(streak()+1,30)),week:String((currentPos().w||1))});

  }

function streak(){
  if(!S.dates.length)return 0;
  const set=new Set(S.dates);let n=0;const d=new Date();
  if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}

}

/* wrap every occurrence of the search term in <mark class="help-hl"> within a section */
function helpHighlight(root,q){
  const rx=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const targets=[];let n;
  while(n=walker.nextNode()){if(n.nodeValue&&n.nodeValue.toLowerCase().includes(q))targets.push(n);}
  targets.forEach(node=>{
    const s=node.nodeValue,frag=document.createDocumentFragment();
    let last=0,m;rx.lastIndex=0;
    while(m=rx.exec(s)){
      if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const mk=document.createElement("mark");mk.className="help-hl";mk.textContent=m[0];frag.appendChild(mk);
      last=m.index+m[0].length;
      if(m.index===rx.lastIndex)rx.lastIndex++;   // guard against zero-length matches
    }
    if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
}

/* ---- In-app document viewer -------------------------------------------
   ONE pattern for every internal document reached from the footer. Anything
   added later gets the same close behaviour by calling openDoc() — there is
   deliberately no per-document implementation.

   Why an overlay and not a route: "close" has to put the user back exactly
   where they were, including scroll offset, the active tab, text they had
   typed, a running session and any playback. An overlay never unmounts the
   view underneath, so all of that survives for free. Navigating away and back
   would re-render and lose it. */
let _docPrevFocus=null,_docHistory=false;
window.openDoc=function(src,title,opts){
  opts=opts||{};
  closeDoc(true);                       // never stack — always exactly one panel
  _docPrevFocus=document.activeElement;
  const theme=document.documentElement.getAttribute("data-theme")||"dark";
  const ov=document.createElement("div");
  ov.id="docOv";ov.className="doc-ov";
  ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
  ov.setAttribute("aria-label",title||"");
  ov.innerHTML=`<button type="button" class="doc-close" onclick="closeDoc()" aria-label="${esc(t("doc.close"))}">${ic("close")}</button>`
    +(opts.theme?`<button type="button" class="doc-theme" onclick="docToggleTheme()" aria-label="${esc(t("acc.theme_label"))}">${ic(theme==="light"?"moon":"sun")}</button>`:"")
    +`<iframe class="doc-frame" src="${src}" title="${esc(title||"")}"></iframe>`;
  document.body.appendChild(ov);
  /* Stop the page underneath scrolling behind the sheet. overflow:hidden keeps
     the scroll offset, so restoring it on close lands on the same pixel. */
  document.body.style.overflow="hidden";
  /* One history entry so the Android hardware back button (and the TWA's back
     gesture) dismisses the document instead of leaving the app. go() uses
     replaceState, so this is the only pushed entry and cannot stack up. */
  try{history.pushState({doc:1},"");_docHistory=true}catch(e){_docHistory=false}
  setTimeout(()=>{const b=ov.querySelector(".doc-close");if(b)b.focus()},60);
};
/* silent=true is the internal teardown; a user-initiated close also unwinds
   the history entry it pushed, so no duplicate entries accumulate. */
window.closeDoc=function(silent){
  const ov=document.getElementById("docOv");
  if(!ov)return;
  ov.remove();
  document.body.style.overflow="";
  if(!silent&&_docHistory){_docHistory=false;try{history.back()}catch(e){}}
  if(!silent&&_docPrevFocus&&document.contains(_docPrevFocus)){try{_docPrevFocus.focus()}catch(e){}}
  _docPrevFocus=null;
};

addEventListener("popstate",()=>{if(document.getElementById("docOv")){_docHistory=false;closeDoc(true);

/* Every footer document routes through the viewer via ONE delegated handler.
   Delegation rather than per-link markup for two reasons: the first footer row
   is a single translated HTML string (footer.note) that setLang() rewrites
   wholesale, so an inline onclick there would have to be re-added in all 15
   translation files; and any link added to the footer later inherits this with
   no extra work, which is the point.

   Two links are deliberately NOT captured: Support is a mailto: that belongs to
   the mail client, and Google Play is a different origin we cannot frame or
   add chrome to. */
addEventListener("click",e=>{
  const a=e.target&&e.target.closest&&e.target.closest(".footer-note a[href]");
  if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;

  if(/^(mailto:|tel:)/i.test(href))return;

  if(/flyer\.html$/.test(u.pathname))return openAbout();

     collapsible sections and line-icons that the raw file does not. Route to it
     rather than framing the static page, and remember where we came from so
     its Back button returns there instead of always landing on Profile. */
  if(/manual\/[a-z-]+\.html$/.test(u.pathname)){_manReturn=cur&&cur.v;return go("manual")}

});

/* The nine metrics. Each used to carry its own "here is how to fix this zero"
   paragraph, which meant a committed user (six-day streak, six sessions) met an
   825px wall in which seven tiles read 0 and six of them nagged. The tiles now
   just count, earned ones first, and the single most useful next step is stated
   once beneath the panel. Nothing was dropped: all nine stay rendered, tappable
   and keyboard-operable, and every next-step string is still a live i18n key. */
function homeMetrics(pos,recN){
  const sess="go('session',"+pos.w+",'"+pos.d+"')";
  const vocN=Object.keys(S.vocab||{}).length;
  const pron=rpScoreStats();
  const M=[
    {ic:"flame", n:streak(),                                                  suf:"",             lbl:"stat_streak",     next:"next_streak",     go:sess,             zero:streak()===0},
    {ic:"check", n:totalDone(),                                               suf:"/"+trackSessionCount(),lbl:"stat_sessions",   next:"next_sessions",   go:sess,             zero:totalDone()===0},
    {ic:"mic",   n:recN,                                                      suf:"",             lbl:"stat_recordings", next:"next_recordings", go:sess,             zero:recN===0},
    {ic:"chat",  n:masteredCount(),                                           suf:"/"+trackPhrases().length, lbl:"stat_phrases",next:"next_phrases",    go:"go('phrases')",  zero:masteredCount()===0},
    {ic:"book",  n:Object.keys(S.vocab||{}).filter(w=>vocState(w)==="learned").length, suf:"/"+vocN, lbl:"stat_vocab",  next:"next_vocab",      go:"go('practice')", zero:vocN===0},
    {ic:"target",n:(S.clips||[]).length,                                      suf:"",             lbl:"stat_clips",      next:"next_clips",      go:"go('shadow')",   zero:(S.clips||[]).length===0},
    {ic:"chat",  n:(S.convos||[]).length,                                     suf:"",             lbl:"stat_convos",     next:"next_convos",     go:"go('roleplay')", zero:(S.convos||[]).length===0},
    {ic:"pencil",n:Object.values(S.gram||{}).reduce((a,g)=>a+((g&&g.runs)||0),0), suf:"",         lbl:"stat_drills",     next:"next_drills",     go:"go('practice')", zero:!Object.keys(S.gram||{}).length},
    {ic:"mic",   n:pron.latest!=null?pron.latest+"%":"—",                     suf:"",             lbl:"stat_pron",       next:"next_pron",       go:"go('roleplay')", zero:!pron.scored},
  ];
  /* Two different questions, so two different flags. `dim` is about the tile —
     is the number it shows still nothing? `zero` is about the advice — is the
     underlying activity untouched, which is what makes a next-step line
     truthful. They diverge: 0 of 5 saved words mastered is a dim tile, but the
     right advice there is not "save some words", because five are already
     saved. */
  M.forEach(m=>{ m.dim = !m.n || m.n==="—"; });
  /* Dimming is a contrast device: it works because earned tiles sit beside
     unearned ones. On day one everything is empty, and a wholly greyed panel
     reads as broken rather than as "not yet", so nothing is dimmed. */
  if(M.every(m=>m.dim))M.forEach(m=>{m.dim=false});
  const sorted=M.filter(m=>!m.dim).concat(M.filter(m=>m.dim));
  const step=M.find(m=>m.zero);          // the first untouched activity, in priority order
  return `
  <div class="grid g4 stats-center home-dash">
    ${sorted.map(m=>statCard(m.ic,m.n,m.suf,t("home."+m.lbl),m.dim,m.go)).join("")}
  </div>
  ${step?`<button class="home-step" onclick="${step.go}">
    <span>${t("home."+step.next)}</span>
    <span class="home-step-go" aria-hidden="true">→</span>
  </button>`:""}`;
}

/* A dashboard stat. `empty` marks a metric still at zero — it dims the tile
   rather than appending advice, so the panel keeps one uniform row height and
   the guidance is stated once, below the grid, by homeMetrics(). Always
   tappable, and the tap still lands on the screen that changes the number. */
function statCard(icon,n,suffix,label,empty,onclick){
  return `<div class="stat${empty?" stat-empty":""}" style="cursor:pointer" onclick="${onclick}" role="button" tabindex="0"

    <div class="l">${label}</div>
  </div>`;
}

   behind a control the user had to scroll past the fold to discover. It is now
   one linear flow: prepare, run the clock, produce evidence, close out. The
   plan survives as a closed disclosure under the timer, which is what
   "the checklist goes last so practice comes first" was always meant to mean.
