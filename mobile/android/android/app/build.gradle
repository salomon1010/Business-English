apply plugin: 'com.android.application'

android {
    namespace = "com.bemastery.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // BE_TEST_ADS: a staging build (./gradlew -PbeStaging=true …, scripts/build.sh --staging)
        // requests Google's TEST ad units only, like a debug build. A production release is false.
        buildConfigField "boolean", "BE_TEST_ADS", (project.findProperty("beStaging") == "true") ? "true" : "false"
        // BE_STAGING: the build talks to be-mastery-test. BEAuthPlugin.available() reads it to
        // offer e-mail only there, because Google and Apple can only finish on a production build.
        buildConfigField "boolean", "BE_STAGING", (project.findProperty("beStaging") == "true") ? "true" : "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }

    // ===================== THE TWO-APP SPLIT (12 Oct 2026) =====================
    // One project, two Play apps, built from the same sources:
    //
    //   general  BE Mastery            com.bemastery.app                 (the EXISTING app — identity unchanged)
    //   welding  BE Mastery Welding    com.lomonec.bemastery.welding     (new)
    //
    // The programme is decided by the BUILD, not by the learner: the web bundle
    // in assets carries be-build.js {track:"<id>"} (mobile/ios/scripts/sync-web.mjs
    // --track <id>) and index.html reads it as BE_APP_TRACK. BE_PROGRAMME below
    // is the same value for the native half, and verifyWebBundleProgramme makes
    // the two agree before anything is packaged — so a Welding build can never
    // ship the General English web app, or the reverse.
    // docs/APP_SPLIT.md has the store-side steps that only the owner can do.
    flavorDimensions "programme"
    productFlavors {
        general {
            dimension "programme"
            applicationId "com.bemastery.app"
            // Above every code already uploaded: the Play TWA's last was 10 (twa-manifest.json)
            // and the staging internal-test bundles of this shell ran 12-17, so the first
            // PRODUCTION bundle of the native shell is 18. Play only installs a higher one.
            // 18 was built before Phase C and cannot sell (billing_enabled was false and
            // ENT_API empty in its bundled web code); 19 is the first bundle that can.
            // 20 (19 Oct 2026) is the OFFLINE SHELL fix: every bundle up to 19
            // installed no service worker at all. sw.js precached with
            // cache.addAll(SHELL), which rejects wholesale on a single 404, and a
            // single-programme bundle does not carry the other programme's files —
            // so the install always failed and the app had no offline shell. It
            // looks fine until the connection goes. sw.js now adds each entry on
            // its own and sync-web prunes SHELL to the files the bundle carries.
            // 20 IS SPENT — it is the LIVE production release (name 1.2.1),
            // confirmed against the Play Developer API on 22 Oct 2026, which
            // also showed 5, 8, 14-17 and 19 consumed. Play refuses a reused
            // code outright, so 21 is the first bundle that can be uploaded.
            // 21 carries the usage meters (docs/USAGE-LIMITS-ANDROID.md): a
            // usage-indicator card on four surfaces. It changes no quota and is
            // INERT in production today, because the deployed Worker sends no
            // X-BE-Allowance header for it to read.
            // 21 went to the internal track on 22 Oct and is superseded before it
            // ever reached production: it carried the usage meters but not the
            // purchase-message fixes below, so promoting it would have shipped the
            // misleading "No purchases found for this account" to real learners.
            // 23 (30 Oct 2026): web be12-v695 — Premium per app, no offer over a paying
            // learner, the widget and account-deletion fixes. Play held 22 in production.
            // 24 (31 Oct 2026): web be12-v696 — adds the trial reminder. Supersedes 23 (a draft, never released).
            // 25 (31 Oct 2026): web be12-v697 — adds the "same time tomorrow?" prompt and the per-app AI allowance. The production release.
            // 26 (31 Oct 2026): web be12-v700 — REAL ADS on (ads_enabled) and Play's in-app review card (BEReviewPlugin).
            //    Needs "Contains ads: Yes" + the Data safety update in Play Console before it reaches production.
            versionCode 27
            versionName "1.2.8"
            buildConfigField "String", "BE_PROGRAMME", '"general-english"'
            // Sign in with Apple opens Apple's page in a Custom Tab and auth.lomonec.com
            // hands the answer back on bemastery://apple. Only ONE app may claim a
            // scheme, so this name stays with the existing app and Welding has its
            // own; since 14 Oct 2026 the proxy picks between them from the state's
            // prefix (bea. here), so both apps can offer the button. Unchanged here.
            manifestPlaceholders = [beAppleScheme: "bemastery", beAppleHost: "apple", beWidgetScheme: "bemastery"]
        }
        welding {
            dimension "programme"
            applicationId "com.lomonec.bemastery.welding"
            // 1 IS GONE (14 Oct 2026). The note here used to say nothing had ever
            // been uploaded under this package; that was true when it was written
            // and is not now — Play holds a completed internal release,
            // "Welding-1.0.0-internal-1", built before the Welding branding
            // existed. Play refuses a reused code outright ("Version code 1 has
            // already been used"), and a code is consumed the moment a bundle is
            // accepted, whether or not the release ever ships. So 2 is the first
            // bundle that can carry the new logo, and 3 the first that can offer
            // Sign in with Apple: be-auth was deployed 14 Oct 2026 (see below),
            // and a build carrying that button must never precede that deploy.
            // 3 IS SPENT. It reached internal testing and is not worth testing:
            // it opened on a full-screen "install this app from Google Play"
            // card — in the app, over the sign-in sheet, pointing at the OTHER
            // app. 4 is the first bundle a tester should be given.
            // 5 (19 Oct 2026): the offline-shell fix, as for the other app —
            // 4 installed no service worker. See the note on versionCode 20 above.
            // 5 IS SPENT — it is the LIVE production release (name 1.0.1),
            // confirmed against the Play Developer API on 22 Oct 2026, which
            // also showed 1-4 consumed. 6 is the first bundle that can be
            // uploaded, and carries the same usage meters as the other app's 21.
            // 6 went to the internal track on 22 Oct and is superseded for the same
            // reason as the other app's 21 — see the note there.
            // 8 (30 Oct 2026): web be12-v695, as the other app's 23. Play held 7 in production.
            // 9 (31 Oct 2026): web be12-v696, as the other app's 24. Supersedes 8 (a draft, never released).
            // 10 (31 Oct 2026): web be12-v697, as the other app's 25. The production release.
            // 11 (31 Oct 2026): web be12-v700, as the other app's 26 (ads only in the game hubs on Welding).
            versionCode 12
            versionName "1.0.8"
            buildConfigField "String", "BE_PROGRAMME", '"welding"'
            // NOT bemastery://apple: only one installed app may claim a scheme, and
            // a second claimant would put a chooser between the learner and their
            // sign-in. So this app claims its own. Since 14 Oct 2026 the proxy at
            // auth.lomonec.com picks the scheme from the state's PREFIX (bew. ->
            // here, bea. -> the existing app), so Apple now works in both apps —
            // BEAuthPlugin.appleStatePrefix() must keep agreeing with this name.
            // beWidgetScheme stays "bemastery" in BOTH apps: a widget tap is an
            // EXPLICIT intent (BEWidgetLaunch.setClassName), so each app's widgets
            // always open that app and the scheme is only a label.
            manifestPlaceholders = [beAppleScheme: "bemasterywelding", beAppleHost: "apple", beWidgetScheme: "bemastery"]
        }
    }
    // The home-screen widgets and the streak countdown are the Play TWA's own sources, used
    // where they are (one copy for both builds): playstore/android-widget/src/main. Only the
    // debug-only preview screen there is left out. BEWidgetPlugin feeds them from the page.
    sourceSets {
        main {
            java.srcDirs += '../../../../playstore/android-widget/src/main/java'
            res.srcDirs += '../../../../playstore/android-widget/src/main/res'
        }
    }
    // The Play UPLOAD key (alias bemastery, SHA-256 3D:E6:6D…; Play App Signing re-signs for
    // learners). Nothing secret is in the repo: scripts/release.sh passes the keystore path and
    // passwords as environment variables; without them a release build is simply unsigned.
    signingConfigs {
        upload {
            if (System.getenv("BE_KEYSTORE")) {
                storeFile file(System.getenv("BE_KEYSTORE"))
                storePassword System.getenv("BE_KEYSTORE_PASS")
                keyAlias System.getenv("BE_KEY_ALIAS") ?: "bemastery"
                keyPassword System.getenv("BE_KEY_PASS") ?: System.getenv("BE_KEYSTORE_PASS")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("BE_KEYSTORE")) signingConfig signingConfigs.upload
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // AdMob + Google's consent tool (UMP), as on iOS (BEAdsPlugin)
    implementation "com.google.android.gms:play-services-ads:24.6.0"
    implementation "com.google.android.ump:user-messaging-platform:3.2.0"
    // Play Billing Library 8 (required for app updates from 31 Aug 2026), as the TWA used through androidbrowserhelper
    implementation "com.android.billingclient:billing:8.0.0"
    // Google Play's in-app review card (BEReviewPlugin): rating without leaving the app
    implementation "com.google.android.play:review:2.0.2"
    // notifications: FCM data messages from be-push (BEMessagingService). Without google-services.json
    // Firebase stays uninitialised and BEPush.available() answers false.
    implementation platform("com.google.firebase:firebase-bom:34.0.0")
    implementation "com.google.firebase:firebase-messaging"
    // Google sign-in (BEAuthPlugin): Credential Manager + Google's ID-token option
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    // Sign in with Apple opens Apple's page in a Custom Tab
    implementation "androidx.browser:browser:1.8.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ===== the web bundle in assets must be the one this flavor is for ============
// mobile/ios/scripts/sync-web.mjs writes BUNDLE_INFO.txt with "programme <id>".
// Capacitor copies ONE bundle into src/main/assets/public, shared by both
// flavors, so the only thing standing between "I forgot to re-sync" and a
// Welding listing full of General English lessons is this check. It runs before
// the assets are merged, for every variant, and fails the build on a mismatch.
// An unsplit bundle ("both (unsplit)") is refused too: a store build must be
// one programme or the other.
android.applicationVariants.all { variant ->
    def want = variant.productFlavors*.name.contains("welding") ? "welding" : "general-english"
    def check = tasks.register("verify${variant.name.capitalize()}WebBundleProgramme") {
        doLast {
            def info = file("src/main/assets/public/BUNDLE_INFO.txt")
            if (!info.exists()) throw new GradleException(
                "No web bundle in src/main/assets/public. Run:  cd mobile/android && npm run sync:${want == 'welding' ? 'welding' : 'general'}")
            def m = (info.text =~ /(?m)^programme (.+)$/)
            def got = m ? m[0][1].trim() : "(none)"
            if (got != want) throw new GradleException(
                "The web bundle in assets is for '${got}' but this is the ${variant.name} build, which needs '${want}'.\n" +
                "Run:  cd mobile/android && npm run sync:${want == 'welding' ? 'welding' : 'general'}")
            println "web bundle programme OK: ${got}"
        }
    }
    variant.mergeAssetsProvider.configure { dependsOn check }
}
